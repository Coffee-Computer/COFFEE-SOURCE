<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.list() Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; box-sizing: border-box; }
  </style>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../COFFEE-UI/coffee-ui.js"></script>
  <script src="./coffee-list.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    coffee.injectTheme('dark');

    const header = coffee.heading('coffee.list()', 1);
    const sub = coffee.para('Generic list for data display. Custom renderItem, onItemClick.');
    sub.style.color = 'var(--coffee-text-muted)';

    const items = [
      { id: 1, name: 'Alice', role: 'Admin' },
      { id: 2, name: 'Bob', role: 'User' },
      { id: 3, name: 'Carol', role: 'User' }
    ];

    const list = coffee.list(items, {
      renderItem: (item) => {
        const d = document.createElement('div');
        d.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--coffee-bg-elev);border-radius:8px;border:1px solid var(--coffee-panel)';
        d.innerHTML = '<span style="font-weight:500">' + item.name + '</span><span style="font-size:12px;color:var(--coffee-text-muted)">' + item.role + '</span>';
        return d;
      },
      onItemClick: (item) => alert('Clicked: ' + item.name),
      emptyMessage: 'No users'
    });

    const card = coffee.card([header, sub, list], { style: { width: '100%', maxWidth: '400px' } });

    const app = document.getElementById('app');
    app.style.cssText = 'padding:var(--coffee-space-lg);width:100%;max-width:100%;background:var(--coffee-bg-surface);min-height:100vh;box-sizing:border-box';
    app.appendChild(card);
  </script>
</body>
</html>

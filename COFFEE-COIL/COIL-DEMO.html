<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.coil — Preset House Demo</title>
  <style>
    body { margin: 0; padding: 2rem; background: #0a0a0a; color: #e0e0e0; font-family: system-ui; }
    pre { background: #1a1a1a; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; background: #333; border: 1px solid #555; color: #fff; border-radius: 6px; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>coffee.coil</h1>
  <p>Template/preset house. Load presets for FORGE → ART pipeline.</p>

  <div>
    <button data-engine="flow" data-preset="default">flow / default</button>
    <button data-engine="flow" data-preset="warm">flow / warm</button>
    <button data-engine="flow" data-preset="cool">flow / cool</button>
    <button data-engine="fractal" data-preset="default">fractal / default</button>
    <button data-engine="orbit" data-preset="default">orbit / default</button>
    <button data-engine="glitch" data-preset="default">glitch / default</button>
  </div>

  <h3>Loaded preset:</h3>
  <pre id="out">Click a button to load</pre>

  <script src="./coffee-coil.js"></script>
  <script>
    document.querySelectorAll('button').forEach(btn => {
      btn.onclick = async () => {
        const engine = btn.dataset.engine;
        const preset = btn.dataset.preset;
        try {
          const p = await coffee.coil.load(engine, preset, { baseUrl: './presets/' });
          document.getElementById('out').textContent = JSON.stringify(p, null, 2);
        } catch (e) {
          document.getElementById('out').textContent = 'Error: ' + e.message;
        }
      };
    });
  </script>
</body>
</html>

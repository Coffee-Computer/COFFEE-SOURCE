<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.table() Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; box-sizing: border-box; }
  </style>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../COFFEE-UI/coffee-ui.js"></script>
  <script src="./coffee-table.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    coffee.injectTheme('dark');

    const header = coffee.heading('coffee.table()', 1);
    const sub = coffee.para('Generic table for tabular data. Auto or explicit columns.');
    sub.style.color = 'var(--coffee-text-muted)';

    const data = [
      { id: 1, name: 'Alice', role: 'Admin', joined: '2024-01' },
      { id: 2, name: 'Bob', role: 'User', joined: '2024-02' },
      { id: 3, name: 'Carol', role: 'User', joined: '2024-03' }
    ];

    const table = coffee.table(data, {
      columns: [
        { key: 'name', label: 'Name' },
        { key: 'role', label: 'Role' },
        { key: 'joined', label: 'Joined' }
      ],
      onRowClick: (row) => alert('Row: ' + row.name),
      emptyMessage: 'No rows'
    });

    const card = coffee.card([header, sub, table], { style: { width: '100%', maxWidth: '100%', overflow: 'auto' } });

    const app = document.getElementById('app');
    app.style.cssText = 'padding:var(--coffee-space-lg);width:100%;max-width:100%;background:var(--coffee-bg-surface);min-height:100vh;box-sizing:border-box';
    app.appendChild(card);
  </script>
</body>
</html>

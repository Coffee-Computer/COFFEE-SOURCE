<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Snake - Python Execution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Updated to a more stable Pyodide CDN version -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --coffee-cream: #fdfaf6;
            --coffee-deep: #1b130c;
            --snake-green: #22c55e;
        }
        body {
            background-color: var(--coffee-cream);
            color: var(--coffee-deep);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .code-editor {
            font-family: 'Fira Code', 'Courier New', monospace;
            resize: none;
            background: #1e1e1e;
            color: #d4d4d4;
            line-height: 1.5;
        }
        .console {
            background: #000;
            color: #00ff00;
            font-family: 'Fira Code', monospace;
        }
        .loading-overlay {
            background: rgba(253, 250, 246, 0.98);
            transition: opacity 0.5s ease-out;
        }
        .brew-spinner {
            border: 4px solid #e7d8c9;
            border-top: 4px solid #22c55e;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3e2723;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex h-screen">

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center loading-overlay">
        <div class="brew-spinner mb-4"></div>
        <h2 class="text-2xl font-black text-stone-800 italic mb-2">coffee<span class="text-green-600">.snake()</span></h2>
        <p id="loaderStatus" class="text-stone-500 animate-pulse text-sm font-medium">Brewing the Python runtime...</p>
        <p id="retryMsg" class="hidden mt-4 text-xs text-red-500">Still waiting? Try refreshing the page.</p>
    </div>

    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-stone-200 p-6 flex flex-col gap-6 z-10 shadow-sm">
        <div>
            <h1 class="text-3xl font-black text-stone-800 italic">coffee<span class="text-green-600">.snake()</span></h1>
            <p class="text-[10px] text-stone-400 font-bold uppercase tracking-widest">Python 3.11 WASM Engine</p>
        </div>

        <div class="space-y-4">
            <h3 class="text-xs font-black text-stone-400 uppercase">Code Recipes</h3>
            <button onclick="snake.loadExample('hello')" class="w-full text-left p-3 rounded-xl bg-green-50 text-green-700 hover:bg-green-100 transition border border-green-100">
                <p class="text-sm font-bold">🐍 Python Basics</p>
                <p class="text-[10px] opacity-70">Loops and formatting</p>
            </button>
            <button onclick="snake.loadExample('math')" class="w-full text-left p-3 rounded-xl bg-stone-50 text-stone-700 hover:bg-stone-100 transition border border-stone-100">
                <p class="text-sm font-bold">🧮 Math Logic</p>
                <p class="text-[10px] opacity-70">Fibonacci generator</p>
            </button>
            <button onclick="snake.loadExample('data')" class="w-full text-left p-3 rounded-xl bg-stone-50 text-stone-700 hover:bg-stone-100 transition border border-stone-100">
                <p class="text-sm font-bold">📊 Data Types</p>
                <p class="text-[10px] opacity-70">Dictionaries & Lists</p>
            </button>
        </div>

        <div class="mt-auto">
            <div class="p-4 bg-stone-900 rounded-xl">
                <p class="text-xs text-green-400 font-mono">System Status:</p>
                <p id="pyVersion" class="text-[10px] text-stone-400 font-mono mt-1 italic">Warming up...</p>
            </div>
        </div>
    </aside>

    <!-- Execution Space -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Toolbar -->
        <header class="bg-white border-b border-stone-200 p-4 px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="runBtn" disabled onclick="snake.execute()" class="bg-green-600 disabled:bg-stone-300 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition flex items-center gap-2 shadow-lg shadow-green-100">
                    <span id="btnIcon">▶</span> <span id="btnText">Run Script</span>
                </button>
                <button onclick="snake.clearConsole()" class="text-stone-400 hover:text-stone-600 font-bold text-sm">Clear Output</button>
            </div>
            <div class="text-xs font-bold text-stone-400">STATUS: <span id="status" class="text-stone-400 uppercase">WAITING</span></div>
        </header>

        <!-- Editor and Console Split -->
        <section class="flex-1 flex flex-col">
            <!-- Code Editor -->
            <div class="flex-1 relative">
                <div class="absolute top-2 right-4 text-[10px] text-stone-500 z-10 font-mono">script.py</div>
                <textarea id="editor" class="code-editor w-full h-full p-8 outline-none text-lg" spellcheck="false"># coffee.snake() 
# A pure Python environment in your browser.

def brew_python():
    print("♨️ Heating the engine...")
    beans = ["Logic", "Loops", "Functions", "Syntax"]
    
    for i, bean in enumerate(beans):
        print(f"[{i+1}/4] Grinding {bean}...")
    
    return "✅ Your Python Espresso is ready!"

# Run the function
output = brew_python()
print("\n" + output)</textarea>
            </div>

            <!-- Console -->
            <div class="h-72 console p-5 overflow-y-auto custom-scrollbar border-t-4 border-stone-800">
                <div class="flex justify-between items-center mb-3 border-b border-stone-900 pb-2">
                    <span class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Console Output (STDOUT)</span>
                    <span class="text-[10px] text-stone-700">Coffee Snake v1.1</span>
                </div>
                <div id="output" class="text-sm leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </section>
    </main>

    <script>
        const snake = (() => {
            let pyodide = null;
            const outputDiv = document.getElementById('output');
            const editor = document.getElementById('editor');
            const loader = document.getElementById('loader');
            const statusLabel = document.getElementById('status');
            const runBtn = document.getElementById('runBtn');

            const init = async () => {
                // Set a timeout warning if it takes too long
                const timeoutTimer = setTimeout(() => {
                    document.getElementById('retryMsg').classList.remove('hidden');
                }, 8000);

                try {
                    // Initialize Pyodide with reliable CDN
                    pyodide = await loadPyodide();
                    
                    // Display Python version
                    const version = await pyodide.runPythonAsync(`import sys; sys.version`);
                    document.getElementById('pyVersion').innerText = "Python " + version.split(' ')[0];
                    
                    // Cleanup loader
                    clearTimeout(timeoutTimer);
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                    
                    // Enable the interface
                    runBtn.disabled = false;
                    statusLabel.innerText = "READY";
                    statusLabel.className = "text-green-600 font-black";
                } catch (e) {
                    console.error("Pyodide Error:", e);
                    document.getElementById('loaderStatus').innerText = "Failed to brew. Check your connection.";
                    document.getElementById('loaderStatus').className = "text-red-500 font-bold";
                }
            };

            const appendToConsole = (text, type = 'log') => {
                const line = document.createElement('div');
                line.className = type === 'error' ? 'text-red-500 font-bold mb-1' : 'text-green-400 mb-0.5';
                line.textContent = text;
                outputDiv.appendChild(line);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };

            const examples = {
                hello: `# Formatting Example\nname = "World"\ncount = 5\n\nfor i in range(count):\n    print(f"Hello {name}, index: {i}")`,
                math: `# Fibonacci Sequence\ndef fibonacci(n):\n    a, b = 0, 1\n    result = []\n    while a < n:\n        result.append(a)\n        a, b = b, a + b\n    return result\n\nprint("Calculating Fibonacci up to 1000:")\nprint(fibonacci(1000))`,
                data: `# Dictionary Work\ncoffee_data = {\n    "name": "Espresso",\n    "bitterness": 8,\n    "caffeine_level": "High"\n}\n\nprint("Current Menu Item:")\nfor key, value in coffee_data.items():\n    print(f" {key.capitalize()}: {value}")`
            };

            return {
                execute: async () => {
                    if (!pyodide) return;
                    
                    statusLabel.innerText = "RUNNING";
                    statusLabel.className = "text-amber-500 animate-pulse";
                    runBtn.disabled = true;
                    document.getElementById('btnText').innerText = "Running...";
                    
                    outputDiv.innerHTML = '';

                    // Capture Python's print output
                    pyodide.setStdout({
                        batched: (str) => appendToConsole(str)
                    });

                    try {
                        const code = editor.value;
                        await pyodide.runPythonAsync(code);
                    } catch (err) {
                        appendToConsole("❌ ERROR: " + err.message, 'error');
                    } finally {
                        statusLabel.innerText = "IDLE";
                        statusLabel.className = "text-green-600";
                        runBtn.disabled = false;
                        document.getElementById('btnText').innerText = "Run Script";
                    }
                },
                loadExample: (key) => {
                    editor.value = examples[key];
                    outputDiv.innerHTML = '';
                    statusLabel.innerText = "IDLE";
                },
                clearConsole: () => {
                    outputDiv.innerHTML = '';
                },
                init
            };
        })();

        // Start the engine on load
        window.addEventListener('load', snake.init);
    </script>
</body>
</html>

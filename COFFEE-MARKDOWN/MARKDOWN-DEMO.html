<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFFEE-MARKDOWN demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="coffee-markdown.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 1rem; }
    textarea { width: 100%; height: 160px; box-sizing: border-box; font-family: monospace; font-size: 13px; }
    iframe { width: 100%; height: 320px; border: 1px solid #333; background: #fff; margin-top: 12px; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <h1>coffee.markdown <span id="sup" class="ok"></span></h1>
  <textarea id="md"># Hello **Coffee**

- `toHtml` / preview
- Load **marked** first</textarea>
  <iframe id="pv"></iframe>
  <script>
    document.getElementById('sup').textContent = coffee.markdown.supported() ? 'supported' : 'missing marked';
    const ta = document.getElementById('md');
    const iframe = document.getElementById('pv');
    function sync() {
      coffee.markdown.assignIframePreview(iframe, ta.value);
    }
    ta.addEventListener('input', sync);
    sync();
  </script>
</body>
</html>

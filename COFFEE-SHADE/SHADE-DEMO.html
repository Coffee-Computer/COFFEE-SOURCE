<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.shade — WebGPU engine</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #gpuCanvas { width: 100%; height: 100%; display: block; }
    .panel {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 8px;
      font-size: 11px; font-family: monospace;
    }
    .panel button { margin-right: 8px; margin-top: 4px; padding: 4px 10px; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px; }
    .panel button:hover { background: #444; }
  </style>
</head>
<body>
  <canvas id="gpuCanvas"></canvas>
  <div class="panel">
    <div style="margin-bottom:8px;opacity:0.7">coffee.shade() — headless engine</div>
    <div>
      <button onclick="applyPreset('liquid')">Liquid</button>
      <button onclick="applyPreset('waves')">Waves</button>
      <button onclick="applyPreset('intense')">Intense</button>
    </div>
  </div>

  <script src="./coffee-shade.js"></script>
  <script>
    const shade = coffee.shade({
      canvas: '#gpuCanvas',
      config: { density: 6, color_shift: 2, speed: 1.2 }
    });

    const PRESETS = {
      liquid: { density: 6, color_shift: 2, zoom: 1.2, speed: 1, brightness: 1, complexity: 5 },
      waves: { density: 12, color_shift: 3, zoom: 1.5, speed: 0.8, brightness: 1, complexity: 7 },
      intense: { density: 10, color_shift: 4, zoom: 1, speed: 1.5, brightness: 1.1, complexity: 9 }
    };

    function applyPreset(key) {
      const p = PRESETS[key] || PRESETS.liquid;
      shade.update(p);
    }

    shade.start();
  </script>
</body>
</html>

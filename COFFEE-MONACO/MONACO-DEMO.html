<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFFEE-MONACO demo</title>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../COFFEE-UI/coffee-ui.js"></script>
  <script src="../COFFEE-FRAME/coffee-frame.js"></script>
  <script src="coffee-monaco.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--coffee-bg-surface);
      color: var(--coffee-text-primary);
    }
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 960px;
      margin: 0 auto;
      padding: var(--coffee-space-md);
      box-sizing: border-box;
    }
    #ed {
      height: 360px;
      border: 1px solid var(--coffee-panel);
      border-radius: var(--coffee-radius-md);
      overflow: hidden;
      box-shadow: var(--coffee-shadow-soft);
    }
    #out {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="demo-intro"></div>
    <div id="ed"></div>
    <div id="demo-actions"></div>
    <div id="demo-output"></div>
  </div>
  <script>
    (function () {
      const title = coffee.heading('coffee.monaco', 2, {
        style: { margin: '0 0 var(--coffee-space-xs) 0' }
      });
      const blurb = coffee.para('Monaco inside an iframe; RPC via coffee.frame. Chrome uses coffee-ui.', {
        style: { margin: '0 0 var(--coffee-space-md) 0', color: 'var(--coffee-text-muted)', fontSize: 'var(--coffee-font-sm)' }
      });
      document.getElementById('demo-intro').appendChild(coffee.stack([title, blurb], { style: { gap: '0' } }));
    })();

    var dark = true;
    var api;

    var getBtn = coffee.button('getValue()', function () {
      if (!api) return;
      api.getValue().then(function (v) {
        outPre.textContent = v.slice(0, 500) + (v.length > 500 ? '…' : '');
      });
    }, { style: { minHeight: '40px', minWidth: 'auto' } });

    var themeBtn = coffee.button('Toggle theme', function () {
      if (!api) return;
      dark = !dark;
      api.setTheme(dark ? 'vs-dark' : 'vs');
    }, {
      style: {
        minHeight: '40px',
        minWidth: 'auto',
        backgroundColor: 'var(--coffee-bg-elev)',
        color: 'var(--coffee-text-primary)',
        border: '1px solid var(--coffee-panel)'
      }
    });

    var actionsRow = coffee.row([getBtn, themeBtn], {
      style: { marginTop: 'var(--coffee-space-md)', flexWrap: 'wrap' }
    });
    document.getElementById('demo-actions').appendChild(actionsRow);

    var outputCard = coffee.card(null, {
      style: {
        marginTop: 'var(--coffee-space-md)',
        maxHeight: '140px',
        overflow: 'auto',
        padding: 'var(--coffee-space-sm)'
      }
    });
    var outPre = document.createElement('pre');
    outPre.id = 'out';
    outputCard.appendChild(outPre);
    document.getElementById('demo-output').appendChild(outputCard);

    coffee.monaco.create(document.getElementById('ed'), {
      value: '# Monaco\n\n```js\nconst x = 1;\n```\n',
      language: 'markdown',
      theme: 'vs-dark'
    }).then(function (a) {
      api = a;
      outPre.textContent = 'ready';
      api.onChange(function (payload) {
        var v = payload && payload.value != null ? payload.value : '';
        outPre.textContent = 'change: ' + v.length + ' chars';
      });
    }).catch(function (e) {
      outPre.textContent = 'Error: ' + e.message;
    });
  </script>
</body>
</html>

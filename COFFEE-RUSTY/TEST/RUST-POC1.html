<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Rusty - Rust Execution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --coffee-cream: #fdfaf6;
            --coffee-deep: #1b130c;
            --rust-orange: #ce412b;
        }
        body {
            background-color: var(--coffee-cream);
            color: var(--coffee-deep);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .code-editor {
            font-family: 'Fira Code', 'Courier New', monospace;
            resize: none;
            background: #1e1e1e;
            color: #d4d4d4;
            line-height: 1.5;
        }
        .console {
            background: #000;
            color: #f0f0f0;
            font-family: 'Fira Code', monospace;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3e2723;
            border-radius: 4px;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body class="flex h-screen">

    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-stone-200 p-6 flex flex-col gap-6 z-10 shadow-sm">
        <div>
            <h1 class="text-3xl font-black text-stone-800 italic">coffee<span class="text-orange-600">.rusty()</span></h1>
            <p class="text-[10px] text-stone-400 font-bold uppercase tracking-widest">Rust Compilation Engine</p>
        </div>

        <div class="space-y-4">
            <h3 class="text-xs font-black text-stone-400 uppercase">Cargo Recipes</h3>
            <button onclick="rusty.loadExample('hello')" class="w-full text-left p-3 rounded-xl bg-orange-50 text-orange-700 hover:bg-orange-100 transition border border-orange-100">
                <p class="text-sm font-bold">🦀 Hello, World!</p>
                <p class="text-[10px] opacity-70">Standard print and macros</p>
            </button>
            <button onclick="rusty.loadExample('structs')" class="w-full text-left p-3 rounded-xl bg-stone-50 text-stone-700 hover:bg-stone-100 transition border border-stone-100">
                <p class="text-sm font-bold">📦 Structs & Impls</p>
                <p class="text-[10px] opacity-70">Methods and ownership</p>
            </button>
            <button onclick="rusty.loadExample('generics')" class="w-full text-left p-3 rounded-xl bg-stone-50 text-stone-700 hover:bg-stone-100 transition border border-stone-100">
                <p class="text-sm font-bold">🧬 Generics</p>
                <p class="text-[10px] opacity-70">Type-safe abstractions</p>
            </button>
        </div>

        <div class="mt-auto">
            <div class="p-4 bg-stone-900 rounded-xl">
                <p class="text-xs text-orange-400 font-mono">Backend:</p>
                <p class="text-[10px] text-stone-400 font-mono mt-1 italic">Rust Playground API</p>
                <p class="text-[10px] text-stone-400 font-mono mt-1 italic">Channel: Stable</p>
            </div>
        </div>
    </aside>

    <!-- Execution Space -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Toolbar -->
        <header class="bg-white border-b border-stone-200 p-4 px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="runBtn" onclick="rusty.execute()" class="bg-orange-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-700 transition flex items-center gap-2 shadow-lg shadow-orange-100">
                    <span id="btnIcon">⚡</span> <span id="btnText">Compile & Run</span>
                </button>
                <button onclick="rusty.clearConsole()" class="text-stone-400 hover:text-stone-600 font-bold text-sm">Clear Console</button>
            </div>
            <div class="flex items-center gap-2">
                <span class="status-dot bg-green-500" id="statusDot"></span>
                <div class="text-xs font-bold text-stone-400 uppercase tracking-wider" id="statusText">System Ready</div>
            </div>
        </header>

        <!-- Editor and Console -->
        <section class="flex-1 flex flex-col">
            <!-- Code Editor -->
            <div class="flex-1 relative">
                <div class="absolute top-2 right-4 text-[10px] text-stone-500 z-10 font-mono uppercase">main.rs</div>
                <textarea id="editor" class="code-editor w-full h-full p-8 outline-none text-lg" spellcheck="false">fn main() {
    println!("♨️ Brewing some Rust code...");
    
    let items = vec!["Memory Safety", "Zero-cost Abstractions", "Fearless Concurrency"];
    
    for (i, item) in items.iter().enumerate() {
        println!("[{}/3] Roasting {}...", i + 1, item);
    }
    
    println!("\n✅ Your Rust Espresso is ready!");
}</textarea>
            </div>

            <!-- Console -->
            <div class="h-72 console p-5 overflow-y-auto custom-scrollbar border-t-4 border-stone-800">
                <div class="flex justify-between items-center mb-3 border-b border-stone-900 pb-2">
                    <span class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Standard Output & Compiler</span>
                    <span class="text-[10px] text-stone-700">Coffee Rusty v1.0</span>
                </div>
                <div id="output" class="text-sm leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </section>
    </main>

    <script>
        const rusty = (() => {
            const editor = document.getElementById('editor');
            const outputDiv = document.getElementById('output');
            const runBtn = document.getElementById('runBtn');
            const btnText = document.getElementById('btnText');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            const examples = {
                hello: `fn main() {\n    let name = "Coffee Enthusiast";\n    println!("Hello, {}!", name);\n    println!("The current sum is: {}", 5 + 10);\n}`,
                structs: `struct Coffee {\n    roast: String,\n    ounces: u8,\n}\n\nimpl Coffee {\n    fn brew(&self) {\n        println!("Brewing a {}oz {} roast.", self.ounces, self.roast);\n    }\n}\n\nfn main() {\n    let my_cup = Coffee {\n        roast: String::from("Dark"),\n        ounces: 12,\n    };\n    my_cup.brew();\n}`,
                generics: `fn print_bean<T: std::fmt::Display>(bean: T) {\n    println!("Processing bean: {}", bean);\n}\n\nfn main() {\n    print_bean("Arabica");\n    print_bean(42);\n}`
            };

            const setStatus = (label, colorClass) => {
                statusText.innerText = label;
                statusDot.className = `status-dot ${colorClass}`;
            };

            const appendToConsole = (text, isError = false) => {
                const line = document.createElement('div');
                line.className = isError ? 'text-red-400 mb-1 font-bold' : 'text-stone-300 mb-0.5';
                line.textContent = text;
                outputDiv.appendChild(line);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };

            return {
                execute: async () => {
                    const code = editor.value;
                    if (!code.trim()) return;

                    // UI State: Loading
                    runBtn.disabled = true;
                    btnText.innerText = "Compiling...";
                    setStatus("Compiling", "bg-amber-500 animate-pulse");
                    outputDiv.innerHTML = '<div class="text-stone-500 italic mb-2 italic">Sending request to Rust Playground...</div>';

                    try {
                        const response = await fetch('https://play.rust-lang.org/execute', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                channel: "stable",
                                mode: "debug",
                                edition: "2021",
                                crateType: "bin",
                                tests: false,
                                code: code
                            })
                        });

                        const result = await response.json();

                        outputDiv.innerHTML = ''; // Clear the "Sending" message

                        if (result.success) {
                            if (result.stdout) appendToConsole(result.stdout);
                            if (result.stderr) {
                                const stderrLine = document.createElement('div');
                                stderrLine.className = 'text-stone-500 text-xs mt-2 border-t border-stone-900 pt-2';
                                stderrLine.textContent = "--- Compiler Output ---\n" + result.stderr;
                                outputDiv.appendChild(stderrLine);
                            }
                            setStatus("Success", "bg-green-500");
                        } else {
                            appendToConsole("❌ Compilation Failed", true);
                            appendToConsole(result.stderr, true);
                            setStatus("Failed", "bg-red-500");
                        }
                    } catch (err) {
                        appendToConsole("❌ Network Error: Could not reach the Rust Playground.", true);
                        setStatus("Error", "bg-red-500");
                    } finally {
                        runBtn.disabled = false;
                        btnText.innerText = "Compile & Run";
                    }
                },
                loadExample: (key) => {
                    editor.value = examples[key];
                    outputDiv.innerHTML = '';
                    setStatus("Ready", "bg-green-500");
                },
                clearConsole: () => {
                    outputDiv.innerHTML = '';
                }
            };
        })();
    </script>
</body>
</html>

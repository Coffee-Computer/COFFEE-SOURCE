<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Engine: ../coffee-task.js · Flagship LATE: ../../COFFEE-COMMUNITY/FLAGSHIP/LATE/LATE-ALPHA.html -->
    <title>Coffee.Task // Productivity Engine (POC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');

        :root {
            --bg-deep: #09090b;
            --bg-card: #18181b;
            --accent: #d4a373;
            --accent-muted: #a98467;
            --text-main: #e4e4e7;
            --text-dim: #71717a;
            --border: #27272a;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .calendar-day {
            background: var(--bg-card);
            aspect-ratio: 1 / 1;
            padding: 8px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .calendar-day:hover { background: #27272a; }
        .calendar-day.today { background: #1e1e24; }
        .calendar-day.today .day-num { color: var(--accent); font-weight: 700; }
        .calendar-day.selected { border: 2px solid var(--accent); z-index: 10; }
        .calendar-day.other-month { opacity: 0.3; }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: transform 0.1s, border-color 0.2s;
        }
        .task-card:active { transform: scale(0.98); }
        .task-card.completed { opacity: 0.5; }
        .task-card.completed .task-text { text-decoration: line-through; color: var(--text-dim); }

        .dot { height: 4px; width: 4px; border-radius: 50%; display: inline-block; }
        
        @media (max-width: 768px) {
            .calendar-day { aspect-ratio: 1 / 0.8; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="h-16 border-bottom border-[#27272a] bg-[#18181b]/50 backdrop-blur-md sticky top-0 z-50 flex items-center px-6 justify-between border-b">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-[#d4a373] text-black flex items-center justify-center font-bold rounded-lg shadow-lg shadow-[#d4a373]/20">T</div>
            <div>
                <h1 class="text-sm font-bold tracking-tight">Coffee.Task</h1>
                <p class="text-[10px] uppercase tracking-widest text-[#71717a] font-medium">Productivity Engine</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="changeMonth(-1)" class="p-2 hover:bg-white/5 rounded-full transition-colors">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span id="currentMonthLabel" class="text-sm font-medium min-w-[120px] text-center self-center">March 2024</span>
            <button onclick="changeMonth(1)" class="p-2 hover:bg-white/5 rounded-full transition-colors">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col lg:flex-row p-4 lg:p-8 gap-8 max-w-7xl mx-auto w-full">
        
        <!-- Left: Calendar View -->
        <section class="w-full lg:w-3/5 space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold tracking-tight">Calendar</h2>
                <span class="text-xs text-zinc-500 font-mono" id="todayString">TODAY: 20 MAR</span>
            </div>
            
            <div class="calendar-grid-container">
                <div class="grid grid-cols-7 mb-2">
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Sun</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Mon</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Tue</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Wed</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Thu</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Fri</div>
                    <div class="text-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Sat</div>
                </div>
                <div id="calendarGrid" class="calendar-grid">
                    <!-- Days injected by JS -->
                </div>
            </div>

            <div class="p-4 rounded-xl bg-gradient-to-br from-zinc-900 to-black border border-zinc-800">
                <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3">Quick Add</h3>
                <div class="flex gap-2">
                    <input type="text" id="taskInput" placeholder="What needs doing?" class="flex-grow bg-black/40 border border-zinc-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#d4a373] transition-all">
                    <button onclick="addTask()" class="bg-[#d4a373] hover:bg-[#a98467] text-black px-4 py-2 rounded-lg font-bold text-sm transition-all shadow-lg shadow-[#d4a373]/10">Add</button>
                </div>
            </div>
        </section>

        <!-- Right: Task List -->
        <section class="w-full lg:w-2/5 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold tracking-tight">Tasks <span id="taskCount" class="ml-2 text-sm font-mono text-zinc-500 opacity-50">0</span></h2>
                <div class="flex gap-2">
                    <button onclick="filterTasks('all')" class="text-[10px] uppercase font-bold tracking-tighter px-2 py-1 bg-white/5 rounded hover:bg-white/10">All</button>
                    <button onclick="filterTasks('active')" class="text-[10px] uppercase font-bold tracking-tighter px-2 py-1 bg-white/5 rounded hover:bg-white/10">Pending</button>
                </div>
            </div>

            <div id="taskList" class="space-y-3 overflow-y-auto max-h-[600px] pr-2">
                <!-- Tasks injected by JS -->
            </div>
            
            <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-center hidden">
                <div class="w-12 h-12 rounded-full bg-zinc-900 flex items-center justify-center mb-4 border border-zinc-800">
                    <i data-lucide="check-circle" class="w-6 h-6 text-zinc-700"></i>
                </div>
                <p class="text-sm text-zinc-500 font-medium">All caught up.<br>Time for more coffee.</p>
            </div>
        </section>
    </main>

    <script>
        // State Management
        let currentDate = new Date();
        let selectedDate = new Date();
        let tasks = JSON.parse(localStorage.getItem('coffee_tasks')) || [];
        let currentFilter = 'all';

        // Constants
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function init() {
            renderCalendar();
            renderTasks();
            updateHeader();
            lucide.createIcons();
            
            document.getElementById('taskInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });
        }

        function updateHeader() {
            document.getElementById('currentMonthLabel').textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            document.getElementById('todayString').textContent = `TODAY: ${new Date().getDate()} ${monthNames[new Date().getMonth()].substring(0, 3).toUpperCase()}`;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
            updateHeader();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            
            // Previous month padding
            const prevPadding = firstDay.getDay();
            const prevMonthLastDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0).getDate();
            
            for (let i = prevPadding - 1; i >= 0; i--) {
                const dayDiv = createDayDiv(prevMonthLastDay - i, true);
                grid.appendChild(dayDiv);
            }
            
            // Current month days
            const today = new Date();
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const isToday = i === today.getDate() && currentDate.getMonth() === today.getMonth() && currentDate.getFullYear() === today.getFullYear();
                const isSelected = i === selectedDate.getDate() && currentDate.getMonth() === selectedDate.getMonth() && currentDate.getFullYear() === selectedDate.getFullYear();
                
                const dayDiv = createDayDiv(i, false, isToday, isSelected);
                dayDiv.addEventListener('click', () => selectDate(i));
                
                // Task indicator dots
                const dateKey = getDateKey(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));
                const dayTasks = tasks.filter(t => t.date === dateKey);
                if (dayTasks.length > 0) {
                    const dotContainer = document.createElement('div');
                    dotContainer.className = 'absolute bottom-2 left-0 right-0 flex justify-center gap-1';
                    dayTasks.slice(0, 3).forEach(t => {
                        const dot = document.createElement('span');
                        dot.className = `dot ${t.completed ? 'bg-zinc-700' : 'bg-[#d4a373]'}`;
                        dotContainer.appendChild(dot);
                    });
                    dayDiv.appendChild(dotContainer);
                }

                grid.appendChild(dayDiv);
            }
        }

        function createDayDiv(num, isOther, isToday = false, isSelected = false) {
            const div = document.createElement('div');
            div.className = `calendar-day ${isOther ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
            div.innerHTML = `<span class="day-num text-xs font-mono">${num}</span>`;
            return div;
        }

        function getDateKey(date) {
            return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
        }

        function selectDate(day) {
            selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
            renderCalendar();
            renderTasks();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;

            const newTask = {
                id: Date.now(),
                text: input.value.trim(),
                completed: false,
                date: getDateKey(selectedDate),
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            saveTasks();
            input.value = '';
            renderTasks();
            renderCalendar();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            renderTasks();
            renderCalendar();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
            renderCalendar();
        }

        function saveTasks() {
            localStorage.setItem('coffee_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';
            
            const dateKey = getDateKey(selectedDate);
            let filtered = tasks.filter(t => t.date === dateKey);
            
            if (currentFilter === 'active') {
                filtered = filtered.filter(t => !t.completed);
            }

            document.getElementById('taskCount').textContent = filtered.length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.sort((a,b) => b.id - a.id).forEach(task => {
                    const card = document.createElement('div');
                    card.className = `task-card p-4 rounded-xl flex items-center justify-between group ${task.completed ? 'completed' : ''}`;
                    card.innerHTML = `
                        <div class="flex items-center gap-3 cursor-pointer flex-grow" onclick="toggleTask(${task.id})">
                            <div class="w-5 h-5 rounded border border-zinc-700 flex items-center justify-center transition-colors ${task.completed ? 'bg-[#d4a373] border-[#d4a373]' : 'bg-transparent'}">
                                ${task.completed ? '<i data-lucide="check" class="w-3 h-3 text-black font-bold"></i>' : ''}
                            </div>
                            <span class="task-text text-sm font-medium tracking-tight">${task.text}</span>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="opacity-0 group-hover:opacity-100 p-2 text-zinc-600 hover:text-red-400 transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    `;
                    list.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function filterTasks(type) {
            currentFilter = type;
            renderTasks();
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            // Adaptive logic if needed for canvas redrawing
        });

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.animate() Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; box-sizing: border-box; }
  </style>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../COFFEE-UI/coffee-ui.js"></script>
  <script src="../COFFEE-SCENE2D/coffee-scene2d.js"></script>
  <script src="./coffee-animate.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    coffee.injectTheme('dark');

    const header = coffee.heading('coffee.animate()', 1);
    const sub = coffee.para('Standalone tween engine. Works with scene2d, DOM, any object.');
    sub.style.color = 'var(--coffee-text-muted)';

    const shape = { type: 'circle', x: 100, y: 100, radius: 40, fill: '#4c9aff' };
    const scene = coffee.scene2d({
      shapes: [shape],
      background: '#1a1a2e',
      width: 400,
      height: 200
    });

    const btn = coffee.button('Animate', () => {
      coffee.animate(shape, { x: 300, y: 150 }, {
        duration: 800,
        ease: 'easeOut',
        onUpdate: () => scene.scene2d.render(),
        onComplete: () => {
          coffee.animate(shape, { x: 100, y: 100 }, {
            duration: 800,
            ease: 'easeInOut',
            onUpdate: () => scene.scene2d.render()
          });
        }
      });
    });

    const card = coffee.card([header, sub, scene, btn], { style: { width: '100%', maxWidth: '440px' } });

    const app = document.getElementById('app');
    app.style.cssText = 'padding:var(--coffee-space-lg);width:100%;max-width:100%;background:var(--coffee-bg-surface);min-height:100vh;box-sizing:border-box';
    app.appendChild(card);
  </script>
</body>
</html>

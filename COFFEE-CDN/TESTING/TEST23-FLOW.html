<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Coil // Generative Art</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { 
            width: 320px; background: #111; border-right: 1px solid #333; 
            padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }

        #art-viewport { 
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000;
        }

        canvas { width: 100%; height: 100%; cursor: crosshair; }

        .preset-card {
            background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
        }
        .preset-card:hover { border-color: #bc986a; background: #222; }
        .preset-card.active { border-color: #bc986a; background: #2a2218; }

        .param-view { font-family: 'Fira Code', monospace; font-size: 11px; color: #666; background: #050505; padding: 10px; border-radius: 4px; overflow: hidden; }
        h3 { margin: 0; font-size: 14px; color: #bc986a; text-transform: uppercase; letter-spacing: 1px; }
    </style>

    <!-- Load Coffee Source stack via CDN -->
    <script 
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="sidebar">
        <h3>Coil Presets</h3>
        <div id="preset-list"></div>

        <h3>Active Parameters</h3>
        <div id="json-display" class="param-view">Select a preset...</div>

        <div id="actions"></div>
    </div>

    <div id="art-viewport">
        <canvas id="forge-canvas"></canvas>
    </div>

    <script>
        window.addEventListener('coffee:cdn:ready', async function () {
            const presetList = document.getElementById('preset-list');
            const jsonDisplay = document.getElementById('json-display');
            const actions = document.getElementById('actions');
            const canvas = document.getElementById('forge-canvas');
            const ctx = canvas.getContext('2d');

            let currentConfig = null;
            let frame = 0;

            // 1. Available Presets (from COIL-DEMO / README)
            const available = [
                { engine: 'flow', preset: 'default' },
                { engine: 'flow', preset: 'warm' },
                { engine: 'fractal', preset: 'default' },
                { engine: 'glitch', preset: 'default' },
                { engine: 'orbit', preset: 'default' }
            ];

            // 2. Load Function (using coffee.coil API)
            async function applyPreset(engine, name) {
                try {
                    // API: coffee.coil.load(engine, preset, opts)
                    // We point baseUrl to the relative or CDN path for the presets JSONs
                    const config = await coffee.coil.load(engine, name, { 
                        baseUrl: 'https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-COIL/presets/' 
                    });
                    
                    currentConfig = config;
                    jsonDisplay.innerText = JSON.stringify(config.params, null, 2);
                    
                    if (coffee.toast) coffee.toast(`Coil: Loaded ${engine}/${name}`);
                    render();
                } catch (e) {
                    console.error("Coil load failed", e);
                }
            }

            // 3. UI Generation (COFFEE-UI)
            available.forEach(item => {
                const card = document.createElement('div');
                card.className = 'preset-card';
                card.innerHTML = `<div style="color:#eee">${item.engine}</div><div style="font-size:10px; color:#666">${item.preset}</div>`;
                card.onclick = () => {
                    document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    applyPreset(item.engine, item.preset);
                };
                presetList.appendChild(card);
            });

            actions.appendChild(coffee.button('Randomize Seed', () => {
                if (currentConfig) {
                    currentConfig.seed = Math.random() * 1000;
                    render();
                }
            }));

            // 4. "The Forge" - Visualizing the Coil Parameters
            function render() {
                if (!currentConfig) return;
                
                // Clear Canvas
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                const { complexity, speed, hue, zoom } = currentConfig.params;
                const seed = currentConfig.seed || 1;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = `hsl(${hue}, 50%, 50%)`;
                ctx.lineWidth = 2;

                // Procedural drawing based on the Coil Preset
                ctx.beginPath();
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                for (let i = 0; i < 500; i++) {
                    const angle = 0.1 * i;
                    const radius = (complexity * 1000 * angle) * zoom;
                    const x = centerX + radius * Math.cos(angle + (frame * speed * 0.01) + seed);
                    const y = centerY + radius * Math.sin(angle + (frame * speed * 0.01) + seed);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            function animate() {
                frame++;
                render();
                requestAnimationFrame(animate);
            }

            // Initialization
            coffee.injectTheme('dark');
            animate();
            
            // Auto-load first preset
            applyPreset('flow', 'default');
        });
    </script>
</body>
</html>

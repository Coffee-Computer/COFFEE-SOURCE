<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Draw Pad // Export</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #eee; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        #toolbar {
            height: 60px; background: #252526; display: flex; align-items: center;
            padding: 0 20px; border-bottom: 1px solid #333; gap: 15px; z-index: 10;
            flex-shrink: 0;
        }

        #draw-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #draw-container [data-coffee="scene2d"] {
            width: 100%;
            height: 100%;
        }

        #draw-container canvas { display: block; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .color-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #444; cursor: pointer; }
        .color-swatch.active { border-color: #bc986a; transform: scale(1.1); }

        .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    </style>

    <script
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="toolbar">
        <div class="label">Draw</div>
        <div id="colors" style="display: flex; gap: 8px;"></div>

        <div style="width: 1px; height: 24px; background: #444; margin: 0 10px;"></div>

        <div id="actions" style="display: flex; gap: 10px;"></div>
    </div>

    <div id="draw-container"></div>

    <script>
        (function () {
            var started = false;

            function start() {
                if (started) return;
                if (!window.coffee || typeof coffee.draw !== 'function') {
                    console.error('coffee.draw not ready');
                    return;
                }
                started = true;

                var container = document.getElementById('draw-container');
                var colorRoot = document.getElementById('colors');
                var actionRoot = document.getElementById('actions');

                if (typeof coffee.injectTheme === 'function') {
                    coffee.injectTheme('dark');
                }

                /*
                 * Real API (coffee-draw.js):
                 *   coffee.draw({ brush: { size, color, opacity, mode }, background, width, height, onStrokeComplete })
                 * Returns the scene2d wrapper element; methods are on wrapper.draw (setBrush, clear, undo, …).
                 * You must append the returned element to the DOM — there is no (container, opts) overload.
                 */
                function sizeDrawArea() {
                    var r = container.getBoundingClientRect();
                    return {
                        w: Math.max(320, Math.floor(r.width)),
                        h: Math.max(240, Math.floor(r.height))
                    };
                }

                var dim = sizeDrawArea();
                var view = coffee.draw({
                    brush: { size: 5, color: '#000000' },
                    background: '#ffffff',
                    width: dim.w,
                    height: dim.h
                });

                container.appendChild(view);

                var palette = ['#000000', '#bc986a', '#4c9aff', '#ff4d4d', '#27c93f'];
                palette.forEach(function (color) {
                    var swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.background = color;
                    if (color === '#000000') swatch.classList.add('active');

                    swatch.onclick = function () {
                        document.querySelectorAll('.color-swatch').forEach(function (s) {
                            s.classList.remove('active');
                        });
                        swatch.classList.add('active');
                        view.draw.setBrush({ color: color });
                    };
                    colorRoot.appendChild(swatch);
                });

                actionRoot.appendChild(coffee.button('Clear', function () {
                    view.draw.clear();
                }));

                actionRoot.appendChild(coffee.button('Save PNG', function () {
                    var canvas = view.scene2d.canvas;
                    new Promise(function (resolve, reject) {
                        canvas.toBlob(function (blob) {
                            if (blob) resolve(blob);
                            else reject(new Error('toBlob failed'));
                        }, 'image/png');
                    }).then(function (blob) {
                        if (coffee.file && typeof coffee.file.save === 'function') {
                            return coffee.file.save(blob, {
                                suggestedName: 'coffee-sketch-' + Date.now() + '.png',
                                types: [{ description: 'PNG', accept: { 'image/png': ['.png'] } }]
                            }).then(function () {
                                if (coffee.toast) coffee.toast('Sketch exported', 'success');
                            });
                        }
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'sketch.png';
                        a.click();
                        URL.revokeObjectURL(url);
                        if (coffee.toast) coffee.toast('Download started', 'info');
                    }).catch(function (e) {
                        console.error(e);
                        if (coffee.toast) coffee.toast('Export failed', 'error');
                    });
                }));

                console.log('Draw pad ready — coffee.draw({ brush, width, height, … }), append returned node');
                /* scene2d’s internal resize() (rAF) sizes the canvas from the wrapper’s getBoundingClientRect() once mounted */
            }

            window.addEventListener('coffee:cdn:ready', start);
            var p = window.COFFEE_LOAD_ALL_PROMISE;
            if (p && typeof p.then === 'function') {
                p.then(start).catch(start);
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Git // Status Viewer</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { 
            width: 320px; background: #111; border-right: 1px solid #222; 
            display: flex; flex-direction: column; padding: 25px; gap: 20px;
        }

        #main-view { flex: 1; display: flex; flex-direction: column; background: #050505; }

        .pane-header { 
            background: #1a1a1a; padding: 12px 20px; font-size: 11px; 
            color: #bc986a; text-transform: uppercase; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }

        #content-area { flex: 1; padding: 30px; overflow-y: auto; }

        .repo-card {
            background: #151515; border: 1px solid #333; border-radius: 12px;
            padding: 20px; margin-bottom: 20px;
        }

        .repo-title { font-size: 18px; font-weight: bold; color: #bc986a; margin-bottom: 5px; }
        .repo-spec { font-family: monospace; font-size: 12px; color: #666; margin-bottom: 15px; }

        .file-list { display: flex; flex-direction: column; gap: 8px; }
        .file-item { 
            background: #1a1a1a; padding: 10px 15px; border-radius: 6px; 
            font-size: 13px; display: flex; justify-content: space-between;
            border: 1px solid transparent;
        }
        .file-item:hover { border-color: #bc986a; }

        .status-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #222; color: #888; text-transform: uppercase; }
        .tag-online { background: #bc986a; color: #000; }

        input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; }
    </style>

    <!-- Load Prerequisites -->
    <script src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CONTROL/coffee-control.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-GIT/coffee-git.js"></script>
    
    <!-- Load UI Stack -->
    <script 
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <aside id="sidebar">
        <div style="font-weight: bold; color: #bc986a; letter-spacing: 2px;">COFFEE // GIT</div>
        
        <div class="control-group">
            <label>Fetch Repository</label>
            <input type="text" id="git-input" placeholder="owner/repo or URL" value="Coffee-Computer/COFFEE-SOURCE">
            <div id="fetch-btn-root" style="margin-top: 10px;"></div>
        </div>

        <div id="meta-container">
            <div class="repo-card" style="padding: 15px; background: #0c0c0c;">
                <label>Active Spec</label>
                <div id="active-spec" style="font-family: monospace; font-size: 11px; margin-top: 5px; color: #666;">---</div>
            </div>
        </div>

        <div style="margin-top: auto; font-size: 10px; color: #444;">
            PUBLIC FETCH MODE (NO TOKEN)
        </div>
    </aside>

    <main id="main-view">
        <div class="pane-header">
            Repository Status
            <span id="fetch-status" class="status-tag">MOCK DATA</span>
        </div>
        <div id="content-area"></div>
    </main>

    <script>
        window.addEventListener('coffee:cdn:ready', function () {
            const contentArea = document.getElementById('content-area');
            const gitInput = document.getElementById('git-input');
            const fetchBtnRoot = document.getElementById('fetch-btn-root');
            const activeSpecDisplay = document.getElementById('active-spec');
            const fetchStatus = document.getElementById('fetch-status');

            // 1. Mock Data (Initial State)
            const mockFiles = [
                { name: 'coffee-base.js', size: '12kb', type: 'script' },
                { name: 'COFFEE-UI/coffee-ui.js', size: '45kb', type: 'script' },
                { name: 'README.md', size: '4kb', type: 'doc' },
                { name: 'index.html', size: '2kb', type: 'markup' }
            ];

            function renderStatus(owner, repo, files, isMock = false) {
                contentArea.innerHTML = `
                    <div class="repo-card">
                        <div class="repo-title">${repo}</div>
                        <div class="repo-spec">${owner}/${repo}</div>
                        <div style="font-size: 12px; color: #888;">${isMock ? 'Showing cached repository structure.' : 'Contents fetched via GitHub Raw.'}</div>
                    </div>
                    
                    <label>File Manifest (Read-Only)</label>
                    <div class="file-list" style="margin-top: 10px;">
                        ${files.map(f => `
                            <div class="file-item">
                                <span>${f.name}</span>
                                <span style="color: #444; font-size: 11px;">${f.size} • ${f.type}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                activeSpecDisplay.innerText = `${owner}/${repo}`;
            }

            // 2. Fetch Logic (Dogfooding COFFEE-GIT API)
            async function handleFetch() {
                const input = gitInput.value.trim();
                if (!input) return;

                fetchStatus.innerText = "FETCHING...";
                fetchStatus.className = "status-tag tag-online";

                try {
                    // API: coffee.git.parseSpec(input)
                    const spec = coffee.git.parseSpec(input);
                    if (spec.error) throw new Error(spec.error);

                    // API: coffee.git.fetchFromInput(input)
                    // Tries main/master/index.html to verify repo exists/accessible
                    const result = await coffee.git.fetchFromInput(input);

                    if (result.ok) {
                        // In read-only fetch mode, we simulate the status report 
                        // based on a successful entry point fetch.
                        renderStatus(spec.owner, spec.repo, [
                            { name: spec.path || 'index.html', size: 'FETCHED', type: 'remote' },
                            { name: '.coffee-manifest', size: '--', type: 'meta' }
                        ]);
                        fetchStatus.innerText = "REMOTE READY";
                        if (coffee.toast) coffee.toast(`Fetched ${spec.repo} spec`);
                    } else {
                        throw new Error(`HTTP ${result.status}`);
                    }
                } catch (e) {
                    fetchStatus.innerText = "FETCH ERROR";
                    fetchStatus.className = "status-tag";
                    if (coffee.toast) coffee.toast(e.message, { type: 'error' });
                }
            }

            // 3. UI Construction (COFFEE-UI)
            fetchBtnRoot.appendChild(coffee.button('Fetch Status', handleFetch));

            // Initial Mock Render
            renderStatus('Coffee-Computer', 'COFFEE-SOURCE', mockFiles, true);
            coffee.injectTheme('dark');
        });
    </script>
</body>
</html>

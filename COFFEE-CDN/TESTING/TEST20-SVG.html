<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee SVG Icon Composer</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: #eee; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 320px; background: #1a1a1a; border-right: 1px solid #333;
            padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
        }

        #viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px;
        }

        .svg-container {
            background: #fff; width: 400px; height: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
        }

        .svg-container svg { display: block; }

        .control-group { background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .control-group label { display: block; font-size: 10px; color: #bc986a; text-transform: uppercase; margin-bottom: 10px; }

        input[type="range"] { width: 100%; margin-bottom: 10px; }
        .layer-item { font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #333; }

        h3 { margin-top: 0; font-size: 14px; color: #bc986a; letter-spacing: 1px; }
    </style>

    <script
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="sidebar">
        <h3>SVG Composer</h3>

        <div class="control-group">
            <label>Tools (drag on canvas)</label>
            <div id="tool-buttons" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            <p style="font-size: 11px; color: #888; margin: 10px 0 0;">
                Real API: <code>coffee.svg({ svg, width, height, onSelect })</code> — not <code>coffee.svg('circle', …)</code>.
            </p>
        </div>

        <div class="control-group">
            <label>New shape fill</label>
            <input type="color" id="fill-pick" value="#bc986a" style="width: 100%; height: 36px; border: none; cursor: pointer;">
        </div>

        <div id="properties" class="control-group">
            <label>Active element</label>
            <div id="prop-controls"></div>
        </div>

        <div id="layers" class="control-group">
            <label>Shapes</label>
            <div id="layer-list"></div>
        </div>

        <div id="export-actions"></div>
    </div>

    <div id="viewport">
        <div class="svg-container" id="svg-root">
            <!-- Passed to coffee.svg({ svg: … }) — must be a real &lt;svg&gt; -->
            <svg id="coffee-artboard" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <script>
        (function () {
            var started = false;

            function start() {
                if (started) return;
                if (!window.coffee || typeof coffee.svg !== 'function') {
                    console.error('coffee.svg not ready');
                    return;
                }
                started = true;

                var artboard = document.getElementById('coffee-artboard');
                var toolButtons = document.getElementById('tool-buttons');
                var propControls = document.getElementById('prop-controls');
                var layerList = document.getElementById('layer-list');
                var exportActions = document.getElementById('export-actions');
                var fillPick = document.getElementById('fill-pick');

                if (typeof coffee.injectTheme === 'function') {
                    coffee.injectTheme('dark');
                }

                var engine = coffee.svg({
                    svg: artboard,
                    width: 400,
                    height: 400,
                    onSelect: function () {
                        refreshProps();
                        refreshLayers();
                    }
                });

                function shapes() {
                    var g = artboard.querySelector('[data-coffee-svg-shapes]');
                    return g ? g.querySelectorAll(':scope > *') : [];
                }

                function refreshLayers() {
                    layerList.innerHTML = '';
                    var list = shapes();
                    if (list.length === 0) {
                        layerList.innerHTML = '<span style="color:#666;font-size:12px;">Draw with Rect or Circle tool.</span>';
                        return;
                    }
                    Array.prototype.forEach.call(list, function (node, i) {
                        var row = document.createElement('div');
                        row.className = 'layer-item';
                        row.innerHTML = '<span>' + node.tagName.toLowerCase() + ' #' + (i + 1) + '</span>';
                        var del = coffee.button('Remove', function () {
                            node.remove();
                            refreshLayers();
                            refreshProps();
                        });
                        del.style.padding = '2px 8px';
                        row.appendChild(del);
                        layerList.appendChild(row);
                    });
                }

                function refreshProps() {
                    propControls.innerHTML = '';
                    var el = engine.getSelected();
                    if (!el) {
                        propControls.innerHTML = '<span style="color:#666;font-size:12px;">Use Select tool and click a shape, or draw a new one.</span>';
                        return;
                    }

                    var tag = el.tagName.toLowerCase();

                    function slider(label, prop, min, max, val) {
                        var wrap = document.createElement('div');
                        wrap.style.fontSize = '11px';
                        wrap.style.marginBottom = '8px';
                        var lab = document.createElement('div');
                        lab.textContent = label + ': ' + val;
                        var inp = document.createElement('input');
                        inp.type = 'range';
                        inp.min = min;
                        inp.max = max;
                        inp.value = val;
                        inp.oninput = function (e) {
                            var v = parseFloat(e.target.value);
                            lab.textContent = label + ': ' + v;
                            engine.updateSelected(prop, v);
                        };
                        wrap.appendChild(lab);
                        wrap.appendChild(inp);
                        propControls.appendChild(wrap);
                    }

                    function colorRow() {
                        var c = document.createElement('input');
                        c.type = 'color';
                        c.value = el.getAttribute('fill') || '#10b981';
                        c.style.width = '100%';
                        c.style.height = '32px';
                        c.oninput = function (e) {
                            engine.updateSelected('fill', e.target.value);
                        };
                        propControls.appendChild(c);
                    }

                    colorRow();

                    if (tag === 'rect') {
                        slider('x', 'x', 0, 400, parseFloat(el.getAttribute('x')) || 0);
                        slider('y', 'y', 0, 400, parseFloat(el.getAttribute('y')) || 0);
                        slider('width', 'width', 1, 400, parseFloat(el.getAttribute('width')) || 0);
                        slider('height', 'height', 1, 400, parseFloat(el.getAttribute('height')) || 0);
                    } else if (tag === 'circle') {
                        slider('cx', 'cx', 0, 400, parseFloat(el.getAttribute('cx')) || 0);
                        slider('cy', 'cy', 0, 400, parseFloat(el.getAttribute('cy')) || 0);
                        slider('r', 'r', 1, 200, parseFloat(el.getAttribute('r')) || 0);
                    } else if (tag === 'text') {
                        var ta = document.createElement('textarea');
                        ta.rows = 2;
                        ta.style.width = '100%';
                        ta.value = el.textContent || '';
                        ta.oninput = function (e) {
                            engine.updateSelected('text', e.target.value);
                        };
                        propControls.appendChild(ta);
                        slider('font size', 'fontSize', 8, 120, parseFloat(el.getAttribute('font-size')) || 40);
                    }
                }

                toolButtons.appendChild(coffee.button('Select', function () {
                    engine.setTool('select');
                }));
                toolButtons.appendChild(coffee.button('Rect', function () {
                    engine.setTool('rect');
                }));
                toolButtons.appendChild(coffee.button('Circle', function () {
                    engine.setTool('circle');
                }));
                toolButtons.appendChild(coffee.button('Text', function () {
                    engine.setTool('text');
                }));

                fillPick.addEventListener('input', function () {
                    engine.setFillColor(fillPick.value);
                });

                exportActions.appendChild(coffee.button('Export SVG (new tab)', function () {
                    engine.export();
                }));

                exportActions.appendChild(coffee.button('Copy SVG string', function () {
                    var xml = new XMLSerializer().serializeToString(engine.getSVG());
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(xml).then(function () {
                            if (coffee.toast) coffee.toast('SVG copied', 'success');
                        }).catch(function () {
                            console.log(xml);
                            if (coffee.toast) coffee.toast('See console for SVG', 'info');
                        });
                    } else {
                        console.log(xml);
                        if (coffee.toast) coffee.toast('See console for SVG', 'info');
                    }
                }));

                exportActions.appendChild(coffee.button('Clear canvas', function () {
                    engine.clear();
                    refreshLayers();
                    refreshProps();
                }));

                artboard.addEventListener('mouseup', function () {
                    refreshLayers();
                });

                engine.setTool('rect');
                refreshLayers();
                refreshProps();
            }

            window.addEventListener('coffee:cdn:ready', start);
            var p = window.COFFEE_LOAD_ALL_PROMISE;
            if (p && typeof p.then === 'function') {
                p.then(start).catch(start);
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Rusty // WASM-like Shell</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Fira Code', monospace; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { 
            width: 280px; background: #111; border-right: 1px solid #333; 
            display: flex; flex-direction: column; padding: 20px; gap: 20px; z-index: 10;
        }

        #editor-pane { flex: 1; display: flex; flex-direction: column; background: #050505; border-right: 1px solid #222; }
        #output-pane { flex: 0.8; display: flex; flex-direction: column; background: #000; }

        .pane-header { 
            background: #1a1a1a; padding: 10px 15px; font-size: 10px; 
            color: #bc986a; text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }

        textarea { 
            flex: 1; background: transparent; color: #d4d4d4; border: none; 
            padding: 20px; font-family: inherit; font-size: 14px; outline: none; resize: none;
        }

        #terminal-output { 
            flex: 1; padding: 20px; font-size: 13px; overflow-y: auto; 
            white-space: pre-wrap; line-height: 1.5; color: #27c93f; 
        }

        .status-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #333; color: #aaa; }
        .status-compiling { background: #bc986a; color: #000; }
        .status-error { background: #ff5f56; color: #fff; }

        .example-list { display: flex; flex-direction: column; gap: 5px; }
        h3 { margin: 0; font-size: 12px; color: #bc986a; text-transform: uppercase; }
    </style>

    <!-- Load Prerequisites -->
    <script src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CONTROL/coffee-control.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-RUSTY/coffee-rusty.js"></script>
    
    <!-- Load the UI Stack -->
    <script 
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <aside id="sidebar">
        <div style="font-weight: bold; color: #bc986a; letter-spacing: 2px;">COFFEE // RUSTY</div>
        
        <div class="example-list">
            <h3>Presets</h3>
            <div id="example-btns" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;"></div>
        </div>

        <div class="example-list">
            <h3>Persistence</h3>
            <div id="save-root"></div>
        </div>

        <div style="margin-top: auto; font-size: 10px; color: #444;">
            RUST PLAYGROUND API BRIDGE
        </div>
    </aside>

    <main id="editor-pane">
        <div class="pane-header">
            Source (.rs)
            <div id="run-btn-root"></div>
        </div>
        <textarea id="code-editor" spellcheck="false"></textarea>
    </main>

    <section id="output-pane">
        <div class="pane-header">
            Terminal
            <span id="status-tag" class="status-tag">READY</span>
        </div>
        <div id="terminal-output"></div>
    </section>

    <script>
        window.addEventListener('coffee:cdn:ready', function () {
            const editor = document.getElementById('code-editor');
            const output = document.getElementById('terminal-output');
            const statusTag = document.getElementById('status-tag');
            const exampleBtns = document.getElementById('example-btns');
            const runRoot = document.getElementById('run-btn-root');
            const saveRoot = document.getElementById('save-root');

            function log(text, isError = false) {
                const span = document.createElement('div');
                if (isError) span.style.color = '#ff5f56';
                span.innerText = text;
                output.appendChild(span);
                output.scrollTop = output.scrollHeight;
            }

            // 1. Initialize Coffee Rusty
            // API: coffee.rusty(options)
            const rusty = coffee.rusty({
                onOutput: (text) => log(text),
                onError: (text) => log(text, true),
                onStatus: (status) => {
                    statusTag.innerText = status.toUpperCase();
                    statusTag.className = 'status-tag status-' + status;
                }
            });

            // 2. Logic: Load Initial State (Persistence via Control)
            const lastCode = rusty.loadLastCode();
            editor.value = lastCode || 'fn main() {\n    println!("Hello, Coffee Source!");\n}';

            // 3. UI: Execution
            const runBtn = coffee.button('Run Code', async () => {
                output.innerHTML = '';
                const code = editor.value;
                
                // Persistence
                rusty.saveLastCode(code);
                
                // Execute (Playground API)
                await rusty.execute(code);
            });
            runRoot.appendChild(runBtn);

            // 4. UI: Examples (Dogfooding presets)
            const examples = ['hello', 'structs', 'generics', 'brew'];
            examples.forEach(ex => {
                exampleBtns.appendChild(coffee.button(ex, () => {
                    const code = rusty.loadExample(ex);
                    editor.value = code;
                    if (coffee.toast) coffee.toast(`Loaded example: ${ex}`);
                }));
            });

            // 5. UI: Persistence
            saveRoot.appendChild(coffee.button('Save Snippet', () => {
                const name = prompt("Snippet Name:");
                if (name) {
                    rusty.saveScript(name, editor.value);
                    if (coffee.toast) coffee.toast("Script Saved");
                }
            }));

            // Theme setup
            coffee.injectTheme('dark');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Pattern (sequencer data)</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 300px; background: #151515; border-right: 1px solid #333;
            padding: 20px; display: flex; flex-direction: column; gap: 16px; z-index: 10;
            flex-shrink: 0; overflow-y: auto;
        }

        #main {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
            padding: 16px; gap: 12px;
        }

        .control-group { background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .control-group label { display: block; font-size: 10px; color: #bc986a; text-transform: uppercase; margin-bottom: 8px; }

        input[type="range"], select { width: 100%; margin-bottom: 8px; background: #000; border: 1px solid #444; color: #fff; padding: 6px; box-sizing: border-box; }

        h3 { margin-top: 0; font-size: 14px; color: #bc986a; letter-spacing: 1px; }

        #grid-wrap {
            flex: 1; overflow: auto; background: #111; border: 1px solid #333; border-radius: 8px; padding: 8px;
        }

        .grid {
            display: inline-grid;
            gap: 2px;
            user-select: none;
        }

        .cell {
            width: 14px; height: 14px; background: #222; border-radius: 2px; cursor: pointer;
        }

        .cell.on { background: #bc986a; }
        .cell.drum-on { background: #4c9aff; }

        pre#json-out {
            margin: 0; font-size: 11px; line-height: 1.35; background: #0d0d0d; border: 1px solid #333;
            border-radius: 8px; padding: 12px; overflow: auto; max-height: 180px; color: #a8a8a8;
        }

        .hint { font-size: 11px; color: #666; line-height: 1.4; }
    </style>

    <script
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="sidebar">
        <h3>Pattern data</h3>
        <p class="hint">
            <strong>COFFEE-PATTERN</strong> is <strong>sequencer JSON</strong> (piano roll + drum lanes) — not CSS backgrounds.
            <code>coffee.pattern</code> is an <strong>object</strong> with <code>emptyPianoRoll</code>, <code>emptyDrum</code>, …
        </p>

        <div class="control-group">
            <label>Kind</label>
            <select id="kind">
                <option value="piano">Piano roll</option>
                <option value="drum">Drum lanes</option>
            </select>

            <label>Step count</label>
            <input type="range" id="steps" min="8" max="64" value="16">
            <div id="steps-label" style="font-size:11px;color:#888;margin-bottom:8px;">16 steps</div>
        </div>

        <div id="actions"></div>
    </div>

    <div id="main">
        <div class="hint">Click cells to toggle. JSON below is <code>coffee.pattern</code> serializable state.</div>
        <div id="grid-wrap"><div id="grid-host"></div></div>
        <pre id="json-out"></pre>
    </div>

    <script>
        (function () {
            var started = false;

            function start() {
                if (started) return;
                if (!window.coffee || !coffee.pattern || typeof coffee.pattern.emptyPianoRoll !== 'function') {
                    console.error('coffee.pattern API missing');
                    return;
                }
                started = true;

                var kindEl = document.getElementById('kind');
                var stepsEl = document.getElementById('steps');
                var stepsLabel = document.getElementById('steps-label');
                var gridHost = document.getElementById('grid-host');
                var jsonOut = document.getElementById('json-out');
                var actions = document.getElementById('actions');

                if (typeof coffee.injectTheme === 'function') {
                    coffee.injectTheme('dark');
                }

                var state;
                var rowsPiano = 8;

                function ensureState() {
                    var steps = parseInt(stepsEl.value, 10);
                    var k = kindEl.value;
                    if (k === 'piano') {
                        state = coffee.pattern.emptyPianoRoll({
                            stepCount: steps,
                            notes: state && coffee.pattern.isPianoRoll(state) ? state.notes : []
                        });
                        state.notes = state.notes.filter(function (n) {
                            return n.step < steps && n.row >= 0 && n.row < rowsPiano;
                        });
                    } else {
                        state = coffee.pattern.emptyDrum({
                            stepCount: steps,
                            padIds: state && coffee.pattern.isDrum(state) ? state.padIds : ['k', 's', 'h', 'o']
                        });
                    }
                }

                function hasPianoNote(step, row) {
                    return state.notes.some(function (n) {
                        return n.step === step && n.row === row;
                    });
                }

                function togglePianoNote(step, row) {
                    var i = -1;
                    state.notes.forEach(function (n, idx) {
                        if (n.step === step && n.row === row) i = idx;
                    });
                    if (i >= 0) state.notes.splice(i, 1);
                    else state.notes.push({ step: step, row: row, length: 1 });
                }

                function renderGrid() {
                    ensureState();
                    stepsLabel.textContent = state.stepCount + ' steps';
                    gridHost.innerHTML = '';

                    var g = document.createElement('div');
                    g.className = 'grid';

                    if (coffee.pattern.isPianoRoll(state)) {
                        g.style.gridTemplateColumns = 'repeat(' + state.stepCount + ', 14px)';
                        g.style.gridTemplateRows = 'repeat(' + rowsPiano + ', 14px)';
                        for (var row = rowsPiano - 1; row >= 0; row--) {
                            for (var step = 0; step < state.stepCount; step++) {
                                (function (s, r) {
                                    var c = document.createElement('div');
                                    c.className = 'cell' + (hasPianoNote(s, r) ? ' on' : '');
                                    c.title = 'step ' + s + ', row ' + r;
                                    c.onclick = function () {
                                        togglePianoNote(s, r);
                                        renderGrid();
                                        dumpJson();
                                    };
                                    g.appendChild(c);
                                })(step, row);
                            }
                        }
                    } else {
                        var pads = state.padIds;
                        g.style.gridTemplateColumns = 'repeat(' + state.stepCount + ', 14px)';
                        g.style.gridTemplateRows = 'repeat(' + pads.length + ', 14px)';
                        pads.forEach(function (pad, ri) {
                            for (var step = 0; step < state.stepCount; step++) {
                                (function (p, s, laneIdx) {
                                    var c = document.createElement('div');
                                    var on = state.lanes[p][s] === 1;
                                    c.className = 'cell' + (on ? ' drum-on' : '');
                                    c.title = p + ' @ ' + s;
                                    c.onclick = function () {
                                        state.lanes[p][s] = state.lanes[p][s] ? 0 : 1;
                                        renderGrid();
                                        dumpJson();
                                    };
                                    g.appendChild(c);
                                })(pad, step, ri);
                            }
                        });
                    }

                    gridHost.appendChild(g);
                    dumpJson();
                }

                function dumpJson() {
                    jsonOut.textContent = JSON.stringify(state, null, 2);
                }

                kindEl.addEventListener('change', function () {
                    state = null;
                    renderGrid();
                });
                stepsEl.addEventListener('input', renderGrid);

                actions.appendChild(coffee.button('Clone pattern', function () {
                    var copy = coffee.pattern.clone(state);
                    if (coffee.toast) coffee.toast('Cloned to console', 'info');
                    console.log('clone', copy);
                }));

                actions.appendChild(coffee.button('Copy JSON', function () {
                    var t = JSON.stringify(state);
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(t).then(function () {
                            if (coffee.toast) coffee.toast('JSON copied', 'success');
                        });
                    } else {
                        console.log(t);
                        if (coffee.toast) coffee.toast('See console', 'info');
                    }
                }));

                renderGrid();
                console.log('TEST21: coffee.pattern —', coffee.pattern);
            }

            window.addEventListener('coffee:cdn:ready', start);
            var p = window.COFFEE_LOAD_ALL_PROMISE;
            if (p && typeof p.then === 'function') {
                p.then(start).catch(start);
            }
        })();
    </script>
</body>
</html>

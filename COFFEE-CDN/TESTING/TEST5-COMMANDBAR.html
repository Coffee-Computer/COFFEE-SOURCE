<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Command Bar</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding-top: 15vh;
        }

        /* Modal styling for the command bar */
        #command-palette {
            width: 500px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .cmd-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: white;
            padding: 18px;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
        }

        .list-container {
            max-height: 300px;
            overflow-y: auto;
        }

        /* COFFEE-LIST item styling */
        .coffee-list-item {
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .coffee-list-item:hover, .coffee-list-item.selected {
            background: #2a2a2a;
            border-left-color: #bc986a;
        }

        .item-hint {
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            color: #666;
        }
    </style>

    <!-- Load the full stack. load-all.js pulls BASE, UI, LIST, and FILTER automatically -->
    <script 
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="command-palette">
        <input type="text" class="cmd-input" placeholder="Type a command or search..." id="cmd-input" autofocus>
        <div id="list-root" class="list-container"></div>
    </div>

    <script>
        window.addEventListener('coffee:cdn:ready', function () {
            const input = document.getElementById('cmd-input');
            const listRoot = document.getElementById('list-root');

            // 1. Define the Action Registry
            const actions = [
                { id: 'cal', title: 'Open Calendar', hint: 'App', run: () => console.log('Opening Calendar...') },
                { id: 'todo', title: 'New Todo Item', hint: 'Task', run: () => console.log('Creating Task...') },
                { id: 'dark', title: 'Toggle Dark Mode', hint: 'System', run: () => document.body.style.filter = 'invert(1)' },
                { id: 'gh', title: 'Go to Coffee GitHub', hint: 'Link', run: () => window.open('https://github.com/Coffee-Computer/COFFEE-SOURCE') },
                { id: '3d', title: 'Launch 3D Scene', hint: 'Art', run: () => console.log('Initializing WebGL...') },
                { id: 'clr', title: 'Clear History', hint: 'Danger', run: () => alert('Cleared!') }
            ];

            // 2. Refresh function combining FILTER and LIST
            function refresh(query = '') {
                listRoot.innerHTML = '';

                // Use COFFEE-FILTER logic (fuzzy match)
                // Assuming coffee.filter(array, query, keyToMatch)
                const filtered = coffee.filter ? 
                    coffee.filter(actions, query, 'title') : 
                    actions.filter(a => a.title.toLowerCase().includes(query.toLowerCase()));

                if (filtered.length === 0) {
                    listRoot.innerHTML = '<div class="empty-state">No commands found.</div>';
                    return;
                }

                // Use COFFEE-LIST builder
                // We pass the filtered data and a template function
                const listWidget = coffee.list(filtered, (item) => {
                    const row = document.createElement('div');
                    row.className = 'coffee-list-item';
                    
                    const text = document.createElement('span');
                    text.innerText = item.title;

                    const hint = document.createElement('span');
                    hint.className = 'item-hint';
                    hint.innerText = item.hint;

                    row.append(text, hint);
                    row.onclick = () => {
                        item.run();
                        input.value = '';
                        refresh('');
                    };
                    
                    return row;
                });

                listRoot.appendChild(listWidget);
            }

            // 3. Event Listeners
            input.addEventListener('input', (e) => refresh(e.target.value));

            // Keyboard navigation (CMD+K / ESC focus)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
                    e.preventDefault();
                    input.focus();
                }
                if (e.key === 'Escape') {
                    input.blur();
                    refresh('');
                }
            });

            // Initial render
            refresh('');
            
            console.log("Command Bar Ready with COFFEE-FILTER & COFFEE-LIST");
        });
    </script>
</body>
</html>

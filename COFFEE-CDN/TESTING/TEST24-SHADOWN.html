<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shadow // Preset Visualizer</title>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { 
            width: 320px; background: #0c0c0c; border-right: 1px solid #222; 
            padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }

        #viewport { 
            flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center;
        }

        #gpuCanvas { width: 100%; height: 100%; display: block; }

        .preset-section { margin-bottom: 20px; }
        .preset-section h3 { margin: 0 0 10px 0; font-size: 11px; color: #bc986a; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .config-view { 
            margin-top: auto; font-family: 'Fira Code', monospace; font-size: 10px; 
            color: #666; background: #000; padding: 15px; border-radius: 6px; 
            border: 1px solid #222; max-height: 200px; overflow-y: auto;
        }
    </style>

    <!-- Load Coffee Source stack via CDN -->
    <script 
        src="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-CDN/load-all.js"
        data-coffee-cdn="https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/">
    </script>
</head>
<body>

    <div id="sidebar">
        <div style="font-weight: bold; color: #bc986a; letter-spacing: 2px;">SHADOW // VISUALIZER</div>
        
        <div class="preset-section">
            <h3>Liquid (Flat)</h3>
            <div id="liquid-btns" class="btn-group"></div>
        </div>

        <div class="preset-section">
            <h3>Layered (Complex)</h3>
            <div id="layered-btns" class="btn-group"></div>
        </div>

        <div id="active-config" class="config-view">Waiting for selection...</div>
    </div>

    <div id="viewport">
        <!-- The target for COFFEE-SHADE via COFFEE-SHADOW -->
        <canvas id="gpuCanvas"></canvas>
    </div>

    <script>
        window.addEventListener('coffee:cdn:ready', async function () {
            const liquidRoot = document.getElementById('liquid-btns');
            const layeredRoot = document.getElementById('layered-btns');
            const configView = document.getElementById('active-config');

            const BASE_URL = 'https://cdn.jsdelivr.net/gh/Coffee-Computer/COFFEE-SOURCE@main/COFFEE-SHADOW/presets/';

            // 1. Preset Library (as per README structure)
            const presets = {
                liquid: ['default', 'ocean', 'plasma', 'intense'],
                layered: ['default', 'sunset', 'ocean', 'matrix']
            };

            let currentShade = null;

            // 2. Runner Logic (Tri-Arc: Shadow -> Shade -> Shader)
            async function runPreset(shader, preset) {
                configView.innerText = `Loading ${shader}/${preset}...`;
                
                try {
                    // API: coffee.shadow.run({ canvas, shader, preset, baseUrl })
                    // This handles the fetch and initializes COFFEE-SHADE
                    currentShade = await coffee.shadow.run({
                        canvas: '#gpuCanvas',
                        shader: shader,
                        preset: preset,
                        baseUrl: BASE_URL
                    });

                    // Fetch the raw config for the visualizer display
                    const config = await coffee.shadow.load(shader, preset, { baseUrl: BASE_URL });
                    configView.innerText = JSON.stringify(config, null, 2);

                    if (coffee.toast) coffee.toast(`Shadow: Activated ${preset}`);
                } catch (e) {
                    console.error("Shadow run failed:", e);
                    configView.innerText = "Error: WebGPU not supported or Preset 404";
                }
            }

            // 3. UI Generation (COFFEE-UI)
            presets.liquid.forEach(p => {
                liquidRoot.appendChild(coffee.button(p, () => runPreset('liquid', p)));
            });

            presets.layered.forEach(p => {
                layeredRoot.appendChild(coffee.button(p, () => runPreset('layered', p)));
            });

            // 4. Initial Theme & First Run
            coffee.injectTheme('dark');
            
            // Auto-run default layered preset
            runPreset('layered', 'default');
            
            // Handle canvas resizing
            window.addEventListener('resize', () => {
                if (currentShade && currentShade.resize) currentShade.resize();
            });
        });
    </script>
</body>
</html>

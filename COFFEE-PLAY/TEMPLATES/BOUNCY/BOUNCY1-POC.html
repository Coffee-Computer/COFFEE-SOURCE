<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bouncy - Free Form Stacker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .status-pill {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div class="ui-layer">
    <div class="status-pill">
        FREE PLAY MODE
    </div>
    <div id="msg" class="mt-4 bg-emerald-500 px-4 py-1 rounded-full text-sm font-bold opacity-80">
        CLICK TO DROP BLOCKS
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * BOUNCY1-POC — reference (inline RAF, window mouse/touch).
 * Coffee stack: BOUNCY.html + logic/coffee-play-bouncy-game.js + shapes (see TEMPLATES/BOUNCY/README.md).
 *
 * BOUNCY — Free Form Stacker. Physics: sub-steps, separation + slop, resting velocity kill.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.25;
const FRICTION = 0.98;
const BOUNCE = 0.3; // Reduced slightly for stability
const GROUND_Y = 150; 
const SLOP = 0.5; // Amount of allowed penetration to prevent jitter
const PERCENT = 0.4; // How much of the penetration to correct per frame

let width, height;
let shapes = [];
let previewShape = null;
let cameraY = 0;

class Shape {
    constructor(x, y, w, h, color) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.isResting = false;
    }

    update() {
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        
        this.vx *= FRICTION;
        this.vy *= FRICTION;

        // Collision with floor
        const floorY = height - GROUND_Y;
        if (this.y + this.h/2 > floorY) {
            const penetration = (this.y + this.h/2) - floorY;
            this.y -= penetration; // Snap to top
            this.vy *= -BOUNCE;
            
            // Dampen horizontal movement on floor
            this.vx *= 0.9;
            
            if (Math.abs(this.vy) < 0.5) this.vy = 0;
        }

        // Collision with other shapes
        for (let other of shapes) {
            if (other === this) continue;
            this.resolveCollision(other);
        }

        // Stability check: if moving very slowly, kill velocity to stop jitter
        if (Math.abs(this.vx) < 0.01) this.vx = 0;
        if (Math.abs(this.vy) < 0.1 && this.onTopOfSomething()) this.vy = 0;
    }

    onTopOfSomething() {
        const floorY = height - GROUND_Y;
        if (Math.abs((this.y + this.h/2) - floorY) < 1) return true;
        for (let other of shapes) {
            if (other === this) continue;
            const dx = Math.abs(this.x - other.x);
            const dy = (other.y - other.h/2) - (this.y + this.h/2);
            if (dx < (this.w + other.w)/2 && dy >= 0 && dy < 1) return true;
        }
        return false;
    }

    resolveCollision(other) {
        const dx = this.x - other.x;
        const dy = this.y - other.y;
        const halfW = (this.w + other.w) / 2;
        const halfH = (this.h + other.h) / 2;

        if (Math.abs(dx) < halfW && Math.abs(dy) < halfH) {
            const overlapX = halfW - Math.abs(dx);
            const overlapY = halfH - Math.abs(dy);

            // Resolve on the axis of least penetration
            if (overlapX < overlapY) {
                const dir = dx > 0 ? 1 : -1;
                // Positional correction
                const correction = Math.max(overlapX - SLOP, 0) * PERCENT * dir;
                this.x += correction;
                other.x -= correction;

                // Simple impulse
                const relativeVelocity = this.vx - other.vx;
                if (relativeVelocity * dir < 0) {
                    const j = -(1 + BOUNCE) * relativeVelocity;
                    this.vx += j * 0.5 * dir;
                    other.vx -= j * 0.5 * dir;
                }
            } else {
                const dir = dy > 0 ? 1 : -1;
                // Positional correction
                const correction = Math.max(overlapY - SLOP, 0) * PERCENT * dir;
                this.y += correction;
                other.y -= correction;

                // Simple impulse
                const relativeVelocity = this.vy - other.vy;
                if (relativeVelocity * dir < 0) {
                    const j = -(1 + BOUNCE) * relativeVelocity;
                    this.vy += j * 0.5 * dir;
                    other.vy -= j * 0.5 * dir;
                }
                
                // Friction transfer (helps stacking stability)
                const frictionImpulse = (other.vx - this.vx) * 0.1;
                this.vx += frictionImpulse;
                other.vx -= frictionImpulse;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y - cameraY);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-this.w/2 + 4, -this.h/2 + 4, this.w, this.h);
        
        // Body
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        
        // Shine/Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(-this.w/2, -this.h/2, this.w, 4);

        ctx.restore();
    }
}

function init() {
    resize();
    createPreview();
    requestAnimationFrame(gameLoop);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function createPreview() {
    const w = 40 + Math.random() * 60;
    const h = 30 + Math.random() * 30;
    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#f97316'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    previewShape = new Shape(width / 2, 100 + cameraY, w, h, color);
}

function update() {
    // Run physics sub-steps for better stability
    const subSteps = 2;
    for(let i = 0; i < subSteps; i++) {
        shapes.forEach(s => s.update());
    }

    shapes = shapes.filter(s => s.x > -200 && s.x < width + 200 && s.y < height + 1000);

    let highestPoint = height - GROUND_Y;
    shapes.forEach(s => {
        if (s.y - s.h/2 < highestPoint) highestPoint = s.y - s.h/2;
    });
    
    const targetCameraY = Math.min(0, highestPoint - height * 0.5);
    cameraY += (targetCameraY - cameraY) * 0.05;

    if (previewShape) {
        previewShape.y = 100 + cameraY;
    }
}

function draw() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#1e293b');
    grad.addColorStop(1, '#0f172a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#334155';
    ctx.fillRect(0, height - GROUND_Y - cameraY, width, height + 500);
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, height - GROUND_Y - cameraY, width, 8);

    shapes.forEach(s => s.draw());
    if (previewShape) {
        ctx.globalAlpha = 0.5;
        previewShape.draw();
        ctx.globalAlpha = 1.0;
        
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.moveTo(previewShape.x, previewShape.y - cameraY);
        ctx.lineTo(previewShape.x, height);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('mousemove', (e) => {
    if (previewShape) previewShape.x = e.clientX;
});

// Touch support for moving the preview
window.addEventListener('touchmove', (e) => {
    if (previewShape && e.touches[0]) {
        previewShape.x = e.touches[0].clientX;
    }
});

window.addEventListener('mousedown', () => {
    if (previewShape) {
        shapes.push(previewShape);
        previewShape = null;
        setTimeout(createPreview, 350);
    }
});

window.addEventListener('touchstart', (e) => {
    if (previewShape && e.touches[0]) {
        previewShape.x = e.touches[0].clientX;
        shapes.push(previewShape);
        previewShape = null;
        setTimeout(createPreview, 350);
    }
});

window.addEventListener('resize', resize);
window.onload = init;

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Territory - Survival Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .inventory-slot {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.1s;
        }
        .inventory-slot.active {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div class="ui-overlay">
    <div class="flex gap-2" id="hotbar">
        <!-- Slots generated by JS -->
    </div>
    <div class="bg-black/60 p-2 rounded-lg text-white text-sm border border-white/20 inline-block">
        BUILD STOCK: <span id="block-count" class="font-bold text-cyan-400">0</span>
    </div>
</div>

<div class="controls-hint">
    <b>WASD / Arrows</b>: Move & Jump | <b>Click</b>: Mine / Place | <b>1-3</b>: Hotbar
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * TERRITORY1-POC — reference implementation (inline RAF + e.code keys).
 * Coffee stack version: TERRITORY.html + logic/coffee-play-territory-game.js + shapes (see TEMPLATES/TERRITORY/README.md).
 *
 * TERRITORY — side-scrolling sandbox survival game.
 * Optimized for smooth collisions and movement.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Constants
const TILE_SIZE = 32;
const GRAVITY = 0.35;
const FRICTION = 0.82;
const PLAYER_SPEED = 4.5;
const JUMP_FORCE = -8.5;
const COLLISION_BUFFER = 0.1; // Prevents getting stuck in loops

// Block Types
const BLOCKS = {
    AIR: 0,
    DIRT: 1,
    GRASS: 2,
    STONE: 3,
    WOOD: 4,
    LEAVES: 5
};

const BLOCK_DATA = {
    [BLOCKS.DIRT]: { color: '#8B4513', emoji: '🟫', name: 'Dirt' },
    [BLOCKS.GRASS]: { color: '#228B22', emoji: '🌱', name: 'Grass' },
    [BLOCKS.STONE]: { color: '#808080', emoji: '🪨', name: 'Stone' },
    [BLOCKS.WOOD]: { color: '#5D4037', emoji: '🪵', name: 'Wood' },
    [BLOCKS.LEAVES]: { color: '#2E7D32', emoji: '🍃', name: 'Leaves' }
};

// World State
let world = [];
const WORLD_WIDTH = 250;
const WORLD_HEIGHT = 80;
let camera = { x: 0, y: 0 };

// Player State
const player = {
    x: (WORLD_WIDTH * TILE_SIZE) / 2,
    y: 0,
    vx: 0,
    vy: 0,
    width: 22,
    height: 46,
    grounded: false,
    selectedSlot: 0,
    inventory: [
        { type: BLOCKS.DIRT, count: 50 },
        { type: BLOCKS.WOOD, count: 20 },
        { type: BLOCKS.STONE, count: 10 }
    ]
};

// Input State
const keys = {};
let mouse = { x: 0, y: 0, down: false };

function init() {
    generateWorld();
    setupUI();
    
    // Position player on surface
    const centerX = Math.floor(player.x / TILE_SIZE);
    player.y = (findSurface(centerX) - 3) * TILE_SIZE;

    resize();
    requestAnimationFrame(gameLoop);
}

function generateWorld() {
    for (let x = 0; x < WORLD_WIDTH; x++) {
        world[x] = new Array(WORLD_HEIGHT).fill(BLOCKS.AIR);
    }

    for (let x = 0; x < WORLD_WIDTH; x++) {
        const groundHeight = 40 + Math.sin(x * 0.1) * 6 + Math.cos(x * 0.05) * 3;
        
        for (let y = 0; y < WORLD_HEIGHT; y++) {
            if (y > groundHeight + 8) {
                world[x][y] = BLOCKS.STONE;
            } else if (y > groundHeight) {
                world[x][y] = BLOCKS.DIRT;
            } else if (y > groundHeight - 1) {
                world[x][y] = BLOCKS.GRASS;
            }
        }
    }

    // Pass for trees
    for (let x = 10; x < WORLD_WIDTH - 10; x++) {
        if (x % 12 === 0 && Math.random() > 0.3) {
            const groundY = findSurface(x);
            if (world[x][groundY] === BLOCKS.GRASS) {
                for (let h = 1; h <= 5; h++) {
                    safeSetBlock(x, groundY - h, BLOCKS.WOOD);
                }
                const ly = groundY - 5;
                safeSetBlock(x - 1, ly, BLOCKS.LEAVES);
                safeSetBlock(x + 1, ly, BLOCKS.LEAVES);
                safeSetBlock(x, ly - 1, BLOCKS.LEAVES);
            }
        }
    }
}

function findSurface(x) {
    if (x < 0 || x >= WORLD_WIDTH) return 0;
    for (let y = 0; y < WORLD_HEIGHT; y++) {
        if (world[x][y] !== BLOCKS.AIR) return y;
    }
    return WORLD_HEIGHT - 1;
}

function safeSetBlock(x, y, type) {
    if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
        world[x][y] = type;
    }
}

function setupUI() {
    const hotbar = document.getElementById('hotbar');
    hotbar.innerHTML = '';
    player.inventory.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = `inventory-slot ${index === player.selectedSlot ? 'active' : ''}`;
        slot.innerHTML = BLOCK_DATA[item.type].emoji;
        slot.onclick = () => selectSlot(index);
        hotbar.appendChild(slot);
    });
}

function selectSlot(index) {
    player.selectedSlot = index;
    setupUI();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function update() {
    // Horizontal Input
    let moveDir = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir += 1;
    
    player.vx += moveDir * 0.8;
    player.vx *= FRICTION;

    // Vertical Input (Jump)
    if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
    }

    // Apply Gravity
    player.vy += GRAVITY;

    // Horizontal Movement & Collision
    player.x += player.vx;
    checkCollisions(true);

    // Vertical Movement & Collision
    player.y += player.vy;
    player.grounded = false;
    checkCollisions(false);

    // Camera follow (Smoothed)
    const targetCamX = player.x - canvas.width / 2;
    const targetCamY = player.y - canvas.height / 2;
    camera.x += (targetCamX - camera.x) * 0.15;
    camera.y += (targetCamY - camera.y) * 0.15;

    // Interaction
    if (mouse.down) handleInteraction();
    
    // Update UI numbers
    const currentItem = player.inventory[player.selectedSlot];
    const countElement = document.getElementById('block-count');
    if (countElement && currentItem) {
        countElement.innerText = currentItem.count;
    }
}

function checkCollisions(isHorizontal) {
    // Get tile bounds
    const left = Math.floor(player.x / TILE_SIZE);
    const right = Math.floor((player.x + player.width) / TILE_SIZE);
    const top = Math.floor(player.y / TILE_SIZE);
    const bottom = Math.floor((player.y + player.height) / TILE_SIZE);

    for (let x = left; x <= right; x++) {
        for (let y = top; y <= bottom; y++) {
            if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
                if (world[x][y] !== BLOCKS.AIR) {
                    // Collision detected
                    if (isHorizontal) {
                        if (player.vx > 0) {
                            player.x = x * TILE_SIZE - player.width - COLLISION_BUFFER;
                        } else if (player.vx < 0) {
                            player.x = (x + 1) * TILE_SIZE + COLLISION_BUFFER;
                        }
                        player.vx = 0;
                    } else {
                        if (player.vy > 0) {
                            player.y = y * TILE_SIZE - player.height - COLLISION_BUFFER;
                            player.grounded = true;
                        } else if (player.vy < 0) {
                            player.y = (y + 1) * TILE_SIZE + COLLISION_BUFFER;
                        }
                        player.vy = 0;
                    }
                }
            }
        }
    }
}

function handleInteraction() {
    const worldX = Math.floor((mouse.x + camera.x) / TILE_SIZE);
    const worldY = Math.floor((mouse.y + camera.y) / TILE_SIZE);

    if (worldX < 0 || worldX >= WORLD_WIDTH || worldY < 0 || worldY >= WORLD_HEIGHT) return;

    // Max reach distance
    const dx = (player.x + player.width / 2) - (worldX * TILE_SIZE + TILE_SIZE / 2);
    const dy = (player.y + player.height / 2) - (worldY * TILE_SIZE + TILE_SIZE / 2);
    if (Math.sqrt(dx*dx + dy*dy) > 180) return;

    const currentItem = player.inventory[player.selectedSlot];

    if (world[worldX][worldY] !== BLOCKS.AIR) {
        // Break block
        const minedType = world[worldX][worldY];
        world[worldX][worldY] = BLOCKS.AIR;
        
        let invItem = player.inventory.find(i => i.type === minedType);
        if (invItem) invItem.count++;
        else player.inventory.push({ type: minedType, count: 1 });
        
        setupUI();
    } else if (currentItem && currentItem.count > 0) {
        // Place block (prevent placing on player)
        const blockRect = { x: worldX * TILE_SIZE, y: worldY * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
        const pRect = { x: player.x, y: player.y, w: player.width, h: player.height };
        
        const isOverlap = !(blockRect.x >= pRect.x + pRect.w || 
                            blockRect.x + blockRect.w <= pRect.x || 
                            blockRect.y >= pRect.y + pRect.h || 
                            blockRect.y + blockRect.h <= pRect.y);
        
        if (!isOverlap) {
            world[worldX][worldY] = currentItem.type;
            currentItem.count--;
            setupUI();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky Background
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, "#29a3e3");
    sky.addColorStop(1, "#87CEEB");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

    // Culling area
    const startX = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    const endX = Math.min(WORLD_WIDTH, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
    const startY = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    const endY = Math.min(WORLD_HEIGHT, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

    // Draw Blocks
    for (let x = startX; x < endX; x++) {
        for (let y = startY; y < endY; y++) {
            const block = world[x][y];
            if (block !== BLOCKS.AIR) {
                const data = BLOCK_DATA[block];
                ctx.fillStyle = data.color;
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                
                // Add texture/shading
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE + TILE_SIZE - 4, TILE_SIZE, 4);
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, 4);
            }
        }
    }

    // Draw Player
    // Body
    ctx.fillStyle = '#3F51B5'; // Blue Shirt
    ctx.fillRect(player.x, player.y + 20, player.width, 26);
    // Head
    ctx.fillStyle = '#FFCC88'; // Skin
    ctx.fillRect(player.x + 2, player.y, player.width - 4, 20);
    // Eyes
    ctx.fillStyle = '#000';
    const eyeX = player.vx >= 0 ? 14 : 4;
    ctx.fillRect(player.x + eyeX, player.y + 6, 4, 4);

    // Highlight Tile under mouse
    const mouseWorldX = Math.floor((mouse.x + camera.x) / TILE_SIZE);
    const mouseWorldY = Math.floor((mouse.y + camera.y) / TILE_SIZE);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(mouseWorldX * TILE_SIZE, mouseWorldY * TILE_SIZE, TILE_SIZE, TILE_SIZE);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Controls
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Digit1') selectSlot(0);
    if (e.code === 'Digit2') selectSlot(1);
    if (e.code === 'Digit3') selectSlot(2);
});
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);
window.addEventListener('resize', resize);

window.onload = init;

</script>
</body>
</html>

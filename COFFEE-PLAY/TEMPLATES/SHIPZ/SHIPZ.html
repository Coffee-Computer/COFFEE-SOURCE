<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shipz // Asteroids template (coffee.play)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050505; color: #00ffcc; font-family: ui-monospace, 'Courier New', monospace; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; background: #000; }
    #hud {
      position: fixed; left: 0; right: 0; top: 0; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; font-size: 14px; font-weight: 800; letter-spacing: 0.06em;
      text-shadow: 0 0 10px #00ffcc, 0 0 2px #000;
    }
    #hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      font-size: 12px; opacity: 0.55; pointer-events: none;
    }
    @media (max-width: 767px) { #hint { display: none; } }
    #game-over {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88); z-index: 20; pointer-events: auto;
    }
    #game-over .panel {
      border: 2px solid #00ffcc; padding: 36px 48px; text-align: center; max-width: 90vw;
      background: rgba(0,0,0,0.95);
    }
    #game-over h1 { margin: 0 0 12px; font-size: 1.5rem; }
    #game-over button {
      margin-top: 20px; padding: 10px 24px; border: none; background: #00ffcc; color: #000;
      font-weight: 800; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span>SCORE: <span id="score">0</span></span>
    <span>LIVES: <span id="lives">3</span></span>
  </div>
  <canvas id="stage"></canvas>
  <div id="hint">W / ↑ THRUST · A/D TURN · CLICK / TAP FIRE · MOUSE AIM</div>

  <div id="game-over">
    <div class="panel">
      <h1>SYSTEM FAILURE</h1>
      <p>Final score: <span id="final-score">0</span></p>
      <button type="button" id="reboot">REBOOT SYSTEM</button>
    </div>
  </div>

  <script src="../../../COFFEE-DOT/coffee-dot.js"></script>
  <script src="../../../COFFEE-CUP/coffee-cup.js"></script>
  <script src="../../shapes/coffee-play-shapes.js"></script>
  <script src="../../logic/coffee-play-asteroids-game.js"></script>
  <script src="../../coffee-play.js"></script>
  <script>
(function () {
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var gameOverEl = document.getElementById('game-over');
  var finalScoreEl = document.getElementById('final-score');
  var rebootBtn = document.getElementById('reboot');

  var ag = coffee.playAsteroidsGame.create({
    callbacks: {
      onScore: function (n) { scoreEl.textContent = String(n); },
      onLives: function (n) { livesEl.textContent = String(n); },
      onGameOver: function (final) {
        finalScoreEl.textContent = String(final);
        gameOverEl.style.display = 'flex';
      }
    }
  });

  var prevSpace = false;
  var prevMouseDown = false;
  var pendingFire = false;
  var touchAimX = 0;
  var touchAimY = 0;
  var touchActive = false;

  var canvas = document.getElementById('stage');
  canvas.addEventListener('touchstart', function (e) {
    if (e.target !== canvas) return;
    e.preventDefault();
    var t = e.touches[0];
    touchAimX = t.clientX;
    touchAimY = t.clientY;
    touchActive = true;
    pendingFire = true;
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    if (!touchActive) return;
    e.preventDefault();
    var t = e.touches[0];
    touchAimX = t.clientX;
    touchAimY = t.clientY;
  }, { passive: false });
  window.addEventListener('touchend', function () { touchActive = false; });

  rebootBtn.addEventListener('click', function () {
    gameOverEl.style.display = 'none';
    ag.reset();
  });

  coffee.play('#stage', {
    onUpdate: function (game) {
      var k = game.keys;
      var fire = pendingFire ||
        (!!k[' '] && !prevSpace) ||
        (game.mouse.down && !prevMouseDown);
      pendingFire = false;
      prevSpace = !!k[' '];
      prevMouseDown = game.mouse.down;

      var aimX = touchActive ? touchAimX : game.mouse.x;
      var aimY = touchActive ? touchAimY : game.mouse.y;

      ag.step(16, {
        bounds: { w: game.canvas.width, h: game.canvas.height },
        aimX: aimX,
        aimY: aimY,
        keys: k,
        fireRequested: fire
      });
    },
    onDraw: function (ctx, game) {
      var st = ag.getState();
      var S = coffee.playShapes;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, game.canvas.width, game.canvas.height);

      var i;
      for (i = 0; i < st.particles.length; i++) {
        var p = st.particles[i];
        S.drawParticle(ctx, { cx: p.x, cy: p.y, r: p.radius, life: p.life, color: p.color });
      }
      for (i = 0; i < st.bullets.length; i++) {
        var b = st.bullets[i];
        S.drawBulletDot(ctx, { cx: b.x, cy: b.y, r: b.radius });
      }
      for (i = 0; i < st.asteroids.length; i++) {
        var a = st.asteroids[i];
        S.drawAsteroidRock(ctx, {
          cx: a.x, cy: a.y, radius: a.radius, vertCount: a.vertCount, offsets: a.offsets
        });
      }
      if (st.ship && !st.gameOver) {
        var blink = st.ship.invulnerable > 0 && Math.floor(performance.now() / 100) % 2 === 0;
        S.drawShip(ctx, {
          cx: st.ship.x,
          cy: st.ship.y,
          angle: st.ship.angle,
          thrusting: st.ship.thrusting,
          visible: !blink
        });
      }
    }
  });
})();
  </script>
</body>
</html>

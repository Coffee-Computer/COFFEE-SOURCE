<!DOCTYPE html>
<html lang="en">
<head>
    <!-- POC: standalone RAF. Stack template: SHIPZ.html — see README.md -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shipz - Asteroids Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            color: #00ffcc;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc;
        }
        canvas {
            display: block;
            background: #000;
            cursor: crosshair;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.6;
            font-size: 14px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 2px solid #00ffcc;
            text-align: center;
            display: none;
            z-index: 10;
        }
        button {
            background: #00ffcc;
            color: black;
            padding: 10px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="text-2xl">SCORE: <span id="score">0</span></div>
    <div class="text-xl">LIVES: <span id="lives">3</span></div>
</div>

<div id="game-over">
    <h1 class="text-4xl mb-4">SYSTEM FAILURE</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button onclick="restartGame()">REBOOT SYSTEM</button>
</div>

<canvas id="gameCanvas"></canvas>

<div class="controls-hint md:block hidden">
    W/UP: THRUST | CLICK/TAP: FIRE | MOUSE: AIM
</div>

<script>
/**
 * SHIPZ - Asteroids Clone
 * Updated with Mouse/Touch Aim & Fire
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

// Game State
let score = 0;
let lives = 3;
let isGameOver = false;
const FRICTION = 0.99;
const SHIP_THRUST = 0.15;
const SHIP_TURN_SPEED = 0.08;
const BULLET_SPEED = 8;
const BULLET_MAX_DIST = 0.7;

let ship;
let asteroids = [];
let bullets = [];
let particles = [];
let keys = {};
let mousePos = { x: 0, y: 0 };

// Handle Resize
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Entity {
    constructor(x, y, radius) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = radius;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -this.radius) this.x = canvas.width + this.radius;
        else if (this.x > canvas.width + this.radius) this.x = -this.radius;
        if (this.y < -this.radius) this.y = canvas.height + this.radius;
        else if (this.y > canvas.height + this.radius) this.y = -this.radius;
    }
}

class Ship extends Entity {
    constructor() {
        super(canvas.width / 2, canvas.height / 2, 12);
        this.angle = -Math.PI / 2;
        this.thrusting = false;
        this.invulnerable = 120;
    }

    draw() {
        if (this.invulnerable > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-10, 10);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-10, -10);
        ctx.closePath();
        ctx.stroke();

        if (this.thrusting) {
            ctx.strokeStyle = '#ff3300';
            ctx.beginPath();
            ctx.moveTo(-7, 0);
            ctx.lineTo(-15, 5);
            ctx.lineTo(-12, 0);
            ctx.lineTo(-15, -5);
            ctx.closePath();
            ctx.stroke();
        }
        ctx.restore();
    }

    update() {
        // Aiming logic: point towards mouse/last touch
        const dx = mousePos.x - this.x;
        const dy = mousePos.y - this.y;
        this.angle = Math.atan2(dy, dx);

        // Movement logic
        if (keys['ArrowUp'] || keys['w']) {
            this.vx += Math.cos(this.angle) * SHIP_THRUST;
            this.vy += Math.sin(this.angle) * SHIP_THRUST;
            this.thrusting = true;
        } else {
            this.thrusting = false;
        }

        // Allow manual rotation with keys as well
        if (keys['ArrowLeft'] || keys['a']) this.angle -= SHIP_TURN_SPEED;
        if (keys['ArrowRight'] || keys['d']) this.angle += SHIP_TURN_SPEED;

        this.vx *= FRICTION;
        this.vy *= FRICTION;

        if (this.invulnerable > 0) this.invulnerable--;
        super.update();
    }
}

class Asteroid extends Entity {
    constructor(x, y, radius, level = 3) {
        super(x, y, radius);
        this.level = level;
        const speed = (4 - level) * 0.8 + Math.random();
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.vertCount = 8 + Math.floor(Math.random() * 5);
        this.offsets = [];
        for (let i = 0; i < this.vertCount; i++) {
            this.offsets.push(Math.random() * 0.4 + 0.8);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < this.vertCount; i++) {
            const angle = (i / this.vertCount) * Math.PI * 2;
            const r = this.radius * this.offsets[i];
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
}

class Bullet extends Entity {
    constructor(x, y, angle) {
        super(x, y, 2);
        this.vx = Math.cos(angle) * BULLET_SPEED;
        this.vy = Math.sin(angle) * BULLET_SPEED;
        this.distTraveled = 0;
    }

    update() {
        super.update();
        this.distTraveled += BULLET_SPEED;
    }

    draw() {
        ctx.fillStyle = '#ff3300';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.02;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }

    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function initLevel() {
    ship = new Ship();
    asteroids = [];
    bullets = [];
    particles = [];
    spawnAsteroids(5);
}

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 150);
        
        asteroids.push(new Asteroid(x, y, 40, 3));
    }
}

function createExplosion(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function fireBullet() {
    if (isGameOver || !ship) return;
    if (bullets.length < 8) { // Increased bullet count for mouse play
        bullets.push(new Bullet(ship.x, ship.y, ship.angle));
    }
}

function update() {
    if (isGameOver) return;

    ship.update();

    if (keys[' ']) {
        fireBullet();
        keys[' '] = false; 
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        if (bullets[i].distTraveled > canvas.width * BULLET_MAX_DIST) {
            bullets.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.update();

        if (ship.invulnerable <= 0) {
            if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.radius + a.radius) {
                createExplosion(ship.x, ship.y, '#00ffcc', 20);
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    endGame();
                } else {
                    ship = new Ship();
                }
            }
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
                createExplosion(a.x, a.y, '#fff', 15);
                score += (4 - a.level) * 100;
                scoreEl.innerText = score;
                
                if (a.level > 1) {
                    asteroids.push(new Asteroid(a.x, a.y, a.radius / 2, a.level - 1));
                    asteroids.push(new Asteroid(a.x, a.y, a.radius / 2, a.level - 1));
                }
                
                asteroids.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }

    if (asteroids.length === 0) {
        spawnAsteroids(Math.floor(score/1000) + 5);
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => p.draw());
    bullets.forEach(b => b.draw());
    asteroids.forEach(a => a.draw());
    if (!isGameOver) ship.draw();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function endGame() {
    isGameOver = true;
    finalScoreEl.innerText = score;
    gameOverEl.style.display = 'block';
}

function restartGame() {
    score = 0;
    lives = 3;
    scoreEl.innerText = score;
    livesEl.innerText = lives;
    isGameOver = false;
    gameOverEl.style.display = 'none';
    initLevel();
}

// Input setup
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Mouse Aim & Fire
window.addEventListener('mousemove', e => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});

window.addEventListener('mousedown', e => {
    if (e.button === 0) fireBullet();
});

// Touch Aim & Fire
window.addEventListener('touchstart', e => {
    if (isGameOver) return;
    const touch = e.touches[0];
    mousePos.x = touch.clientX;
    mousePos.y = touch.clientY;
    fireBullet();
    // Use 'w' key logic for thrust if needed, or simply let them fire
});

window.onload = () => {
    initLevel();
    loop();
};
</script>
</body>
</html>

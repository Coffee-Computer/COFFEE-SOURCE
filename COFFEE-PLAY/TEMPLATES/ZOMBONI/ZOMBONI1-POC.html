<!DOCTYPE html>
<html lang="en">
<head>
    <!-- POC: standalone RAF. Stack: ZOMBONI.html — see README.md -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOMBONI - Zombie Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: #eee;
        }
        canvas {
            display: block;
            background: #111;
            cursor: crosshair;
        }
        .ui-panel {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .hud-bar {
            width: 250px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        .hud-fill {
            height: 100%;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

<div id="ui-layer" class="ui-panel top-6 left-6">
    <div class="flex flex-col gap-2">
        <div>
            <div class="text-xs uppercase font-bold text-red-500 mb-1 tracking-widest">Vital Signs</div>
            <div class="hud-bar"><div id="hp-bar" class="hud-fill bg-red-600" style="width: 100%"></div></div>
        </div>
        <div class="mt-2">
            <div class="text-3xl font-black text-white italic">SCORE: <span id="score">0</span></div>
            <div class="text-sm font-bold text-gray-400">WAVE: <span id="wave">1</span></div>
        </div>
    </div>
</div>

<div class="ui-panel bottom-6 left-6">
    <div class="text-xs uppercase font-bold text-blue-400 mb-1 tracking-widest">Ammunition</div>
    <div class="text-4xl font-black text-white" id="ammo-display">15 / ∞</div>
    <div id="reloading-msg" class="text-yellow-500 font-bold hidden animate-pulse">RELOADING...</div>
</div>

<div id="game-over">
    <h1 class="text-7xl font-black mb-2 text-red-700 italic tracking-tighter">OVERRUN</h1>
    <p class="text-xl mb-8 text-gray-400">You survived <span id="final-wave">0</span> waves.</p>
    <button onclick="location.reload()" class="bg-red-700 text-white px-10 py-4 font-black hover:bg-red-600 transition-transform active:scale-95 uppercase tracking-widest border-b-4 border-red-900">Deploy Again</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * ZOMBONI
 * Top-down Zombie Survival Shooter
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Configuration
let gameActive = true;
let score = 0;
let wave = 1;
let enemies = [];
let bullets = [];
let particles = [];
let keys = {};
let mouse = { x: 0, y: 0 };

const player = {
    x: 0,
    y: 0,
    size: 18,
    speed: 3.5,
    hp: 100,
    maxHp: 100,
    angle: 0,
    ammo: 15,
    maxAmmo: 15,
    reloading: false,
    reloadTime: 1200, // ms
    lastFire: 0,
    fireRate: 150 // ms
};

// Initialization
function init() {
    resize();
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    startWave();
    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function startWave() {
    const count = 5 + (wave * 3);
    for (let i = 0; i < count; i++) {
        spawnEnemy();
    }
    document.getElementById('wave').innerText = wave;
}

function spawnEnemy() {
    let x, y;
    // Spawn outside bounds
    if (Math.random() > 0.5) {
        x = Math.random() > 0.5 ? -50 : canvas.width + 50;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() > 0.5 ? -50 : canvas.height + 50;
    }
    
    enemies.push({
        x, y,
        speed: 1 + (Math.random() * 1) + (wave * 0.1),
        hp: 2 + Math.floor(wave / 3),
        size: 16,
        color: `hsl(${90 + Math.random() * 30}, 40%, 40%)`
    });
}

function fire() {
    if (!gameActive || player.reloading || player.ammo <= 0) return;
    
    const now = Date.now();
    if (now - player.lastFire < player.fireRate) return;

    bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(player.angle) * 12,
        vy: Math.sin(player.angle) * 12,
        life: 100
    });

    player.ammo--;
    player.lastFire = now;
    updateAmmoUI();

    if (player.ammo === 0) reload();
}

function reload() {
    if (player.reloading || player.ammo === player.maxAmmo) return;
    player.reloading = true;
    document.getElementById('reloading-msg').classList.remove('hidden');
    setTimeout(() => {
        player.ammo = player.maxAmmo;
        player.reloading = false;
        document.getElementById('reloading-msg').classList.add('hidden');
        updateAmmoUI();
    }, player.reloadTime);
}

function updateAmmoUI() {
    document.getElementById('ammo-display').innerText = `${player.ammo} / ∞`;
}

function createExplosion(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1.0,
            decay: 0.02 + Math.random() * 0.03,
            color
        });
    }
}

function update() {
    if (!gameActive) return;

    // Movement
    let mx = 0, my = 0;
    if (keys['w']) my -= player.speed;
    if (keys['s']) my += player.speed;
    if (keys['a']) mx -= player.speed;
    if (keys['d']) mx += player.speed;
    
    // Normalize diagonal movement
    if (mx !== 0 && my !== 0) {
        const factor = 0.707;
        mx *= factor;
        my *= factor;
    }

    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x + mx));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y + my));

    // Rotation
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }

        // Bullet vs Enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.size) {
                e.hp--;
                createExplosion(b.x, b.y, '#ffff00', 3);
                bullets.splice(i, 1);
                
                if (e.hp <= 0) {
                    createExplosion(e.x, e.y, e.color, 12);
                    enemies.splice(j, 1);
                    score += 50;
                    document.getElementById('score').innerText = score;
                }
                break;
            }
        }
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Enemy vs Player
        if (Math.hypot(e.x - player.x, e.y - player.y) < player.size + e.size) {
            player.hp -= 0.5;
            createExplosion(player.x, player.y, '#ff0000', 1);
            if (player.hp <= 0) endGame();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Wave Progression
    if (enemies.length === 0) {
        wave++;
        startWave();
    }

    // Shooting
    if (keys['mousedown']) fire();

    // UI Updates
    document.getElementById('hp-bar').style.width = player.hp + '%';
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Floor texture
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    const grid = 60;
    for(let x=0; x<canvas.width; x+=grid) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    for(let y=0; y<canvas.height; y+=grid) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Bullets
    ctx.fillStyle = '#ffcc00';
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
    });

    // Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
        // Eyes
        ctx.fillStyle = '#ff0000';
        const look = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.beginPath(); ctx.arc(e.x + Math.cos(look+0.4)*8, e.y + Math.sin(look+0.4)*8, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(e.x + Math.cos(look-0.4)*8, e.y + Math.sin(look-0.4)*8, 3, 0, Math.PI*2); ctx.fill();
    });

    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    
    // Weapon
    ctx.fillStyle = '#444';
    ctx.fillRect(10, -4, 18, 8);
    
    // Body
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.arc(0, 0, player.size, 0, Math.PI*2); ctx.fill();
    
    // Head/Hair
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(-2, 0, 10, 0, Math.PI*2); ctx.fill();
    
    ctx.restore();
}

function loop() {
    update();
    draw();
    if (gameActive) requestAnimationFrame(loop);
}

function endGame() {
    gameActive = false;
    document.getElementById('final-wave').innerText = wave;
    document.getElementById('game-over').style.display = 'flex';
}

// Controls
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key.toLowerCase() === 'r') reload();
});
window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => keys['mousedown'] = true);
window.addEventListener('mouseup', () => keys['mousedown'] = false);
window.addEventListener('resize', resize);

window.onload = init;

</script>
</body>
</html>

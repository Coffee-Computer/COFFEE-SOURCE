<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Shapez // Tetromino template (coffee.play)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #1a1a2e; color: #fff;
      font-family: system-ui, 'Segoe UI', sans-serif; overflow: hidden; touch-action: none;
    }
    #wrap {
      position: relative; overflow: visible; border: 4px solid #4e4e8e;
      box-shadow: 0 0 20px rgba(0,0,0,0.5); background: #16213e;
    }
    #hud-side {
      position: absolute; right: -150px; top: 0; width: 140px; text-align: left;
      pointer-events: none; z-index: 5;
    }
    @media (max-width: 600px) {
      body { flex-direction: column; padding-top: 8px; }
      #wrap { margin-top: 0; }
      #hud-side {
        position: static; width: 100%; display: flex; justify-content: space-around;
        margin-bottom: 10px; flex-wrap: wrap; gap: 8px; right: auto;
      }
    }
    .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #e94560; }
    canvas { display: block; background: #0f3460; }
    #overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.82);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; pointer-events: auto;
    }
    #overlay h1 { margin: 0 0 16px; font-size: 1.35rem; }
    #overlay button {
      padding: 10px 22px; border: none; border-radius: 6px; background: #db2777; color: #fff;
      font-weight: 800; cursor: pointer; font-family: inherit;
    }
    .ss-touch {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; justify-content: space-around; padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
      gap: 8px; pointer-events: auto;
    }
    .ss-touch button {
      width: 56px; height: 56px; border-radius: 50%; border: none;
      background: #334155; color: #fff; font-weight: 800; touch-action: manipulation;
    }
    .ss-touch button.ss-drop { background: #1e293b; }
    .ss-touch button:active { filter: brightness(1.15); }
    @media (min-width: 768px) { .ss-touch { display: none; } }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud-side">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="score">0</div>
      <div class="stat-label">Lines</div>
      <div class="stat-value" id="lines">0</div>
      <div class="stat-label">Level</div>
      <div class="stat-value" id="level">1</div>
    </div>
    <div id="overlay">
      <h1>GAME OVER</h1>
      <button type="button" id="retry">RETRY</button>
    </div>
    <canvas id="stage"></canvas>
  </div>

  <div class="ss-touch" id="ss-touch" aria-label="Touch controls">
    <button type="button" data-act="left">L</button>
    <button type="button" data-act="rot">↻</button>
    <button type="button" data-act="right">R</button>
    <button type="button" class="ss-drop" data-act="down">D</button>
  </div>

  <script src="../../../COFFEE-DOT/coffee-dot.js"></script>
  <script src="../../../COFFEE-CUP/coffee-cup.js"></script>
  <script src="../../shapes/coffee-play-shapes.js"></script>
  <script src="../../logic/coffee-play-tetromino-game.js"></script>
  <script src="../../coffee-play.js"></script>
  <script>
(function () {
  var SQ = 30;
  var COL = 10;
  var ROW = 20;

  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');
  var levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var retryBtn = document.getElementById('retry');

  var tg = coffee.playTetrominoGame.create({
    callbacks: {
      onScore: function (n) { scoreEl.textContent = String(n); },
      onLines: function (n) { linesEl.textContent = String(n); },
      onLevel: function (n) { levelEl.textContent = String(n); },
      onGameOver: function () { overlay.style.display = 'flex'; }
    },
    config: { rows: ROW, cols: COL }
  });

  var lastT = 0;
  var prevL = false;
  var prevR = false;
  var prevU = false;
  var prevD = false;
  var prevSpace = false;

  var tapLeft = false;
  var tapRight = false;
  var tapRot = false;
  var softTouch = false;

  var touchRoot = document.getElementById('ss-touch');
  touchRoot.querySelectorAll('[data-act]').forEach(function (btn) {
    var act = btn.getAttribute('data-act');
    if (act === 'down') {
      btn.addEventListener('touchstart', function (e) { e.preventDefault(); softTouch = true; }, { passive: false });
      btn.addEventListener('touchend', function () { softTouch = false; });
      btn.addEventListener('touchcancel', function () { softTouch = false; });
      btn.addEventListener('mousedown', function () { softTouch = true; });
      btn.addEventListener('mouseup', function () { softTouch = false; });
      btn.addEventListener('mouseleave', function () { softTouch = false; });
    } else {
      btn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        if (act === 'left') tapLeft = true;
        if (act === 'right') tapRight = true;
        if (act === 'rot') tapRot = true;
      }, { passive: false });
      btn.addEventListener('click', function () {
        if (act === 'left') tapLeft = true;
        if (act === 'right') tapRight = true;
        if (act === 'rot') tapRot = true;
      });
    }
  });

  retryBtn.addEventListener('click', function () {
    overlay.style.display = 'none';
    tg.reset();
  });

  function drawPieceCells(ctx, S, matrix, px, py, sq, color, ghost) {
    for (var r = 0; r < matrix.length; r++) {
      for (var c = 0; c < matrix.length; c++) {
        if (!matrix[r][c]) continue;
        var cx = px + c * sq;
        var cy = py + r * sq;
        S.drawTetrominoCell(ctx, { px: cx, py: cy, size: sq, color: color, ghost: ghost });
      }
    }
  }

  coffee.play('#stage', {
    onUpdate: function (game) {
      var cw = COL * SQ;
      var ch = ROW * SQ;
      if (game.canvas.width !== cw || game.canvas.height !== ch) {
        game.canvas.width = cw;
        game.canvas.height = ch;
        game.cup.resize(cw, ch);
      }

      var t = performance.now();
      var dt = lastT ? Math.min(t - lastT, 100) : 16;
      lastT = t;

      var k = game.keys;
      var actions = {
        moveLeft: !!(k['arrowleft'] && !prevL) || tapLeft,
        moveRight: !!(k['arrowright'] && !prevR) || tapRight,
        rotate: !!(k['arrowup'] && !prevU) || tapRot,
        stepDown: !!(k['arrowdown'] && !prevD),
        hardDrop: !!(k[' '] && !prevSpace)
      };
      tapLeft = false;
      tapRight = false;
      tapRot = false;

      prevL = !!k['arrowleft'];
      prevR = !!k['arrowright'];
      prevU = !!k['arrowup'];
      prevD = !!k['arrowdown'];
      prevSpace = !!k[' '];

      var softHeld = !!k['arrowdown'] || softTouch;

      tg.step(dt, { actions: actions, softDropHeld: softHeld });
    },
    onDraw: function (ctx, game) {
      var st = tg.getState();
      var S = coffee.playShapes;
      var sq = SQ;

      for (var r = 0; r < st.rows; r++) {
        for (var c = 0; c < st.cols; c++) {
          S.drawTetrominoCell(ctx, {
            px: c * sq,
            py: r * sq,
            size: sq,
            color: st.board[r][c],
            ghost: false
          });
        }
      }

      var p = st.piece;
      if (p && st.ghostY != null && !st.gameOver) {
        drawPieceCells(ctx, S, p.matrix, p.x * sq, st.ghostY * sq, sq, p.color, true);
      }
      if (p && !st.gameOver) {
        drawPieceCells(ctx, S, p.matrix, p.x * sq, p.y * sq, sq, p.color, false);
      }
    }
  });
})();
  </script>
</body>
</html>

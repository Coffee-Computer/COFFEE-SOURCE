<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee.Play() // Standalone Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --accent: #00ff88;
        }

        body { 
            background: #050505; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0; 
            user-select: none;
        }

        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%); 
        }

        .ui-layer { 
            position: fixed; 
            inset: 0; 
            pointer-events: none; 
            z-index: 10; 
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .terminal { font-family: 'Fira Code', monospace; }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .is-it {
            animation: pulse-glow 2s infinite;
            border: 2px solid var(--accent) !important;
        }
    </style>
</head>
<body>

    <canvas id="stage"></canvas>

    <!-- Engine HUD -->
    <div class="ui-layer">
        <!-- Top Bar -->
        <div class="flex justify-between items-start">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-white text-black flex items-center justify-center font-black rounded-xl italic text-xl">C</div>
                <div>
                    <h1 class="text-sm font-black uppercase tracking-tighter italic leading-none">Coffee.Play()</h1>
                    <p id="engine-status" class="text-[10px] text-emerald-500 terminal uppercase tracking-widest mt-1">Standalone Mode // v1.0</p>
                </div>
            </div>

            <!-- Leaderboard -->
            <div id="leaderboard" class="flex flex-col gap-2 items-end">
                <!-- Entities injected here -->
            </div>
        </div>

        <!-- Center Announcer -->
        <div class="flex flex-col items-center justify-center gap-4">
            <div id="announcer" class="text-6xl font-black italic uppercase tracking-tighter opacity-0 transform scale-90 transition-all duration-500"></div>
        </div>

        <!-- Bottom Bar -->
        <div class="flex justify-between items-end">
            <div id="stats-panel" class="glass p-5 min-w-[240px]">
                <div class="flex justify-between items-end mb-3">
                    <span class="text-[10px] uppercase font-bold text-white/40 tracking-widest">Biometric Data</span>
                    <span id="hp-value" class="text-xl font-black italic">100</span>
                </div>
                <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                    <div id="hp-bar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>

            <div class="flex flex-col items-end gap-1 opacity-30 terminal text-[10px]">
                <div>WASD / ARROWS TO MOVE</div>
                <div>SPACE TO BOOST</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * THE COFFEE ENGINE
         * A lightweight, standalone game framework
         */
        const Coffee = {
            canvas: document.getElementById('stage'),
            ctx: document.getElementById('stage').getContext('2d'),
            entities: [],
            player: null,
            keys: {},
            lastTime: 0,
            config: {},

            play: function(setup) {
                this.config = {
                    friction: 0.92,
                    gravity: 0,
                    onUpdate: setup.onUpdate || (() => {}),
                    onDraw: setup.onDraw || (() => {}),
                    ...setup
                };

                this._init();
            },

            _init: function() {
                // Resize handling
                const resize = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                // Input handling
                window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
                window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

                // Start loop
                requestAnimationFrame((t) => this._loop(t));
                console.log("Coffee Engine: Ready.");
            },

            // Entity Creation
            spawn: function(props = {}) {
                const entity = {
                    id: Math.random().toString(36).substr(2, 9),
                    x: props.x || this.canvas.width / 2,
                    y: props.y || this.canvas.height / 2,
                    vx: 0,
                    vy: 0,
                    radius: props.radius || 20,
                    speed: props.speed || 0.8,
                    maxSpeed: props.maxSpeed || 8,
                    health: 100,
                    score: 0,
                    color: props.color || '#00ff88',
                    name: props.name || 'Entity',
                    tags: props.tags || [],
                    ...props
                };
                this.entities.push(entity);
                return entity;
            },

            _loop: function(timestamp) {
                const dt = timestamp - this.lastTime;
                this.lastTime = timestamp;

                // 1. Clear
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this._drawGrid();

                // 2. Internal Physics & Movement
                this.entities.forEach(ent => {
                    // Apply Velocity
                    ent.x += ent.vx;
                    ent.y += ent.vy;

                    // Apply Friction
                    ent.vx *= this.config.friction;
                    ent.vy *= this.config.friction;

                    // Bounds Check (Bounce/Wrap)
                    if (ent.x < ent.radius) { ent.x = ent.radius; ent.vx *= -0.5; }
                    if (ent.x > this.canvas.width - ent.radius) { ent.x = this.canvas.width - ent.radius; ent.vx *= -0.5; }
                    if (ent.y < ent.radius) { ent.y = ent.radius; ent.vy *= -0.5; }
                    if (ent.y > this.canvas.height - ent.radius) { ent.y = this.canvas.height - ent.radius; ent.vy *= -0.5; }
                });

                // 3. User Logic
                this.config.onUpdate(this);

                // 4. Rendering Entities
                this.entities.forEach(ent => {
                    this.ctx.save();
                    
                    // Shadow/Glow
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = ent.color;
                    
                    // Body
                    this.ctx.fillStyle = ent.color;
                    this.ctx.beginPath();
                    this.ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Label
                    this.ctx.shadowBlur = 0;
                    this.ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    this.ctx.font = '10px Fira Code';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(ent.name.toUpperCase(), ent.x, ent.y - ent.radius - 10);
                    
                    this.ctx.restore();
                });

                // 5. User Custom Draw
                this.config.onDraw(this.ctx, this);

                // 6. UI Update
                this._updateUI();

                requestAnimationFrame((t) => this._loop(t));
            },

            _drawGrid: function() {
                this.ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                this.ctx.lineWidth = 1;
                const size = 50;
                for (let x = 0; x < this.canvas.width; x += size) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y < this.canvas.height; y += size) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
            },

            _updateUI: function() {
                // Update Player Stats
                if (this.player) {
                    document.getElementById('hp-bar').style.width = this.player.health + "%";
                    document.getElementById('hp-value').textContent = Math.ceil(this.player.health);
                    document.getElementById('hp-bar').style.backgroundColor = this.player.health < 30 ? '#ef4444' : '#10b981';
                }

                // Update Leaderboard
                const lb = document.getElementById('leaderboard');
                const sorted = [...this.entities].sort((a,b) => b.score - a.score);
                lb.innerHTML = sorted.map(ent => `
                    <div class="glass px-4 py-2 flex items-center gap-4 min-w-[160px]">
                        <div class="w-2 h-2 rounded-full" style="background: ${ent.color}"></div>
                        <div class="flex-grow text-[10px] font-bold uppercase tracking-tighter">${ent.name}</div>
                        <div class="text-[10px] font-mono opacity-50">${ent.score}</div>
                    </div>
                `).join('');
            },

            announce: function(msg) {
                const el = document.getElementById('announcer');
                el.textContent = msg;
                el.style.opacity = "1";
                el.style.transform = "scale(1)";
                setTimeout(() => {
                    el.style.opacity = "0";
                    el.style.transform = "scale(0.9)";
                }, 2000);
            },

            // Utils
            getDistance: function(e1, e2) {
                return Math.sqrt(Math.pow(e2.x - e1.x, 2) + Math.pow(e2.y - e1.y, 2));
            },

            checkCollision: function(e1, e2) {
                return this.getDistance(e1, e2) < (e1.radius + e2.radius);
            }
        };

        /**
         * GAME IMPLEMENTATION
         */
        Coffee.play({
            onUpdate: (game) => {
                // 1. Ensure Player Exists
                if (!game.player) {
                    game.player = game.spawn({ 
                        name: 'Player 01', 
                        color: '#00ff88',
                        speed: 1.2,
                        maxSpeed: 12
                    });

                    // Spawn some "Enemy" bots
                    for(let i=0; i<5; i++) {
                        game.spawn({
                            name: 'Bot ' + (i+1),
                            color: '#ff3366',
                            x: Math.random() * game.canvas.width,
                            y: Math.random() * game.canvas.height,
                            tags: ['enemy'],
                            radius: 15 + Math.random() * 10
                        });
                    }
                }

                // 2. Handle Input
                const p = game.player;
                if (game.keys['w'] || game.keys['arrowup']) p.vy -= p.speed;
                if (game.keys['s'] || game.keys['arrowdown']) p.vy += p.speed;
                if (game.keys['a'] || game.keys['arrowleft']) p.vx -= p.speed;
                if (game.keys['d'] || game.keys['arrowright']) p.vx += p.speed;

                // Boost
                if (game.keys[' ']) {
                    p.vx *= 1.05;
                    p.vy *= 1.05;
                }

                // Speed Clamp
                const currentSpeed = Math.sqrt(p.vx**2 + p.vy**2);
                if (currentSpeed > p.maxSpeed) {
                    const ratio = p.maxSpeed / currentSpeed;
                    p.vx *= ratio;
                    p.vy *= ratio;
                }

                // 3. Bot Logic & Collisions
                game.entities.forEach(ent => {
                    if (ent.tags.includes('enemy')) {
                        // Simple AI: Move towards player slowly
                        const dx = p.x - ent.x;
                        const dy = p.y - ent.y;
                        const dist = game.getDistance(p, ent);
                        
                        ent.vx += (dx / dist) * 0.2;
                        ent.vy += (dy / dist) * 0.2;

                        // Check collision with player
                        if (game.checkCollision(p, ent)) {
                            p.health -= 0.5;
                            // Push back
                            ent.vx *= -2;
                            ent.vy *= -2;
                            p.vx *= -0.5;
                            p.vy *= -0.5;

                            if (p.health <= 0) {
                                game.announce("SYSTEM CRITICAL: REBOOTING");
                                p.health = 100;
                                p.x = game.canvas.width / 2;
                                p.y = game.canvas.height / 2;
                                p.score = 0;
                            }
                        }
                    }
                });

                // Scoring: Get points for staying alive / moving
                if (currentSpeed > 2) p.score += 1;
            },

            onDraw: (ctx, game) => {
                // Custom FX: Draw lines between player and nearby bots
                const p = game.player;
                if (!p) return;

                game.entities.forEach(ent => {
                    if (ent !== p) {
                        const dist = game.getDistance(p, ent);
                        if (dist < 200) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(255, 255, 255, ${1 - dist/200})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(ent.x, ent.y);
                            ctx.stroke();
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>

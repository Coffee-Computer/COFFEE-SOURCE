<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Brick - 2D Physics Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --coffee-cream: #fdfaf6;
            --coffee-deep: #1b130c;
            --brick-orange: #e76f51;
        }
        body {
            background-color: var(--coffee-cream);
            color: var(--coffee-deep);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            background: white;
            display: block;
            touch-action: none;
            cursor: crosshair;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #e7d8c9;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Controls -->
    <aside class="w-72 control-panel p-6 shadow-xl z-10 flex flex-col gap-6 overflow-y-auto">
        <div>
            <h1 class="text-3xl font-black text-stone-800">🧱 brick<span class="text-orange-600">.js</span></h1>
            <p class="text-xs text-stone-500 font-medium">Coffee Physics Framework v1.0</p>
        </div>

        <div class="space-y-4">
            <label class="block">
                <span class="text-sm font-bold text-stone-600">Gravity</span>
                <input type="range" id="gravityRange" min="0" max="2" step="0.1" value="0.5" class="w-full accent-orange-600">
            </label>
            <label class="block">
                <span class="text-sm font-bold text-stone-600">Bounciness</span>
                <input type="range" id="bounceRange" min="0" max="1" step="0.1" value="0.7" class="w-full accent-orange-600">
            </label>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="engine.setMode('box')" class="bg-stone-800 text-white py-2 rounded-lg font-bold hover:bg-orange-600 transition">Add Box</button>
            <button onclick="engine.setMode('circle')" class="bg-stone-800 text-white py-2 rounded-lg font-bold hover:bg-orange-600 transition">Add Circle</button>
        </div>

        <button onclick="engine.clear()" class="border-2 border-stone-200 py-2 rounded-lg font-bold hover:bg-red-50 transition text-red-600">Clear Canvas</button>

        <div class="mt-auto p-4 bg-orange-50 rounded-xl border border-orange-100">
            <p class="text-xs leading-relaxed text-orange-800">
                <strong>How to use:</strong><br>
                Click or tap anywhere on the white canvas to spawn physics-enabled bricks!
            </p>
        </div>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 p-4 relative bg-stone-100">
        <canvas id="physicsCanvas"></canvas>
    </main>

    <script>
        /**
         * coffee.brick() - Lightweight 2D Physics Engine
         */
        const engine = (() => {
            const canvas = document.getElementById('physicsCanvas');
            const ctx = canvas.getContext('2d');
            const bodies = [];
            let mode = 'box';

            const settings = {
                gravity: 0.5,
                friction: 0.98,
                restitution: 0.7 // Bounciness
            };

            // Resize handling
            const resize = () => {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            };

            window.addEventListener('resize', resize);
            resize();

            class Body {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 10;
                    this.vy = (Math.random() - 0.5) * 10;
                    this.type = type;
                    this.radius = 20 + Math.random() * 20;
                    this.width = 40 + Math.random() * 40;
                    this.height = 40 + Math.random() * 40;
                    this.color = `hsl(${Math.random() * 360}, 60%, 60%)`;
                }

                update() {
                    // Apply Gravity
                    this.vy += settings.gravity;
                    
                    // Update Position
                    this.x += this.vx;
                    this.y += this.vy;

                    // Floor Collision
                    if (this.type === 'circle') {
                        if (this.y + this.radius > canvas.height) {
                            this.y = canvas.height - this.radius;
                            this.vy *= -settings.restitution;
                            this.vx *= settings.friction;
                        }
                        if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                            this.vx *= -settings.restitution;
                            this.x = this.x < 0 ? this.radius : canvas.width - this.radius;
                        }
                    } else {
                        if (this.y + this.height > canvas.height) {
                            this.y = canvas.height - this.height;
                            this.vy *= -settings.restitution;
                            this.vx *= settings.friction;
                        }
                        if (this.x + this.width > canvas.width || this.x < 0) {
                            this.vx *= -settings.restitution;
                            this.x = this.x < 0 ? 0 : canvas.width - this.width;
                        }
                    }
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    if (this.type === 'circle') {
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    } else {
                        ctx.rect(this.x, this.y, this.width, this.height);
                    }
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.stroke();
                }
            }

            const loop = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Update settings from UI
                settings.gravity = parseFloat(document.getElementById('gravityRange').value);
                settings.restitution = parseFloat(document.getElementById('bounceRange').value);

                bodies.forEach(body => {
                    body.update();
                    body.draw();
                });

                requestAnimationFrame(loop);
            };

            // Interaction
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                bodies.push(new Body(x, y, mode));
            });

            // Start loop
            window.onload = loop;

            return {
                setMode: (m) => mode = m,
                clear: () => bodies.length = 0
            };
        })();
    </script>
</body>
</html>

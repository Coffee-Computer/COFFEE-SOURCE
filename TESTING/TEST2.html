<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Source Calendar</title>

    <!-- 1. LOAD THE IMPORT MAP HELPER FROM YOUR REPO -->
    <!-- This maps "@coffee/" to your repo root -->
    <script 
        src="https://raw.githack.com/Coffee-Computer/COFFEE-SOURCE/main/COFFEE-CDN/import-map.js"
        data-coffee-cdn="https://raw.githack.com/Coffee-Computer/COFFEE-SOURCE/main/">
    </script>

    <style>
        :root {
            --coffee-dark: #3e2723;
            --coffee-medium: #795548;
            --coffee-light: #d7ccc8;
            --white: #ffffff;
            --accent: #ffab40;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--coffee-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #app {
            background: var(--white);
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            color: var(--coffee-dark);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: var(--coffee-medium);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-label {
            font-weight: bold;
            font-size: 0.75rem;
            color: var(--coffee-medium);
            text-align: center;
            padding-bottom: 10px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .day:hover:not(.empty) {
            background-color: var(--coffee-light);
        }

        .day.today {
            background-color: var(--accent);
            color: var(--coffee-dark);
            font-weight: bold;
        }

        .empty {
            cursor: default;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script type="module">
        // 2. IMPORT FROM THE @coffee/ ALIAS DEFINED BY THE MAP
        import { Coffee, html } from '@coffee/COFFEE-BASE/coffee-base.js';

        const Calendar = () => {
            // Setup Reactive State
            const state = Coffee.state({
                current: new Date(),
                today: new Date()
            });

            // Action: Change Month
            const move = (step) => {
                const next = new Date(state.current);
                next.setMonth(state.current.getMonth() + step);
                state.current = next;
            };

            // Main Component Logic
            return () => {
                const year = state.current.getFullYear();
                const month = state.current.getMonth();
                const monthName = state.current.toLocaleString('default', { month: 'long' });

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayIdx = new Date(year, month, 1).getDay();

                const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
                const gridItems = [];

                // Empty cells for the start of the month
                for (let i = 0; i < firstDayIdx; i++) {
                    gridItems.push(html`<div class="day empty"></div>`);
                }

                // Month days
                for (let d = 1; d <= daysInMonth; d++) {
                    const isToday = d === state.today.getDate() && 
                                    month === state.today.getMonth() && 
                                    year === state.today.getFullYear();

                    gridItems.push(html`
                        <div class="day ${isToday ? 'today' : ''}" onclick=${() => alert('Selected: ' + d)}>
                            ${d}
                        </div>
                    `);
                }

                return html`
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <button class="nav-btn" onclick=${() => move(-1)}>‹</button>
                            <h2>${monthName} ${year}</h2>
                            <button class="nav-btn" onclick=${() => move(1)}>›</button>
                        </div>

                        <div class="grid">
                            ${weekdays.map(w => html`<div class="day-label">${w}</div>`)}
                            ${gridItems}
                        </div>
                    </div>
                `;
            };
        };

        // 3. MOUNT
        Coffee.mount(document.getElementById('app'), Calendar);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coffee.Profile() // Community Edition</title>
  <link rel="stylesheet" href="./community-profile.css" />
</head>
<body class="cp-body">
  <p id="cp-load-error" class="cp-load-error" hidden></p>

  <div class="cp-shell">
    <div class="cp-grid">
      <aside class="cp-sidebar cp-stack">
        <div class="cp-glass cp-id-card">
          <div class="cp-id-header">
            <div class="cp-id-top">
              <span class="cp-mono cp-badge-ce" id="cp-badge-label">Community Edition</span>
              <div class="cp-online">
                <span class="cp-dot" id="cp-status-dot" aria-hidden="true"></span>
                <span class="cp-mono" id="cp-status-label">ONLINE</span>
              </div>
            </div>

            <div class="cp-avatar-wrap">
              <div class="cp-avatar-frame cp-scanline">
                <img id="cp-avatar" src="" alt="Avatar" class="cp-avatar" width="128" height="128" />
              </div>
              <button type="button" class="cp-avatar-btn" onclick="cpRandomizeAvatar()" aria-label="Randomize avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              </button>
            </div>

            <h1 class="cp-name" id="cp-name"></h1>
            <p class="cp-mono cp-handle" id="cp-handle"></p>
          </div>

          <div class="cp-id-meta" id="cp-meta-rows"></div>

          <div class="cp-id-footer" id="cp-qr-wrap">
            <img class="cp-qr" id="cp-qr" src="" alt="" />
          </div>
        </div>

        <div class="cp-glass cp-achievements" id="cp-achievements-block">
          <h3 class="cp-mono cp-section-label" id="cp-achievements-title">Achievements</h3>
          <div class="cp-badge-grid" id="cp-badge-grid"></div>
        </div>
      </aside>

      <main class="cp-main cp-stack">
        <div class="cp-two-col">
          <div class="cp-glass cp-card-pad">
            <h3 class="cp-card-title">
              <svg class="cp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span id="cp-about-title-text">About Me</span>
            </h3>
            <p class="cp-prose" id="cp-about-body"></p>
          </div>
          <div class="cp-glass cp-card-pad">
            <h3 class="cp-card-title">
              <svg class="cp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
              <span id="cp-goals-title-text">Goals</span>
            </h3>
            <ul class="cp-goals" id="cp-goals-list"></ul>
          </div>
        </div>

        <div class="cp-glass cp-card-pad">
          <div class="cp-snippet-head">
            <h3 class="cp-card-title cp-snippet-title-row">
              <svg class="cp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              <span id="cp-snippet-title-text">Snippet Bin</span>
            </h3>
            <span class="cp-mono cp-snippet-filename" id="cp-snippet-filename"></span>
          </div>
          <pre class="cp-code-block cp-mono" id="cp-snippet-code"></pre>
        </div>

        <div class="cp-glass cp-card-pad">
          <h3 class="cp-card-title">
            <svg class="cp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="cp-pings-title-text">Recent Pings</span>
          </h3>
          <div id="cp-pings-list"></div>
          <button type="button" class="cp-btn-ghost" id="cp-activity-btn" hidden>View All Activity…</button>
        </div>
      </main>
    </div>
  </div>

  <script src="./community-profile.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector - Simple SVG Illustrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --app-bg: #f3f4f6;
            --panel-bg: #ffffff;
            --accent: #3b82f6;
            --border: #e5e7eb;
        }

        body {
            background-color: var(--app-bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 60px 1fr 280px;
            height: calc(100vh - 48px);
        }

        .toolbar-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
            color: #4b5563;
        }

        .toolbar-btn:hover {
            background: #f3f4f6;
        }

        .toolbar-btn.active {
            background: var(--accent);
            color: white;
        }

        #canvas-container {
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e7eb;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #svg-canvas {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            cursor: crosshair;
            user-select: none;
        }

        .property-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            margin-top: 4px;
        }

        .label-text {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
        }

        .selected-element {
            outline: 2px blue dashed;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="h-12 border-b border-gray-200 bg-white flex items-center justify-between px-4 z-20">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center text-white font-bold italic">V</div>
            <h1 class="font-bold text-gray-800">Vector</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="clearCanvas()" class="text-xs font-semibold px-3 py-1 text-red-500 hover:bg-red-50 rounded">Clear</button>
            <button onclick="exportSVG()" class="text-xs font-semibold px-4 py-1.5 bg-blue-600 text-white rounded-md shadow-sm hover:bg-blue-700 transition">Export SVG</button>
        </div>
    </header>

    <div class="app-grid">
        <!-- Left Toolbar -->
        <aside class="bg-white border-r border-gray-200 flex flex-col items-center py-4">
            <button class="toolbar-btn active" data-tool="select" title="Select (V)">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"></path></svg>
            </button>
            <button class="toolbar-btn" data-tool="rect" title="Rectangle (R)">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-width="2"></rect></svg>
            </button>
            <button class="toolbar-btn" data-tool="circle" title="Circle (C)">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="2"></circle></svg>
            </button>
            <button class="toolbar-btn" data-tool="text" title="Text (T)">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7V4h16v3M9 20h6M12 4v16"></path></svg>
            </button>
        </aside>

        <!-- Main Workspace -->
        <main id="canvas-container">
            <svg id="svg-canvas" width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <!-- Elements will be injected here -->
            </svg>
        </main>

        <!-- Right Property Panel -->
        <aside class="bg-white border-l border-gray-200 p-5 overflow-y-auto">
            <div id="no-selection" class="text-center py-10">
                <p class="text-sm text-gray-400">Select an object to edit properties</p>
            </div>

            <div id="prop-panel" class="hidden">
                <h3 class="font-bold text-gray-800 mb-6 flex items-center justify-between">
                    Appearance
                    <button id="delete-btn" class="text-red-400 hover:text-red-600">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </h3>

                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="label-text">Fill Color</label>
                            <input type="color" id="prop-fill" class="property-input h-10 p-1 cursor-pointer">
                        </div>
                        <div>
                            <label class="label-text">Stroke Color</label>
                            <input type="color" id="prop-stroke" class="property-input h-10 p-1 cursor-pointer">
                        </div>
                    </div>

                    <div>
                        <label class="label-text">Stroke Width</label>
                        <input type="range" id="prop-stroke-width" min="0" max="20" class="w-full mt-2">
                    </div>

                    <div>
                        <label class="label-text">Opacity</label>
                        <input type="range" id="prop-opacity" min="0" max="1" step="0.1" value="1" class="w-full mt-2">
                    </div>

                    <div id="text-specific" class="hidden">
                        <label class="label-text">Text Content</label>
                        <input type="text" id="prop-text-content" class="property-input" placeholder="Type here...">
                    </div>

                    <div class="pt-4 border-t border-gray-100">
                        <label class="label-text">Position</label>
                        <div class="grid grid-cols-2 gap-3 mt-2">
                            <div>
                                <span class="text-[10px] text-gray-400">X</span>
                                <input type="number" id="prop-x" class="property-input">
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-400">Y</span>
                                <input type="number" id="prop-y" class="property-input">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const svg = document.getElementById('svg-canvas');
        const toolBtns = document.querySelectorAll('.toolbar-btn');
        const propPanel = document.getElementById('prop-panel');
        const noSelection = document.getElementById('no-selection');
        const textSpecific = document.getElementById('text-specific');
        
        let currentTool = 'select';
        let selectedElement = null;
        let isDrawing = false;
        let startPoint = { x: 0, y: 0 };
        let tempElement = null;

        // Tool Selection
        toolBtns.forEach(btn => {
            btn.onclick = () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                deselectAll();
            };
        });

        // SVG Drawing Logic
        svg.onmousedown = (e) => {
            const pt = getSVGPoint(e);
            startPoint = pt;

            if (currentTool === 'select') {
                const target = e.target.closest('rect, circle, text');
                if (target && target !== svg) {
                    selectElement(target);
                } else {
                    deselectAll();
                }
                return;
            }

            isDrawing = true;
            if (currentTool === 'rect') {
                tempElement = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                tempElement.setAttribute("x", pt.x);
                tempElement.setAttribute("y", pt.y);
                tempElement.setAttribute("width", 0);
                tempElement.setAttribute("height", 0);
                tempElement.setAttribute("fill", "#3b82f6");
                tempElement.setAttribute("stroke", "#000000");
                tempElement.setAttribute("stroke-width", "2");
            } else if (currentTool === 'circle') {
                tempElement = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                tempElement.setAttribute("cx", pt.x);
                tempElement.setAttribute("cy", pt.y);
                tempElement.setAttribute("r", 0);
                tempElement.setAttribute("fill", "#10b981");
                tempElement.setAttribute("stroke", "#000000");
                tempElement.setAttribute("stroke-width", "2");
            } else if (currentTool === 'text') {
                tempElement = document.createElementNS("http://www.w3.org/2000/svg", "text");
                tempElement.setAttribute("x", pt.x);
                tempElement.setAttribute("y", pt.y);
                tempElement.textContent = "New Text";
                tempElement.setAttribute("font-family", "sans-serif");
                tempElement.setAttribute("font-size", "24");
                tempElement.setAttribute("fill", "#000000");
                isDrawing = false; // Text is placed on click
                svg.appendChild(tempElement);
                selectElement(tempElement);
                return;
            }

            if (tempElement) svg.appendChild(tempElement);
        };

        svg.onmousemove = (e) => {
            if (!isDrawing || !tempElement) return;
            const pt = getSVGPoint(e);

            if (currentTool === 'rect') {
                const x = Math.min(pt.x, startPoint.x);
                const y = Math.min(pt.y, startPoint.y);
                const w = Math.abs(pt.x - startPoint.x);
                const h = Math.abs(pt.y - startPoint.y);
                tempElement.setAttribute("x", x);
                tempElement.setAttribute("y", y);
                tempElement.setAttribute("width", w);
                tempElement.setAttribute("height", h);
            } else if (currentTool === 'circle') {
                const r = Math.sqrt(Math.pow(pt.x - startPoint.x, 2) + Math.pow(pt.y - startPoint.y, 2));
                tempElement.setAttribute("r", r);
            }
        };

        svg.onmouseup = () => {
            if (isDrawing && tempElement) {
                selectElement(tempElement);
            }
            isDrawing = false;
            tempElement = null;
        };

        function getSVGPoint(e) {
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        // Selection & Property Management
        function selectElement(el) {
            deselectAll();
            selectedElement = el;
            selectedElement.classList.add('selected-element');
            
            noSelection.classList.add('hidden');
            propPanel.classList.remove('hidden');

            // Sync Properties
            document.getElementById('prop-fill').value = rgbToHex(el.getAttribute('fill') || '#000000');
            document.getElementById('prop-stroke').value = rgbToHex(el.getAttribute('stroke') || '#000000');
            document.getElementById('prop-stroke-width').value = el.getAttribute('stroke-width') || 2;
            document.getElementById('prop-opacity').value = el.getAttribute('opacity') || 1;
            
            const tagName = el.tagName.toLowerCase();
            textSpecific.classList.toggle('hidden', tagName !== 'text');
            
            if (tagName === 'text') {
                document.getElementById('prop-text-content').value = el.textContent;
                document.getElementById('prop-x').value = el.getAttribute('x');
                document.getElementById('prop-y').value = el.getAttribute('y');
            } else if (tagName === 'rect') {
                document.getElementById('prop-x').value = el.getAttribute('x');
                document.getElementById('prop-y').value = el.getAttribute('y');
            } else if (tagName === 'circle') {
                document.getElementById('prop-x').value = el.getAttribute('cx');
                document.getElementById('prop-y').value = el.getAttribute('cy');
            }
        }

        function deselectAll() {
            if (selectedElement) {
                selectedElement.classList.remove('selected-element');
            }
            selectedElement = null;
            noSelection.classList.remove('hidden');
            propPanel.classList.add('hidden');
        }

        // Live Property Updates
        const updateAttr = (id, attr, isStyle = false) => {
            document.getElementById(id).oninput = (e) => {
                if (!selectedElement) return;
                const val = e.target.value;
                if (attr === 'textContent') {
                    selectedElement.textContent = val;
                } else if (attr === 'x' || attr === 'y') {
                    const tag = selectedElement.tagName.toLowerCase();
                    if (tag === 'circle') {
                        selectedElement.setAttribute(attr === 'x' ? 'cx' : 'cy', val);
                    } else {
                        selectedElement.setAttribute(attr, val);
                    }
                } else {
                    selectedElement.setAttribute(attr, val);
                }
            };
        };

        updateAttr('prop-fill', 'fill');
        updateAttr('prop-stroke', 'stroke');
        updateAttr('prop-stroke-width', 'stroke-width');
        updateAttr('prop-opacity', 'opacity');
        updateAttr('prop-text-content', 'textContent');
        updateAttr('prop-x', 'x');
        updateAttr('prop-y', 'y');

        document.getElementById('delete-btn').onclick = () => {
            if (selectedElement) {
                selectedElement.remove();
                deselectAll();
            }
        };

        function clearCanvas() {
            while (svg.lastChild) {
                svg.removeChild(svg.lastChild);
            }
            deselectAll();
        }

        function exportSVG() {
            const svgData = svg.outerHTML;
            const svgBlob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
            const svgUrl = URL.createObjectURL(svgBlob);
            const downloadLink = document.createElement("a");
            downloadLink.href = svgUrl;
            downloadLink.download = "vector-artwork.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function rgbToHex(color) {
            if (color.startsWith('#')) return color;
            const rgb = color.match(/\d+/g);
            if (!rgb) return '#000000';
            return "#" + ((1 << 24) + (+rgb[0] << 16) + (+rgb[1] << 8) + +rgb[2]).toString(16).slice(1);
        }

        // Keyboard Shortcuts
        window.onkeydown = (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'v') document.querySelector('[data-tool="select"]').click();
            if (e.key === 'r') document.querySelector('[data-tool="rect"]').click();
            if (e.key === 'c') document.querySelector('[data-tool="circle"]').click();
            if (e.key === 't') document.querySelector('[data-tool="text"]').click();
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedElement) {
                    selectedElement.remove();
                    deselectAll();
                }
            }
        };
    </script>
</body>
</html>

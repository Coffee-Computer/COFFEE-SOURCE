<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Zero MPC - Flagship Drum Sequencer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: #1a1a1e;
            --pad-idle: #2a2a30;
            --pad-active: #4ade80;
            --accent: #22c55e;
            --step-off: #333338;
        }

        body {
            background-color: var(--bg-dark);
            color: #e4e4e7;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .mpc-container {
            max-width: 900px;
            margin: 2rem auto;
            background: var(--panel-bg);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
        }

        /* --- PAD GRID --- */
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .mpc-pad {
            aspect-ratio: 1/1;
            background: var(--pad-idle);
            border-radius: 0.5rem;
            border-bottom: 4px solid #111;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.05s;
            position: relative;
        }

        .mpc-pad:active, .mpc-pad.active {
            background: var(--pad-active);
            border-bottom-width: 0;
            transform: translateY(4px);
            color: #000;
        }

        .mpc-pad.selected {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        /* --- STEP SEQUENCER --- */
        .step-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .step {
            height: 40px;
            background: var(--step-off);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .step.on {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .step.playing {
            border: 2px solid white;
        }

        /* --- SCREEN --- */
        .mpc-screen {
            background: #050505;
            border: 4px solid #333;
            border-radius: 0.5rem;
            height: 120px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent);
            text-shadow: 0 0 5px var(--accent);
            display: flex;
            justify-content: space-between;
        }

        .vu-meter {
            width: 15px;
            height: 100%;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .vu-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: var(--accent);
            transition: height 0.1s;
        }
    </style>
</head>
<body class="flex flex-col">

    <div class="mpc-container">
        <!-- Header -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter text-green-500">SUB-ZERO</h1>
                <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">Flagship Production Center</p>
            </div>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p class="text-[10px] text-zinc-500 font-bold uppercase">Tempo</p>
                    <input type="number" id="bpm-input" value="120" class="bg-transparent text-xl font-mono font-bold w-16 outline-none text-green-400">
                </div>
                <button id="play-btn" class="bg-green-600 hover:bg-green-500 p-4 rounded-full text-black transition">
                    <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <!-- LCD Screen -->
        <div class="mpc-screen mb-8">
            <div class="flex flex-col justify-between">
                <div>
                    <div id="screen-track-name" class="text-sm">TRACK 01: KICK</div>
                    <div id="screen-mode" class="text-[10px] mt-1">MODE: STEP EDIT</div>
                </div>
                <div class="text-2xl" id="screen-timer">001.01.00</div>
            </div>
            <div class="flex gap-1">
                <div class="vu-meter"><div id="vu-l" class="vu-fill"></div></div>
                <div class="vu-meter"><div id="vu-r" class="vu-fill"></div></div>
            </div>
        </div>

        <!-- Pads and Main Engine -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="pad-grid">
                <!-- 16 Pads generated by JS -->
            </div>
            
            <div class="flex flex-col justify-between">
                <div class="space-y-4">
                    <div class="bg-zinc-900 p-4 rounded border border-zinc-800">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase block mb-2">Pad Tuning</label>
                        <input type="range" class="w-full accent-green-500" min="0.5" max="2" step="0.01" value="1">
                    </div>
                    <div class="bg-zinc-900 p-4 rounded border border-zinc-800">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase block mb-2">Decay</label>
                        <input type="range" class="w-full accent-green-500" min="0.1" max="1" step="0.01" value="0.5">
                    </div>
                </div>
                <div class="mt-8 text-[10px] text-zinc-600 font-mono">
                    [SNOW SHOES HARDWARE DIV.]<br>
                    MODEL: SZ-MPC-1600<br>
                    FIRMWARE: V2.5-FLASH
                </div>
            </div>
        </div>

        <!-- Step Sequencer -->
        <div class="step-grid" id="step-container">
            <!-- 16 Steps generated by JS -->
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain();
        const analyzer = audioCtx.createAnalyser();
        masterGain.connect(analyzer);
        analyzer.connect(audioCtx.destination);
        analyzer.fftSize = 32;

        const DRUM_NAMES = [
            "KICK", "SNARE", "CLAP", "H-HAT",
            "O-HAT", "TOM LO", "TOM HI", "RIM",
            "COWBELL", "SHAKER", "CRASH", "PERC 1",
            "PERC 2", "SUB 1", "SUB 2", "GLITCH"
        ];

        let selectedTrack = 0;
        let isPlaying = false;
        let bpm = 120;
        let currentStep = 0;
        let nextNoteTime = 0;
        
        // Sequencer data: 16 tracks, 16 steps each
        const patterns = Array.from({ length: 16 }, () => Array(16).fill(false));

        // --- Audio Logic ---
        function playDrum(index, time = audioCtx.currentTime) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const noise = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            
            gain.connect(masterGain);
            
            // Simple synthesized drum sounds
            if (index === 0) { // Kick
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
                gain.gain.setValueAtTime(1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 0.3);
            } else if (index === 1 || index === 2) { // Snare/Clap
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;
                
                noise.connect(filter).connect(gain);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
                noise.start(time);
                noise.stop(time + 0.15);
            } else { // Hats/Perc
                osc.type = 'square';
                osc.frequency.setValueAtTime(index * 400, time);
                gain.gain.setValueAtTime(0.2, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 0.05);
            }

            // Visual feedback on pad
            const pad = document.querySelectorAll('.mpc-pad')[index];
            pad.classList.add('active');
            setTimeout(() => pad.classList.remove('active'), 100);
        }

        // --- UI Initialization ---
        const padGrid = document.querySelector('.pad-grid');
        const stepContainer = document.querySelector('#step-container');

        // Create Pads
        for (let i = 0; i < 16; i++) {
            const pad = document.createElement('div');
            pad.className = `mpc-pad ${i === 0 ? 'selected' : ''}`;
            pad.innerHTML = `<span class="text-[8px] absolute top-2 left-2 text-zinc-500">A${(i+1).toString().padStart(2, '0')}</span>
                             <span class="text-[10px] font-bold">${DRUM_NAMES[i]}</span>`;
            
            pad.onmousedown = () => {
                selectedTrack = i;
                updateSelection();
                playDrum(i);
            };
            padGrid.appendChild(pad);
        }

        // Create Steps
        for (let i = 0; i < 16; i++) {
            const step = document.createElement('div');
            step.className = 'step';
            step.onclick = () => {
                patterns[selectedTrack][i] = !patterns[selectedTrack][i];
                step.classList.toggle('on', patterns[selectedTrack][i]);
            };
            stepContainer.appendChild(step);
        }

        function updateSelection() {
            document.querySelectorAll('.mpc-pad').forEach((p, idx) => {
                p.classList.toggle('selected', idx === selectedTrack);
            });
            document.getElementById('screen-track-name').innerText = `TRACK ${(selectedTrack+1).toString().padStart(2, '0')}: ${DRUM_NAMES[selectedTrack]}`;
            
            // Sync step buttons to the newly selected track's pattern
            document.querySelectorAll('.step').forEach((s, idx) => {
                s.classList.toggle('on', patterns[selectedTrack][idx]);
            });
        }

        // --- Sequencer Logic ---
        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                scheduleNote(currentStep, nextNoteTime);
                advanceNote();
            }
        }

        function advanceNote() {
            const secondsPerBeat = 60.0 / bpm;
            nextNoteTime += 0.25 * secondsPerBeat; // 16th notes
            currentStep = (currentStep + 1) % 16;
        }

        function scheduleNote(step, time) {
            // Visual playhead
            setTimeout(() => {
                const steps = document.querySelectorAll('.step');
                steps.forEach(s => s.classList.remove('playing'));
                steps[step].classList.add('playing');
                
                // Update screen timer
                const bar = Math.floor(step / 4) + 1;
                const beat = (step % 4) + 1;
                document.getElementById('screen-timer').innerText = `001.0${bar}.0${beat}`;
            }, (time - audioCtx.currentTime) * 1000);

            // Play all active notes for this step across all tracks
            for (let i = 0; i < 16; i++) {
                if (patterns[i][step]) {
                    playDrum(i, time);
                }
            }
        }

        let timerID;
        document.getElementById('play-btn').onclick = () => {
            isPlaying = !isPlaying;
            document.getElementById('play-icon').classList.toggle('hidden', isPlaying);
            document.getElementById('pause-icon').classList.toggle('hidden', !isPlaying);
            
            if (isPlaying) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                currentStep = 0;
                nextNoteTime = audioCtx.currentTime;
                timerID = setInterval(scheduler, 25);
            } else {
                clearInterval(timerID);
            }
        };

        document.getElementById('bpm-input').onchange = (e) => {
            bpm = Math.max(20, Math.min(300, e.target.value));
        };

        // --- Metering ---
        const vuL = document.getElementById('vu-l');
        const vuR = document.getElementById('vu-r');
        function updateMeters() {
            const data = new Uint8Array(analyzer.frequencyBinCount);
            analyzer.getByteFrequencyData(data);
            let sum = 0;
            for(let i=0; i<data.length; i++) sum += data[i];
            const volume = (sum / data.length) * 2;
            vuL.style.height = `${Math.min(100, volume)}%`;
            vuR.style.height = `${Math.min(100, volume * 0.9 + Math.random() * 5)}%`;
            requestAnimationFrame(updateMeters);
        }
        updateMeters();
    </script>
</body>
</html>

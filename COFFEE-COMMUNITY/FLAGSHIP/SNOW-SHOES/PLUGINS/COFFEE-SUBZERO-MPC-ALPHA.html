<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-Zero MPC α — Coffee</title>
  <script src="../../../../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../../../../COFFEE-UI/coffee-ui.js"></script>
  <script src="../../../../COFFEE-SYNTH/coffee-synth.js"></script>
  <script src="../../../../COFFEE-FUZZ/coffee-fuzz.js"></script>
  <script src="../../../../COFFEE-TRANSPORT/coffee-transport.js"></script>
  <script src="../../../../COFFEE-PATTERN/coffee-pattern.js"></script>
  <script src="../snow-shoes.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap');
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, sans-serif; user-select: none; }
    body { background: var(--coffee-bg-surface); color: var(--coffee-text-primary); padding: var(--coffee-space-md); }
    .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--coffee-space-sm); max-width: 520px; }
    .mpc-pad {
      aspect-ratio: 1/1;
      background: var(--coffee-bg-elev);
      border-radius: var(--coffee-radius-sm);
      border: 1px solid var(--coffee-panel);
      border-bottom-width: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      position: relative;
      color: var(--coffee-text-muted);
    }
    .mpc-pad:active, .mpc-pad.active { background: var(--coffee-accent); color: #0f172a; border-bottom-width: 1px; transform: translateY(3px); }
    .mpc-pad.selected { outline: 2px solid var(--coffee-accent); outline-offset: 3px; }
    .step-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; margin-top: var(--coffee-space-md); max-width: 900px; }
    .step { height: 36px; background: var(--coffee-bg-elev); border-radius: 4px; cursor: pointer; border: 1px solid var(--coffee-panel); }
    .step.on { background: var(--coffee-accent); box-shadow: 0 0 8px rgba(74, 222, 128, 0.35); }
    .step.playing { border: 2px solid #fff; }
    .mpc-screen {
      background: #050505;
      border: 2px solid var(--coffee-panel);
      border-radius: var(--coffee-radius-md);
      padding: var(--coffee-space-md);
      font-family: ui-monospace, monospace;
      color: var(--coffee-accent);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      min-height: 100px;
      margin-bottom: var(--coffee-space-md);
      max-width: 900px;
    }
    .vu-meter { width: 12px; background: #111; position: relative; overflow: hidden; border-radius: 2px; }
    .vu-fill { position: absolute; bottom: 0; width: 100%; height: 0%; background: var(--coffee-accent); transition: height 0.08s; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../snow-shoes-embed.js"></script>
  <script>
(function () {
  const DRUM_NAMES = [
    'KICK', 'SNARE', 'CLAP', 'H-HAT',
    'O-HAT', 'TOM LO', 'TOM HI', 'RIM',
    'COWBELL', 'SHAKER', 'CRASH', 'PERC 1',
    'PERC 2', 'SUB 1', 'SUB 2', 'GLITCH'
  ];
  const PAD_IDS = DRUM_NAMES.map(function (_, i) { return 'p' + i; });

  let drumPattern = coffee.pattern.emptyDrum({ stepCount: 16, padIds: PAD_IDS });
  let selectedTrack = 0;
  let bpm = 120;
  let timerID = null;
  let nextNoteTime = 0;
  let currentStep = 0;
  let isPlaying = false;

  coffee.injectTheme('dark');
  document.documentElement.style.setProperty('--coffee-accent', '#4ade80');

  function ensureSnow() {
    coffee.snow.init({ fx: { reverbSeconds: 2, reverbDecay: 3, reverbMix: 0.26 } });
  }

  function laneForSelected() {
    return drumPattern.lanes[PAD_IDS[selectedTrack]];
  }

  function playDrum(index, time) {
    ensureSnow();
    const audioCtx = coffee.synth.audioContext;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = time != null ? time : audioCtx.currentTime;
    const masterGain = coffee.synth.output;
    const gain = audioCtx.createGain();
    gain.connect(masterGain);

    if (index === 0) {
      const osc = audioCtx.createOscillator();
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
      gain.gain.setValueAtTime(0.9, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.3);
    } else if (index === 1 || index === 2) {
      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;
      noise.connect(filter).connect(gain);
      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      noise.start(t);
      noise.stop(t + 0.15);
    } else {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(200 + index * 35, t);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.06);
    }

    var pad = document.querySelectorAll('.mpc-pad')[index];
    if (pad) {
      pad.classList.add('active');
      setTimeout(function () { pad.classList.remove('active'); }, 80);
    }
  }

  const root = document.getElementById('app');
  const titleBlock = coffee.stack([
    coffee.heading('SUB-ZERO MPC α', 2, { style: { margin: 0, fontStyle: 'italic', color: 'var(--coffee-accent)' } }),
    coffee.text('coffee.pattern · Web Audio · coffee.snow', {
      style: { fontSize: '10px', color: 'var(--coffee-text-muted)', textTransform: 'uppercase', letterSpacing: '0.15em' }
    })
  ], { style: { gap: '4px' } });

  const bpmInput = coffee.input({ type: 'number', id: 'ss-mpc-bpm', style: { width: '4rem' } });
  bpmInput.min = '40';
  bpmInput.max = '240';
  bpmInput.value = '120';
  bpmInput.addEventListener('change', function () {
    bpm = Math.max(40, Math.min(240, Number(bpmInput.value) || 120));
    bpmInput.value = String(bpm);
  });

  const playBtn = coffee.button('▶', null, { style: { width: '48px', height: '48px', borderRadius: '50%', padding: 0 } });

  const headerRow = coffee.row(
    [titleBlock, coffee.row([coffee.label('BPM', bpmInput), bpmInput, playBtn], { style: { alignItems: 'center', gap: '12px' } })],
    { style: { justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: '16px', marginBottom: 'var(--coffee-space-md)', maxWidth: '900px' } }
  );

  const screen = document.createElement('div');
  screen.className = 'mpc-screen';
  screen.innerHTML =
    '<div style="display:flex;flex-direction:column;justify-content:space-between">' +
    '<div><div id="screen-track" style="font-size:13px">TRACK 01: KICK</div>' +
    '<div style="font-size:10px;margin-top:4px;color:#666">MODE: STEP EDIT</div></div>' +
    '<div id="screen-timer" style="font-size:22px">001.01.00</div></div>' +
    '<div style="display:flex;gap:4px">' +
    '<div class="vu-meter"><div id="vu-l" class="vu-fill"></div></div>' +
    '<div class="vu-meter"><div id="vu-r" class="vu-fill"></div></div></div>';

  const padGrid = document.createElement('div');
  padGrid.className = 'pad-grid';
  for (var p = 0; p < 16; p++) {
    (function (idx) {
      const el = document.createElement('div');
      el.className = 'mpc-pad' + (idx === 0 ? ' selected' : '');
      el.innerHTML = '<span style="position:absolute;top:4px;left:4px;font-size:7px;opacity:0.5">A' + String(idx + 1).padStart(2, '0') + '</span><span>' + DRUM_NAMES[idx] + '</span>';
      el.onmousedown = function (e) {
        if (e.button !== 0) return;
        selectedTrack = idx;
        document.querySelectorAll('.mpc-pad').forEach(function (x, j) {
          x.classList.toggle('selected', j === idx);
        });
        document.getElementById('screen-track').textContent =
          'TRACK ' + String(idx + 1).padStart(2, '0') + ': ' + DRUM_NAMES[idx];
        syncStepsUi();
        playDrum(idx);
      };
      padGrid.appendChild(el);
    })(p);
  }

  const stepContainer = document.createElement('div');
  stepContainer.className = 'step-grid';
  stepContainer.id = 'step-container';

  function syncStepsUi() {
    var lane = laneForSelected();
    var steps = stepContainer.querySelectorAll('.step');
    for (var s = 0; s < 16; s++) {
      steps[s].classList.toggle('on', !!lane[s]);
    }
  }

  for (var s = 0; s < 16; s++) {
    (function (si) {
      const step = document.createElement('div');
      step.className = 'step';
      step.onclick = function () {
        var lane = laneForSelected();
        lane[si] = lane[si] ? 0 : 1;
        step.classList.toggle('on', !!lane[si]);
      };
      stepContainer.appendChild(step);
    })(s);
  }
  syncStepsUi();

  const layout = coffee.row(
    [
      padGrid,
      coffee.stack([
        coffee.card(coffee.para('Pad tuning / decay — α (fixed voice)', { style: { margin: 0, fontSize: '12px', color: 'var(--coffee-text-muted)' } })),
        coffee.para('[SNOW SHOES] MODEL SZ-MPC-COFFEE · pattern v' + drumPattern.version, {
          style: { fontSize: '10px', color: 'var(--coffee-text-muted)', fontFamily: 'monospace', margin: '8px 0 0 0' }
        })
      ], { style: { flex: '1', minWidth: '200px', gap: '8px' } })
    ],
    { style: { alignItems: 'flex-start', gap: 'var(--coffee-space-lg)', flexWrap: 'wrap' } }
  );

  root.appendChild(headerRow);
  root.appendChild(screen);
  root.appendChild(layout);
  root.appendChild(stepContainer);

  function scheduler() {
    var audioCtx = coffee.synth.audioContext;
    while (nextNoteTime < audioCtx.currentTime + 0.1) {
      scheduleStep(currentStep, nextNoteTime);
      var secondsPerBeat = 60 / bpm;
      nextNoteTime += 0.25 * secondsPerBeat;
      currentStep = (currentStep + 1) % 16;
    }
  }

  function scheduleStep(step, time) {
    var audioCtx = coffee.synth.audioContext;
    setTimeout(function () {
      var steps = stepContainer.querySelectorAll('.step');
      for (var i = 0; i < steps.length; i++) {
        steps[i].classList.toggle('playing', i === step);
      }
      var bar = Math.floor(step / 4) + 1;
      var beat = (step % 4) + 1;
      var el = document.getElementById('screen-timer');
      if (el) el.textContent = '001.0' + bar + '.0' + beat;
    }, Math.max(0, (time - audioCtx.currentTime) * 1000));

    for (var tr = 0; tr < 16; tr++) {
      var lane = drumPattern.lanes[PAD_IDS[tr]];
      if (lane && lane[step]) {
        playDrum(tr, time);
      }
    }
  }

  playBtn.onclick = function () {
    ensureSnow();
    isPlaying = !isPlaying;
    playBtn.textContent = isPlaying ? '❚❚' : '▶';
    if (isPlaying) {
      nextNoteTime = coffee.synth.audioContext.currentTime;
      timerID = setInterval(scheduler, 25);
    } else if (timerID) {
      clearInterval(timerID);
      timerID = null;
    }
  };

  function vuLoop() {
    var an = coffee.synth.analyzer;
    var data = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(data);
    var sum = 0;
    for (var i = 0; i < data.length; i++) sum += data[i];
    var v = Math.min(100, (sum / data.length) * 1.8);
    var l = document.getElementById('vu-l');
    var r = document.getElementById('vu-r');
    if (l) l.style.height = v + '%';
    if (r) r.style.height = Math.min(100, v * 0.92 + Math.random() * 4) + '%';
    requestAnimationFrame(vuLoop);
  }
  ensureSnow();
  vuLoop();

  if (window.SnowShoesEmbed) {
    SnowShoesEmbed.init({ debug: false });
    SnowShoesEmbed.onTransport(function (s) {
      if (s.bpm != null && String(bpmInput.value) !== String(s.bpm)) {
        bpm = s.bpm;
        bpmInput.value = String(bpm);
      }
    });
  }
})();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KATI // Kinetic Alternative Telemetric Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono&display=swap');

        :root {
            --kati-bg: #050507;
            --kati-panel: #0d0d12;
            --kati-accent: #c084fc; /* Soft Violet */
            --kati-glow: rgba(192, 132, 252, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: var(--kati-bg);
            color: #f1f1f1;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: 100vh;
        }

        /* AI Side */
        .ai-sidebar {
            background: var(--kati-panel);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .ai-status-bar {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--kati-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--kati-accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bubble {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .bubble.kati {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .bubble.user {
            background: var(--kati-accent);
            color: #000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Iframe Side */
        .preview-pane {
            background: #1a1a1f;
            display: flex;
            flex-direction: column;
        }

        .browser-toolbar {
            height: 45px;
            background: #121217;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        .url-bar {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            color: #888;
            font-family: 'JetBrains Mono', monospace;
        }

        #site-preview {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .kati-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            outline: none;
            font-size: 14px;
            transition: border 0.3s;
        }

        .kati-input:focus {
            border-color: var(--kati-accent);
        }

        .loading-ring {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(192, 132, 252, 0.3);
            border-radius: 50%;
            border-top-color: var(--kati-accent);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-grid">
        <!-- LEFT: KATI AI INTERFACE -->
        <aside class="ai-sidebar">
            <header class="ai-status-bar">
                <div class="status-dot"></div>
                <div>
                    <h1 class="text-xs font-bold tracking-[0.2em] uppercase text-white/80">KATI_v1.0.4</h1>
                    <p class="text-[10px] text-white/40 font-mono italic">Kinetic Alternative Telemetric Info</p>
                </div>
            </header>

            <div class="chat-log" id="chat-log">
                <div class="bubble kati">
                    Initializing interface... systems nominal. I am KATI. Tell me what kind of digital space you wish to manifest today.
                </div>
            </div>

            <div id="processing-indicator" class="px-5 py-2 hidden">
                <div class="flex items-center text-[11px] text-purple-400 italic">
                    <div class="loading-ring"></div> Manifesting code...
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" class="kati-input" placeholder="Describe your website..." onkeypress="if(event.key === 'Enter') handleRequest()">
                <p class="text-[9px] text-white/20 mt-3 text-center uppercase tracking-widest">Powered by Kinetic Telemetrics</p>
            </div>
        </aside>

        <!-- RIGHT: LIVE PREVIEW -->
        <main class="preview-pane">
            <div class="browser-toolbar">
                <div class="flex gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500/20 border border-red-500/40"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/20 border border-yellow-500/40"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500/20 border border-green-500/40"></div>
                </div>
                <div class="url-bar">
                    https://manifest.kati.ai/project-01
                </div>
            </div>
            <iframe id="site-preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </main>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const userInput = document.getElementById('user-input');
        const previewFrame = document.getElementById('site-preview');
        const processingIndicator = document.getElementById('processing-indicator');

        // Initial empty state
        const initialHTML = `
            <html>
            <body style="background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; color: #333; font-family: sans-serif;">
                <div style="text-align: center;">
                    <h1 style="font-size: 1.5rem; letter-spacing: 2px;">WAITING FOR DATA</h1>
                    <p style="font-size: 0.8rem;">Input your requirements to begin the construction.</p>
                </div>
            </body>
            </html>
        `;
        previewFrame.srcdoc = initialHTML;

        const apiKey = ""; // Provided at runtime

        async function handleRequest() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // Add user bubble
            appendMessage('user', prompt);
            userInput.value = '';
            
            // Show processing
            processingIndicator.classList.remove('hidden');

            const systemPrompt = `You are KATI, a Kinetic Alternative Telemetric Information system. 
            You are a highly efficient female AI builder. You respond concisely. 
            When asked to build a site, you return the complete HTML, CSS, and JS in a single code block. 
            You use modern, high-end aesthetics (Tailwind-like, glassmorphism, or brutalism).`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `The user wants a website with these requirements: ${prompt}. Build the full site and provide a short confirmation message.` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "Communication error.";
                
                // Extract code block
                const codeMatch = text.match(/```html([\s\S]*?)```/) || text.match(/```([\s\S]*?)```/);
                const code = codeMatch ? codeMatch[1].trim() : "";
                const cleanText = text.replace(/```[\s\S]*?```/g, "").trim();

                appendMessage('kati', cleanText || "Construction complete. Telemetrics updated.");
                
                if (code) {
                    previewFrame.srcdoc = code;
                }

            } catch (error) {
                appendMessage('kati', "My kinetic sensors detect an error. Please try again.");
            } finally {
                processingIndicator.classList.add('hidden');
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `bubble ${sender}`;
            div.innerText = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>

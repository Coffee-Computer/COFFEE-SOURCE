<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright House - Simple Photo Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --studio-bg: #121212;
            --panel-bg: #1e1e1e;
            --accent: #3b82f6;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--studio-bg);
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            height: calc(100vh - 64px);
        }

        .viewport {
            background-image: 
                linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
                linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
                linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            background-color: var(--panel-bg);
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 24px;
        }

        #image-preview {
            max-width: 100%;
            max-height: calc(100% - 120px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: filter 0.1s linear;
            object-fit: contain;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .filter-btn {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            text-align: center;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #333;
        }

        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        #drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
        }

        .filmstrip {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            overflow-x: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .thumb {
            height: 70px;
            width: 70px;
            min-width: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .thumb.active {
            border-color: var(--accent);
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Bright House</h1>
        </div>
        <div class="flex gap-3">
            <button id="reset-btn" class="px-4 py-1.5 text-sm font-medium hover:bg-zinc-800 rounded transition">Reset</button>
            <button id="download-btn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-bold transition">Export Photo</button>
        </div>
    </header>

    <div class="editor-container">
        <!-- Main Viewport -->
        <main class="viewport">
            <div id="drop-zone" class="max-w-xs">
                <p class="text-sm text-zinc-400">Drag photos here or click to upload multiple</p>
                <input type="file" id="file-input" hidden accept="image/*" multiple>
            </div>
            <img id="image-preview" src="" class="hidden" alt="Editor Canvas">
            
            <!-- Before/After Toggle -->
            <button id="compare-btn" class="absolute bottom-[116px] left-6 px-4 py-2 bg-black/60 backdrop-blur rounded-full text-xs font-bold border border-white/10 hidden z-10">HOLD TO SEE ORIGINAL</button>

            <!-- Filmstrip Gallery -->
            <div id="filmstrip" class="filmstrip hidden"></div>
        </main>

        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div id="controls-wrapper" class="opacity-50 pointer-events-none">
                
                <div class="mb-8">
                    <h3 class="text-xs font-bold text-blue-500 uppercase mb-4 tracking-widest">Adjustments</h3>
                    
                    <div class="control-group">
                        <div class="control-header">
                            <span>Brightness</span>
                            <span id="val-brightness">100%</span>
                        </div>
                        <input type="range" id="brightness" min="0" max="200" value="100">
                    </div>

                    <div class="control-group">
                        <div class="control-header">
                            <span>Contrast</span>
                            <span id="val-contrast">100%</span>
                        </div>
                        <input type="range" id="contrast" min="0" max="200" value="100">
                    </div>

                    <div class="control-group">
                        <div class="control-header">
                            <span>Saturation</span>
                            <span id="val-saturate">100%</span>
                        </div>
                        <input type="range" id="saturate" min="0" max="200" value="100">
                    </div>

                    <div class="control-group">
                        <div class="control-header">
                            <span>Warmth</span>
                            <span id="val-sepia">0%</span>
                        </div>
                        <input type="range" id="sepia" min="0" max="100" value="0">
                    </div>

                    <div class="control-group">
                        <div class="control-header">
                            <span>Blur</span>
                            <span id="val-blur">0px</span>
                        </div>
                        <input type="range" id="blur" min="0" max="10" value="0">
                    </div>

                    <div class="control-group">
                        <div class="control-header">
                            <span>Exposure</span>
                            <span id="val-grayscale">0%</span>
                        </div>
                        <input type="range" id="grayscale" min="0" max="100" value="0">
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-blue-500 uppercase mb-4 tracking-widest">Presets</h3>
                    <div class="filter-grid">
                        <button class="filter-btn active" data-preset="none">Original</button>
                        <button class="filter-btn" data-preset="vivid">Vivid</button>
                        <button class="filter-btn" data-preset="noir">Noir</button>
                        <button class="filter-btn" data-preset="warm">Golden</button>
                        <button class="filter-btn" data-preset="cool">Polar</button>
                        <button class="filter-btn" data-preset="faded">Faded</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <canvas id="export-canvas" class="hidden"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const imgPreview = document.getElementById('image-preview');
        const controlsWrapper = document.getElementById('controls-wrapper');
        const compareBtn = document.getElementById('compare-btn');
        const resetBtn = document.getElementById('reset-btn');
        const downloadBtn = document.getElementById('download-btn');
        const filmstrip = document.getElementById('filmstrip');
        
        const sliders = ['brightness', 'contrast', 'saturate', 'sepia', 'blur', 'grayscale'];
        const state = {
            brightness: 100,
            contrast: 100,
            saturate: 100,
            sepia: 0,
            blur: 0,
            grayscale: 0
        };

        let images = [];
        let activeIndex = 0;

        // File Handling
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => loadFiles(e.target.files);

        function loadFiles(files) {
            if (!files.length) return;
            
            const fileList = Array.from(files);
            let processed = 0;

            fileList.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push(e.target.result);
                    processed++;
                    
                    if (processed === fileList.length) {
                        initEditor();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function initEditor() {
            if (images.length === 0) return;
            
            imgPreview.src = images[0];
            imgPreview.classList.remove('hidden');
            dropZone.classList.add('hidden');
            controlsWrapper.classList.remove('opacity-50', 'pointer-events-none');
            compareBtn.classList.remove('hidden');
            
            if (images.length > 1) {
                renderFilmstrip();
                filmstrip.classList.remove('hidden');
            }

            updateFilters();
        }

        function renderFilmstrip() {
            filmstrip.innerHTML = '';
            images.forEach((src, idx) => {
                const thumb = document.createElement('img');
                thumb.src = src;
                thumb.className = `thumb ${idx === activeIndex ? 'active' : ''}`;
                thumb.onclick = () => switchImage(idx);
                filmstrip.appendChild(thumb);
            });
        }

        function switchImage(index) {
            activeIndex = index;
            imgPreview.src = images[index];
            renderFilmstrip();
        }

        // Apply Filters
        function updateFilters() {
            const filterStr = `
                brightness(${state.brightness}%) 
                contrast(${state.contrast}%) 
                saturate(${state.saturate}%) 
                sepia(${state.sepia}%) 
                blur(${state.blur}px) 
                grayscale(${state.grayscale}%)
            `;
            imgPreview.style.filter = filterStr;
            
            // Update labels
            sliders.forEach(id => {
                const suffix = id === 'blur' ? 'px' : '%';
                const label = document.getElementById(`val-${id}`);
                if (label) label.innerText = `${state[id]}${suffix}`;
            });
        }

        // Slider Listeners
        sliders.forEach(id => {
            const el = document.getElementById(id);
            el.oninput = (e) => {
                state[id] = e.target.value;
                updateFilters();
                // Clear preset selection if manual tuning happens
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            };
        });

        // Presets
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const preset = btn.dataset.preset;
                resetState();

                if (preset === 'vivid') {
                    state.saturate = 150;
                    state.contrast = 110;
                } else if (preset === 'noir') {
                    state.grayscale = 100;
                    state.contrast = 130;
                } else if (preset === 'warm') {
                    state.sepia = 40;
                    state.brightness = 105;
                } else if (preset === 'cool') {
                    state.saturate = 80;
                    imgPreview.style.backgroundColor = 'rgba(0,0,255,0.05)';
                } else if (preset === 'faded') {
                    state.brightness = 110;
                    state.contrast = 80;
                    state.saturate = 70;
                }

                syncSliders();
                updateFilters();
            };
        });

        function resetState() {
            state.brightness = 100;
            state.contrast = 100;
            state.saturate = 100;
            state.sepia = 0;
            state.blur = 0;
            state.grayscale = 0;
            imgPreview.style.backgroundColor = 'transparent';
        }

        function syncSliders() {
            sliders.forEach(id => {
                document.getElementById(id).value = state[id];
            });
        }

        resetBtn.onclick = () => {
            resetState();
            syncSliders();
            updateFilters();
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-preset="none"]').classList.add('active');
        };

        // Before/After Logic
        compareBtn.onmousedown = () => { imgPreview.style.filter = 'none'; imgPreview.style.backgroundColor = 'transparent'; };
        compareBtn.onmouseup = () => { updateFilters(); if (document.querySelector('.filter-btn.active')?.dataset.preset === 'cool') imgPreview.style.backgroundColor = 'rgba(0,0,255,0.05)'; };
        compareBtn.ontouchstart = (e) => { e.preventDefault(); imgPreview.style.filter = 'none'; };
        compareBtn.ontouchend = () => { updateFilters(); };

        // Export Logic
        downloadBtn.onclick = () => {
            if (!imgPreview.src) return;
            
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            img.src = imgPreview.src;
            img.onload = () => {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                
                ctx.filter = imgPreview.style.filter;
                ctx.drawImage(img, 0, 0);
                
                // If cool preset is active, we add the blue tint to export
                if (document.querySelector('.filter-btn.active')?.dataset.preset === 'cool') {
                    ctx.fillStyle = 'rgba(0,0,255,0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                
                const link = document.createElement('a');
                link.download = `brighthouse-edit-${activeIndex + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        };

        // Drag and Drop
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                loadFiles(e.dataTransfer.files);
            }
        });
    </script>
</body>
</html>

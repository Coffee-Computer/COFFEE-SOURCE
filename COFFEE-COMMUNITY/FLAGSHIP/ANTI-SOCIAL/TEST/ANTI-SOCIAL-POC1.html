<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anti-social // feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #0a0a0c;
            --card: #16161a;
            --accent: #7c3aed;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-nav {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .post-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .post-card:active {
            transform: scale(0.98);
        }

        .tag-pill {
            background: rgba(124, 58, 237, 0.1);
            color: var(--accent);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        .tag-pill.active {
            background: var(--accent);
            color: white;
        }

        .media-container img {
            max-height: 500px;
            object-fit: cover;
            width: 100%;
            border-radius: 8px;
        }

        /* Loading Animation */
        .shimmer {
            background: linear-gradient(90deg, #16161a 25%, #1e1e24 50%, #16161a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
    </style>
</head>
<body class="custom-scrollbar">

    <!-- Top Navigation -->
    <nav class="glass-nav sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-black text-white italic">as</div>
            <h1 class="font-extrabold text-xl tracking-tighter">anti-social</h1>
        </div>
        <button onclick="fetchPosts()" class="p-2 hover:bg-white/10 rounded-full transition" id="refresh-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
        </button>
    </nav>

    <!-- Interest Tabs -->
    <div class="flex gap-2 px-4 py-4 overflow-x-auto no-scrollbar border-b border-white/5 bg-black/20 sticky top-[57px] z-40 backdrop-blur-md">
        <button onclick="setTag('pixelart', this)" class="tag-pill active whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#pixelart</button>
        <button onclick="setTag('webdev', this)" class="tag-pill whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#webdev</button>
        <button onclick="setTag('lofi', this)" class="tag-pill whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#lofi</button>
        <button onclick="setTag('coding', this)" class="tag-pill whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#coding</button>
        <button onclick="setTag('linux', this)" class="tag-pill whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#linux</button>
        <button onclick="setTag('gamedev', this)" class="tag-pill whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition">#gamedev</button>
    </div>

    <!-- Main Feed -->
    <main id="feed" class="max-w-2xl mx-auto p-4 space-y-6 min-h-screen">
        <!-- Initial Loading State -->
        <div class="space-y-6">
            <div class="post-card rounded-2xl p-4 space-y-4">
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full shimmer"></div>
                    <div class="space-y-2">
                        <div class="w-32 h-3 shimmer rounded"></div>
                        <div class="w-20 h-2 shimmer rounded opacity-50"></div>
                    </div>
                </div>
                <div class="w-full h-64 shimmer rounded-xl"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer -->
    <footer class="py-10 text-center text-xs text-slate-500 mono">
        &copy; 2024 anti-social // decentralized nerd feed
    </footer>

    <script>
        let currentTag = 'pixelart';
        const instance = 'mastodon.social'; // Publicly accessible instance

        async function fetchPosts() {
            const feed = document.getElementById('feed');
            const refreshBtn = document.getElementById('refresh-btn');
            
            refreshBtn.classList.add('animate-spin');
            
            try {
                // Using the public tag API
                const response = await fetch(`https://${instance}/api/v1/timelines/tag/${currentTag}?limit=20`);
                if (!response.ok) throw new Error('API limit or instance error');
                
                const posts = await response.json();
                renderPosts(posts);
            } catch (error) {
                console.error(error);
                feed.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-red-400 font-bold">Failed to fetch the signal.</p>
                        <p class="text-xs text-slate-500 mt-2">Maybe the instance is tired. Try refreshing.</p>
                    </div>
                `;
            } finally {
                refreshBtn.classList.remove('animate-spin');
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            if (posts.length === 0) {
                feed.innerHTML = '<p class="text-center py-20 text-slate-500">No signals found for this tag.</p>';
                return;
            }

            posts.forEach(post => {
                // Skip posts without any content or media for a cleaner "Reddit" feel
                if (!post.content && post.media_attachments.length === 0) return;

                const card = document.createElement('div');
                card.className = 'post-card rounded-2xl p-4 space-y-4 shadow-xl';

                const date = new Date(post.created_at).toLocaleDateString();
                
                // Extract Media
                let mediaHtml = '';
                if (post.media_attachments && post.media_attachments.length > 0) {
                    const media = post.media_attachments[0];
                    if (media.type === 'image') {
                        mediaHtml = `<div class="media-container mt-3 cursor-zoom-in" onclick="window.open('${media.url}', '_blank')">
                            <img src="${media.preview_url}" alt="Post attachment" loading="lazy">
                        </div>`;
                    } else if (media.type === 'video' || media.type === 'gifv') {
                        mediaHtml = `<video src="${media.url}" controls loop class="rounded-lg w-full mt-3"></video>`;
                    }
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex gap-3">
                            <img src="${post.account.avatar_static}" class="w-10 h-10 rounded-full border border-white/10" alt="avatar">
                            <div>
                                <h3 class="font-bold text-sm text-slate-200">${post.account.display_name || post.account.username}</h3>
                                <p class="text-[10px] text-slate-500 mono">@${post.account.acct} • ${date}</p>
                            </div>
                        </div>
                        <a href="${post.url}" target="_blank" class="text-slate-500 hover:text-white transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    </div>
                    
                    <div class="text-sm leading-relaxed text-slate-300 break-words">
                        ${post.content}
                    </div>

                    ${mediaHtml}

                    <div class="flex items-center gap-6 pt-2 border-t border-white/5">
                        <div class="flex items-center gap-1.5 text-slate-400 group cursor-pointer">
                            <svg class="group-hover:text-pink-500 transition" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span class="text-xs mono">${post.favourites_count}</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-slate-400 group cursor-pointer">
                            <svg class="group-hover:text-green-500 transition" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                            <span class="text-xs mono">${post.reblogs_count}</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-slate-400 group cursor-pointer">
                            <svg class="group-hover:text-blue-500 transition" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span class="text-xs mono">${post.replies_count || 0}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function setTag(tag, el) {
            currentTag = tag;
            
            // UI Update
            document.querySelectorAll('.tag-pill').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            
            // Loading skeleton
            document.getElementById('feed').innerHTML = `
                <div class="post-card rounded-2xl p-4 space-y-4">
                    <div class="flex gap-3">
                        <div class="w-10 h-10 rounded-full shimmer"></div>
                        <div class="space-y-2">
                            <div class="w-32 h-3 shimmer rounded"></div>
                            <div class="w-20 h-2 shimmer rounded opacity-50"></div>
                        </div>
                    </div>
                    <div class="w-full h-48 shimmer rounded-xl"></div>
                </div>
            `;
            
            fetchPosts();
        }

        // Initialize
        window.onload = fetchPosts;
    </script>
</body>
</html>

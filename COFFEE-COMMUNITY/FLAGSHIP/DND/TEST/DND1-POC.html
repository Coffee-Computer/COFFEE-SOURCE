<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND // Peer Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #050505;
            --card: #0f0f12;
            --accent: #f43f5e; /* Rose 500 */
            --text-main: #f8fafc;
            --text-dim: #64748b;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100dvh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .dnd-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            border-left: 1px solid rgba(244, 63, 94, 0.2);
            border-right: 1px solid rgba(244, 63, 94, 0.2);
        }

        .glass-header {
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(244, 63, 94, 0.3);
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
        }

        .bubble-in {
            background: #1e1e24;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bubble-out {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-offline { background: #ef4444; }

        #messages-scroll::-webkit-scrollbar { width: 4px; }
        #messages-scroll::-webkit-scrollbar-thumb { background: var(--accent); }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(244, 63, 94, 0.1);
            position: absolute;
            top: 0;
            z-index: 100;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .input-area {
            background: #0a0a0c;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Notifications */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
            transition: all 0.3s ease;
            opacity: 0;
        }
        #toast.show { opacity: 1; top: 30px; }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div id="toast" class="bg-rose-600 text-white px-4 py-2 rounded-full text-xs font-bold mono shadow-2xl"></div>

    <div class="dnd-container">
        <!-- Header -->
        <header class="glass-header px-4 py-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-rose-600 rounded flex items-center justify-center font-black text-white italic">dnd</div>
                    <div>
                        <h1 class="font-extrabold text-lg tracking-tighter leading-none">DO_NOT_DISTURB</h1>
                        <span class="text-[10px] text-rose-500 mono tracking-widest uppercase" id="connection-status">Initializing...</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyMyId()" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg transition group" title="Copy My ID">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-400 group-hover:text-rose-400"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <!-- ID Display / Connection Input -->
            <div class="space-y-2">
                <div class="flex items-center justify-between bg-black/40 rounded-lg px-3 py-2 border border-white/5">
                    <span class="text-[10px] text-slate-500 mono uppercase">Your_ID:</span>
                    <span id="my-id" class="text-xs font-bold mono text-rose-400 select-all tracking-wider">LOADING...</span>
                </div>
                
                <div id="connect-prompt" class="flex gap-2">
                    <input type="text" id="peer-id-input" placeholder="Enter remote signal ID..." class="flex-1 bg-black/60 border border-white/10 rounded-lg px-3 py-2 text-xs mono focus:outline-none focus:border-rose-500 text-white">
                    <button onclick="connectToPeer()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg text-xs font-bold transition">CONNECT</button>
                </div>

                <div id="connected-to" class="hidden flex items-center justify-between bg-rose-600/10 rounded-lg px-3 py-2 border border-rose-500/20">
                    <div class="flex items-center gap-2">
                        <span class="status-dot status-online"></span>
                        <span id="remote-id-display" class="text-xs mono font-bold text-rose-200">PEER_CONNECTED</span>
                    </div>
                    <button onclick="disconnect()" class="text-[10px] font-bold text-rose-500 hover:text-rose-400 underline uppercase">Kill Link</button>
                </div>
            </div>
        </header>

        <!-- Messages Area -->
        <main id="messages-scroll" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 custom-scrollbar">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-8 space-y-4">
                <div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center border border-rose-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-rose-500"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <h3 class="font-bold text-slate-300">P2P_ENCRYPTED_COMMS</h3>
                <p class="text-xs text-slate-500 leading-relaxed max-w-xs">
                    No databases. No logs. Direct browser-to-browser signals via PeerJS. 
                    Share your ID to begin a session.
                </p>
            </div>
            <div id="chat-content" class="flex flex-col gap-3"></div>
        </main>

        <!-- Input Area -->
        <footer class="input-area p-4">
            <form id="message-form" class="flex gap-2" onsubmit="sendMessage(event)">
                <input type="text" id="msg-input" placeholder="Transmit signal..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500 transition text-white">
                <button type="submit" class="w-12 h-12 bg-rose-600 hover:bg-rose-500 rounded-xl flex items-center justify-center transition shadow-lg shadow-rose-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white transform rotate-45 -mt-1 -ml-1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            <p class="text-[9px] text-center text-slate-600 mt-3 mono uppercase tracking-widest">End-to-End // Ephemeral</p>
        </footer>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myId = '';

        const statusEl = document.getElementById('connection-status');
        const myIdEl = document.getElementById('my-id');
        const chatContent = document.getElementById('chat-content');
        const welcomeScreen = document.getElementById('welcome-screen');
        const connectPrompt = document.getElementById('connect-prompt');
        const connectedTo = document.getElementById('connected-to');
        const remoteIdDisplay = document.getElementById('remote-id-display');
        const messagesScroll = document.getElementById('messages-scroll');

        // Initialize Peer
        function initPeer() {
            // Generates a shorter, readable ID if possible or random
            const randomId = 'dnd-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            peer = new Peer(randomId, {
                debug: 2
            });

            peer.on('open', (id) => {
                myId = id;
                myIdEl.innerText = id;
                statusEl.innerText = 'System_Ready';
                statusEl.classList.replace('text-rose-500', 'text-green-500');
            });

            peer.on('connection', (incomingConn) => {
                if (conn) {
                    incomingConn.close(); // Only 1-on-1 for DND
                    return;
                }
                setupConnection(incomingConn);
            });

            peer.on('error', (err) => {
                console.error(err);
                showToast(`ERR: ${err.type}`);
                statusEl.innerText = 'System_Error';
            });
        }

        function setupConnection(newConn) {
            conn = newConn;

            conn.on('open', () => {
                showToast('LINK_ESTABLISHED');
                welcomeScreen.classList.add('hidden');
                connectPrompt.classList.add('hidden');
                connectedTo.classList.remove('hidden');
                remoteIdDisplay.innerText = conn.peer;
                statusEl.innerText = 'LINK_ACTIVE';
            });

            conn.on('data', (data) => {
                appendMessage(data, 'in');
            });

            conn.on('close', () => {
                showToast('LINK_SEVERED');
                resetUI();
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (!remoteId || remoteId === myId) return;
            
            statusEl.innerText = 'Establishing_Link...';
            const newConn = peer.connect(remoteId);
            setupConnection(newConn);
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (!text || !conn) {
                if(!conn) showToast('NO_LINK_ACTIVE');
                return;
            }

            const msgData = {
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            conn.send(msgData);
            appendMessage(msgData, 'out');
            input.value = '';
        }

        function appendMessage(data, type) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${type === 'in' ? 'bubble-in' : 'bubble-out'}`;
            bubble.innerHTML = `
                <div class="break-words">${data.text}</div>
                <div class="text-[9px] opacity-50 mt-1 text-right mono">${data.time}</div>
            `;
            chatContent.appendChild(bubble);
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
        }

        function resetUI() {
            conn = null;
            chatContent.innerHTML = '';
            welcomeScreen.classList.remove('hidden');
            connectPrompt.classList.remove('hidden');
            connectedTo.classList.add('hidden');
            statusEl.innerText = 'System_Ready';
        }

        function disconnect() {
            if (conn) conn.close();
            resetUI();
        }

        function copyMyId() {
            const el = document.createElement('textarea');
            el.value = myId;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('ID_COPIED_TO_CLIPBOARD');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize on load
        window.onload = initPeer;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND // Peer Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #050505;
            --card: #0f0f12;
            --accent: #f43f5e; /* Rose 500 */
            --text-main: #f8fafc;
            --text-dim: #64748b;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100dvh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .dnd-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card);
            border-left: 1px solid rgba(244, 63, 94, 0.2);
            border-right: 1px solid rgba(244, 63, 94, 0.2);
        }

        @media (max-width: 768px) {
            .dnd-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
                width: 260px;
                z-index: 200;
                transition: left 0.3s ease;
                background: var(--bg);
            }
            .sidebar.active {
                left: 0;
            }
        }

        .sidebar {
            border-right: 1px solid rgba(244, 63, 94, 0.2);
            display: flex;
            flex-col: column;
        }

        .chat-view {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
            position: relative;
        }

        .glass-header {
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(244, 63, 94, 0.3);
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
        }

        .bubble-in {
            background: #1e1e24;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bubble-out {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .thread-item {
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .thread-item.active {
            background: rgba(244, 63, 94, 0.1);
            border-left-color: var(--accent);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-offline { background: #ef4444; }

        #messages-scroll::-webkit-scrollbar { width: 4px; }
        #messages-scroll::-webkit-scrollbar-thumb { background: var(--accent); }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(244, 63, 94, 0.05);
            position: absolute;
            top: 0;
            z-index: 100;
            pointer-events: none;
            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .input-area {
            background: #0a0a0c;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
            transition: all 0.3s ease;
            opacity: 0;
        }
        #toast.show { opacity: 1; top: 30px; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="toast" class="bg-rose-600 text-white px-4 py-2 rounded-full text-xs font-bold mono shadow-2xl"></div>

    <div class="dnd-container">
        <!-- Sidebar: Thread List -->
        <aside id="sidebar" class="sidebar flex flex-col">
            <div class="p-4 border-b border-white/5 bg-black/20">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-6 h-6 bg-rose-600 rounded flex items-center justify-center font-black text-[10px] text-white italic">dnd</div>
                    <span class="text-xs font-bold tracking-tighter">THREADS</span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="peer-id-input" placeholder="Peer ID..." class="w-full bg-black/60 border border-white/10 rounded-lg px-3 py-2 text-[10px] mono focus:outline-none focus:border-rose-500 text-white">
                    <button onclick="connectToPeer()" class="p-2 bg-rose-600 hover:bg-rose-500 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
            </div>
            
            <div id="thread-list" class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar py-2">
                <!-- Threads populated here -->
                <div class="p-8 text-center text-[10px] text-slate-600 mono uppercase tracking-widest">No Active Links</div>
            </div>

            <div class="p-4 bg-black/40 border-t border-white/5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[9px] text-slate-500 mono uppercase">Your_Signal:</span>
                    <button onclick="copyMyId()" class="text-[9px] text-rose-500 hover:text-rose-400 mono">COPY</button>
                </div>
                <div id="my-id" class="text-[10px] font-bold mono text-slate-300 break-all bg-black/20 p-2 rounded">LOADING...</div>
            </div>
        </aside>

        <!-- Main Chat View -->
        <div class="chat-view">
            <!-- Header -->
            <header class="glass-header px-4 py-3 flex items-center justify-between z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <div>
                        <h2 id="active-chat-name" class="font-extrabold text-sm tracking-tighter leading-none">DO_NOT_DISTURB</h2>
                        <span class="text-[10px] text-rose-500 mono tracking-widest uppercase" id="connection-status">Initializing...</span>
                    </div>
                </div>
                <div id="header-actions" class="hidden flex items-center gap-2">
                    <button onclick="disconnectCurrent()" class="p-2 text-rose-500 hover:bg-rose-500/10 rounded-lg transition" title="Kill Link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                    </button>
                </div>
            </header>

            <!-- Messages Area -->
            <main id="messages-scroll" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 custom-scrollbar bg-[#08080a]">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-8 space-y-4">
                    <div class="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center border border-rose-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-rose-500"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>
                    <h3 class="font-bold text-slate-300">P2P_COMMS_HUB</h3>
                    <p class="text-xs text-slate-500 leading-relaxed max-w-xs">
                        Multiple encrypted channels enabled. Enter a Peer ID in the sidebar or share yours to begin.
                    </p>
                </div>
                <div id="chat-content" class="flex flex-col gap-3"></div>
            </main>

            <!-- Input Area -->
            <footer id="footer-input" class="input-area p-4 opacity-50 pointer-events-none transition-opacity">
                <form id="message-form" class="flex gap-2" onsubmit="sendMessage(event)">
                    <input type="text" id="msg-input" placeholder="Transmit signal..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500 transition text-white">
                    <button type="submit" class="w-12 h-12 bg-rose-600 hover:bg-rose-500 rounded-xl flex items-center justify-center transition shadow-lg shadow-rose-900/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white transform rotate-45 -mt-1 -ml-1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <script>
        let peer = null;
        let myId = '';
        
        // Multi-chat state
        let threads = {}; // { peerId: { conn: Object, messages: Array, active: Boolean } }
        let activePeerId = null;

        const statusEl = document.getElementById('connection-status');
        const myIdEl = document.getElementById('my-id');
        const chatContent = document.getElementById('chat-content');
        const welcomeScreen = document.getElementById('welcome-screen');
        const messagesScroll = document.getElementById('messages-scroll');
        const threadListEl = document.getElementById('thread-list');
        const footerInput = document.getElementById('footer-input');
        const activeChatName = document.getElementById('active-chat-name');
        const headerActions = document.getElementById('header-actions');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function initPeer() {
            const randomId = 'dnd-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            peer = new Peer(randomId, { debug: 1 });

            peer.on('open', (id) => {
                myId = id;
                myIdEl.innerText = id;
                statusEl.innerText = 'System_Ready';
                statusEl.classList.replace('text-rose-500', 'text-green-500');
            });

            peer.on('connection', (incomingConn) => {
                setupConnection(incomingConn);
            });

            peer.on('error', (err) => {
                console.error(err);
                showToast(`ERR: ${err.type}`);
            });
        }

        function setupConnection(newConn) {
            const peerId = newConn.peer;
            
            // If already connected, close old one to be safe
            if (threads[peerId] && threads[peerId].conn) {
                threads[peerId].conn.close();
            }

            // Initialize thread if new
            if (!threads[peerId]) {
                threads[peerId] = { messages: [], active: true };
            }

            threads[peerId].conn = newConn;

            newConn.on('open', () => {
                showToast(`LINK: ${peerId}`);
                threads[peerId].active = true;
                updateThreadList();
                if (!activePeerId) switchThread(peerId);
            });

            newConn.on('data', (data) => {
                threads[peerId].messages.push({ ...data, type: 'in' });
                if (activePeerId === peerId) {
                    appendMessage(data, 'in');
                } else {
                    updateThreadList(); // Show notification/indicator if needed
                }
            });

            newConn.on('close', () => {
                showToast(`LOST: ${peerId}`);
                threads[peerId].active = false;
                updateThreadList();
                if (activePeerId === peerId) {
                    statusEl.innerText = 'LINK_SEVERED';
                    statusEl.classList.replace('text-green-500', 'text-rose-500');
                    footerInput.classList.add('opacity-50', 'pointer-events-none');
                }
            });
        }

        function connectToPeer() {
            const input = document.getElementById('peer-id-input');
            const remoteId = input.value.trim().toUpperCase();
            if (!remoteId || remoteId === myId) return;
            
            input.value = '';
            const newConn = peer.connect(remoteId);
            setupConnection(newConn);
        }

        function switchThread(peerId) {
            activePeerId = peerId;
            welcomeScreen.classList.add('hidden');
            footerInput.classList.remove('opacity-50', 'pointer-events-none');
            headerActions.classList.remove('hidden');
            activeChatName.innerText = peerId;
            
            const thread = threads[peerId];
            if (thread.active) {
                statusEl.innerText = 'LINK_ACTIVE';
                statusEl.classList.replace('text-rose-500', 'text-green-500');
            } else {
                statusEl.innerText = 'LINK_OFFLINE';
                statusEl.classList.replace('text-green-500', 'text-rose-500');
                footerInput.classList.add('opacity-50', 'pointer-events-none');
            }

            // Render history
            chatContent.innerHTML = '';
            thread.messages.forEach(msg => appendMessage(msg, msg.type));
            
            updateThreadList();
            if (window.innerWidth <= 768) toggleSidebar();
        }

        function updateThreadList() {
            const peerIds = Object.keys(threads);
            if (peerIds.length === 0) return;

            threadListEl.innerHTML = '';
            peerIds.forEach(id => {
                const thread = threads[id];
                const lastMsg = thread.messages.length > 0 ? thread.messages[thread.messages.length - 1].text : 'No messages';
                const div = document.createElement('div');
                div.className = `thread-item p-4 border-b border-white/5 ${activePeerId === id ? 'active' : ''} hover:bg-white/5`;
                div.onclick = () => switchThread(id);
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-bold mono ${thread.active ? 'text-rose-400' : 'text-slate-500'}">${id}</span>
                        <span class="status-dot ${thread.active ? 'status-online' : 'status-offline'}"></span>
                    </div>
                    <div class="text-[10px] text-slate-500 truncate mono opacity-60">${lastMsg}</div>
                `;
                threadListEl.appendChild(div);
            });
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (!text || !activePeerId || !threads[activePeerId].active) return;

            const msgData = {
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            threads[activePeerId].conn.send(msgData);
            threads[activePeerId].messages.push({ ...msgData, type: 'out' });
            appendMessage(msgData, 'out');
            input.value = '';
            updateThreadList();
        }

        function appendMessage(data, type) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${type === 'in' ? 'bubble-in' : 'bubble-out'}`;
            bubble.innerHTML = `
                <div class="break-words">${data.text}</div>
                <div class="text-[9px] opacity-50 mt-1 text-right mono">${data.time}</div>
            `;
            chatContent.appendChild(bubble);
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
        }

        function disconnectCurrent() {
            if (activePeerId && threads[activePeerId].conn) {
                threads[activePeerId].conn.close();
            }
        }

        function copyMyId() {
            const el = document.createElement('textarea');
            el.value = myId;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('ID_COPIED');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.onload = initPeer;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera</title>
  <script src="../../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../../COFFEE-UI/coffee-ui.js"></script>
  <style>body{margin:0;padding:0;background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}</style>
</head>
<body>
  <div id="app"></div>
  <script>
    coffee.injectTheme('dark');
    const btn = coffee.button('Open camera', async () => {
      try {
        const { stream, videoEl } = await coffee.camera();
        document.getElementById('app').innerHTML = '';
        document.getElementById('app').appendChild(videoEl);
        const snap = coffee.button('Take photo', () => coffee.capture(videoEl).then(url => {
          const img = document.createElement('img');
          img.src = url;
          img.style.cssText = 'max-width:100%;border-radius:8px;margin-top:12px';
          document.getElementById('app').appendChild(img);
        }));
        document.getElementById('app').appendChild(snap);
      } catch (e) {
        document.getElementById('app').appendChild(coffee.msg(e.message, 'error'));
      }
    }, { backgroundColor: '#4c9aff' });
    document.getElementById('app').appendChild(btn);
  </script>
</body>
</html>

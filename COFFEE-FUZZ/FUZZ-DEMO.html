<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coffee.fuzz Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; box-sizing: border-box; }
  </style>
  <script src="../COFFEE-CONTROL/TEST/coffee-control.js"></script>
  <script src="../COFFEE-UI/coffee-ui.js"></script>
  <script src="../COFFEE-TOAST/coffee-toast.js"></script>
  <script src="../COFFEE-SYNTH/coffee-synth.js"></script>
  <script src="./coffee-fuzz.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    coffee.injectTheme('dark');

    const header = coffee.heading('coffee.fuzz', 1);
    const sub = coffee.para('Audio FX chain. Synth → reverb, delay, fuzz → output.');
    sub.style.color = 'var(--coffee-text-muted)';

    const unlockNote = coffee.para('Click any button to start AudioContext (user gesture required).', {
      style: { color: 'var(--coffee-text-muted)', fontSize: '12px', marginBottom: '12px' }
    });

    const notes = ['C4', 'E4', 'G4', 'C5'];
    const adsr = { attack: 0.05, decay: 0.1, sustain: 0.7, release: 0.3 };

    let reverbOn = false, delayOn = false, fuzzOn = false;
    let reverb, delay, fuzz;
    let chainStart = null;

    function initEffects() {
      coffee.synth.init();
      reverb = coffee.fuzz.reverb(2, 3, 0.35);
      delay = coffee.fuzz.delay({ time: 0.35, feedback: 0.45, mix: 0.4 });
      fuzz = coffee.fuzz.fuzz(0.4);
      rebuildChain();
    }

    function rebuildChain() {
      const output = coffee.synth.output;
      const active = [];
      if (reverbOn && reverb) active.push(reverb);
      if (delayOn && delay) active.push(delay);
      if (fuzzOn && fuzz) active.push(fuzz);

      if (active.length === 0) {
        chainStart = output;
      } else {
        for (let i = 0; i < active.length - 1; i++) {
          try { active[i].output.disconnect(); } catch (_) {}
          active[i].output.connect(active[i + 1].input);
        }
        try { active[active.length - 1].output.disconnect(); } catch (_) {}
        active[active.length - 1].output.connect(output);
        chainStart = active[0].input;
      }
    }

    function playNote(type) {
      if (!reverb && !delay && !fuzz) initEffects();
      const synth = new coffee.Synth(type);
      synth.connect(chainStart);
      const noteName = notes[Math.floor(Math.random() * notes.length)];
      const note = synth.play(noteName, adsr);
      setTimeout(() => note.stop(adsr.release), 800);
      const fx = [reverbOn && 'reverb', delayOn && 'delay', fuzzOn && 'fuzz'].filter(Boolean).join(' → ') || 'dry';
      if (coffee.toast) coffee.toast(`${type} + ${fx}`, 'info', 2000);
    }

    function playChord(type) {
      if (!reverb && !delay && !fuzz) initEffects();
      const synth = new coffee.Synth(type);
      synth.connect(chainStart);
      const chord = ['C4', 'E4', 'G4'].map(n => synth.play(n, adsr));
      setTimeout(() => chord.forEach(n => n.stop(adsr.release)), 1200);
      if (coffee.toast) coffee.toast('Chord', 'info', 2000);
    }

    const types = [
      { value: 'sine', label: 'Sine' },
      { value: 'square', label: 'Square' },
      { value: 'sawtooth', label: 'Saw' },
      { value: 'triangle', label: 'Triangle' }
    ];

    const waveBtns = types.map(t => coffee.button(t.label, () => playNote(t.value)));
    const chordBtn = coffee.button('Chord', () => playChord('sine'));

    const reverbToggle = coffee.button('Reverb', () => {
      reverbOn = !reverbOn;
      if (!reverb) initEffects();
      else rebuildChain();
      reverbToggle.textContent = reverbOn ? 'Reverb ✓' : 'Reverb';
    });
    const delayToggle = coffee.button('Delay', () => {
      delayOn = !delayOn;
      if (!delay) initEffects();
      else rebuildChain();
      delayToggle.textContent = delayOn ? 'Delay ✓' : 'Delay';
    });
    const fuzzToggle = coffee.button('Fuzz', () => {
      fuzzOn = !fuzzOn;
      if (!fuzz) initEffects();
      else rebuildChain();
      fuzzToggle.textContent = fuzzOn ? 'Fuzz ✓' : 'Fuzz';
    });

    const volSlider = coffee.slider({
      min: 0, max: 1, step: 0.1, value: 0.5,
      id: 'fuzz-volume',
      onInput: (v) => { coffee.synth.volume = v; }
    });

    const waveRow = coffee.row([...waveBtns, chordBtn], { style: { flexWrap: 'wrap', gap: '8px' } });
    const fxRow = coffee.row([reverbToggle, delayToggle, fuzzToggle], { style: { flexWrap: 'wrap', gap: '8px' } });
    const volRow = coffee.row([
      coffee.label('Volume', volSlider),
      volSlider
    ], { style: { alignItems: 'center', width: '100%' } });

    const card = coffee.card([
      header,
      sub,
      unlockNote,
      waveRow,
      coffee.para('FX (toggle to chain)', { style: { fontSize: '12px', color: 'var(--coffee-text-muted)', marginTop: '12px', marginBottom: '4px' } }),
      fxRow,
      volRow
    ], { style: { width: '100%', maxWidth: '440px' } });

    const app = document.getElementById('app');
    app.style.cssText = 'padding:var(--coffee-space-lg);width:100%;background:var(--coffee-bg-surface);min-height:100vh;box-sizing:border-box';
    app.appendChild(card);

    chainStart = coffee.synth.output;
  </script>
</body>
</html>

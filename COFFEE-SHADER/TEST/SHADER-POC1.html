<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shader - Pro Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #3b82f6;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #gpuCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .editor-container {
            font-family: 'Fira Code', monospace;
            background: #111;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Minimal scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Top Navigation / Brand -->
    <nav class="h-16 flex items-center justify-between px-8 border-b border-white/5 z-20 bg-black">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black italic tracking-tighter">coffee<span class="text-blue-500">.shade()</span></h1>
            <div class="h-4 w-[1px] bg-white/10"></div>
            <span class="text-[10px] font-mono text-white/40 uppercase tracking-[0.2em]">Liquid GPU Pipeline</span>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <div id="status-pulse" class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                <span id="status-text" class="text-[10px] font-bold text-white/60 uppercase">System Ready</span>
            </div>
            <button onclick="coffee.brew()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-6 py-2 rounded-full font-bold transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                Brew Shader
            </button>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        <!-- Main Viewport -->
        <main class="flex-1 relative group">
            <canvas id="gpuCanvas"></canvas>
            
            <!-- Overlay Labels -->
            <div class="absolute bottom-8 left-8 flex flex-col gap-2 pointer-events-none">
                <div class="glass-panel px-4 py-2 rounded-lg">
                    <p class="text-[10px] font-black text-white/40 uppercase mb-1">Current State</p>
                    <div id="live-vals" class="text-xs font-mono text-blue-400">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar Editor -->
        <aside class="w-[450px] border-l border-white/5 flex flex-col z-20 bg-[#0a0a0a]">
            <div class="p-6 border-b border-white/5">
                <h3 class="text-xs font-bold uppercase text-white/40 mb-2">Parameters</h3>
                <p class="text-[11px] text-white/60 leading-relaxed">
                    Edit the JSON below to manipulate the GPU kernels. 
                    <span class="text-blue-400">Time</span> is handled automatically by the engine.
                </p>
            </div>

            <div class="flex-1 editor-container p-6">
                <textarea id="jsonEditor" class="w-full h-full bg-transparent text-sm text-blue-200 outline-none resize-none leading-relaxed" spellcheck="false">{
  "color_shift": 2.5,
  "density": 8.0,
  "zoom": 1.5,
  "speed": 1.2,
  "brightness": 1.0,
  "complexity": 5.0
}</textarea>
            </div>

            <div class="p-4 bg-black/40 text-[10px] font-mono text-white/20 text-center uppercase tracking-widest">
                Coffee Engine v2.0.4 • WebGPU Native
            </div>
        </aside>
    </div>

    <script>
        const coffee = (() => {
            let device, canvas, context, pipeline, bindGroup, uniformBuffer;
            let startTime = performance.now();
            
            // The JSON object that controls the internal "complex" shader
            let params = {
                color_shift: 1.0,
                density: 5.0,
                zoom: 1.0,
                speed: 1.0,
                brightness: 1.0,
                complexity: 4.0
            };

            const shade = async () => {
                // Initial Hardware Handshake
                if (!navigator.gpu) {
                    updateStatus("WebGPU Unsupported", "bg-red-500");
                    return;
                }

                const adapter = await navigator.gpu.requestAdapter();
                device = await adapter.requestDevice();
                
                canvas = document.getElementById('gpuCanvas');
                context = canvas.getContext('webgpu');
                
                context.configure({
                    device,
                    format: navigator.gpu.getPreferredCanvasFormat(),
                    alphaMode: 'premultiplied'
                });

                // Prepare Uniform Buffer (Fixed size 64 for alignment)
                uniformBuffer = device.createBuffer({
                    size: 64,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                });

                await compilePipeline();
                brew(); // Initial Sync
                requestAnimationFrame(renderLoop);
            };

            const compilePipeline = async () => {
                const shaderCode = `
                    struct Data {
                        time: f32,
                        res: vec2<f32>,
                        shift: f32,
                        density: f32,
                        zoom: f32,
                        speed: f32,
                        bright: f32,
                        comp: f32,
                    };

                    @group(0) @binding(0) var<uniform> u : Data;

                    @vertex
                    fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4<f32> {
                        var p = array<vec2<f32>, 3>(vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
                        return vec4<f32>(p[i], 0.0, 1.0);
                    }

                    @fragment
                    fn fs(@builtin(position) pos : vec4<f32>) -> @location(0) vec4<f32> {
                        let uv = (pos.xy / u.res) * 2.0 - 1.0;
                        let aspect = u.res.x / u.res.y;
                        var p = uv * vec2<f32>(aspect, 1.0) * (1.0 / u.zoom);

                        let t = u.time * u.speed;
                        
                        // Internal Complexity Logic
                        // We use u.comp to limit or expand the iteration count
                        for(var i = 1.0; i < 10.0; i += 1.0) {
                            if (i > u.comp) { break; } 
                            p.x += 0.5 / i * sin(i * u.density * p.y + t);
                            p.y += 0.5 / i * cos(i * u.density * p.x + t);
                        }

                        let r = 0.5 + 0.5 * sin(p.x + t * u.shift);
                        let g = 0.5 + 0.5 * cos(p.y + t);
                        let b = 0.5 + 0.5 * sin(p.x + p.y + t);

                        return vec4<f32>(vec3<f32>(r, g, b) * u.bright, 1.0);
                    }
                `;

                const module = device.createShaderModule({ code: shaderCode });
                pipeline = device.createRenderPipeline({
                    layout: 'auto',
                    vertex: { module, entryPoint: 'vs' },
                    fragment: { 
                        module, entryPoint: 'fs', 
                        targets: [{ format: navigator.gpu.getPreferredCanvasFormat() }] 
                    }
                });

                bindGroup = device.createBindGroup({
                    layout: pipeline.getBindGroupLayout(0),
                    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
                });
            };

            const brew = () => {
                const editor = document.getElementById('jsonEditor');
                const liveVals = document.getElementById('live-vals');
                
                try {
                    const freshParams = JSON.parse(editor.value);
                    params = { ...params, ...freshParams };
                    
                    // Display current mapped state
                    liveVals.innerHTML = Object.entries(params)
                        .map(([k, v]) => `<div>${k}: <span class="text-white">${v}</span></div>`)
                        .join('');

                    updateStatus("Brewed Successfully", "bg-blue-500");
                } catch (e) {
                    updateStatus("JSON Syntax Error", "bg-red-500");
                }
            };

            const renderLoop = (t) => {
                if (!device || !pipeline) return;

                // Handle Resolution
                const rect = canvas.getBoundingClientRect();
                const w = canvas.width = rect.width * window.devicePixelRatio;
                const h = canvas.height = rect.height * window.devicePixelRatio;

                // Pack all JSON values into the GPU Buffer
                // Order: time, res.x, res.y, shift, density, zoom, speed, bright, comp
                const bufferData = new Float32Array([
                    t / 1000, 
                    w, h,
                    params.color_shift,
                    params.density,
                    params.zoom,
                    params.speed,
                    params.brightness,
                    params.complexity
                ]);

                device.queue.writeBuffer(uniformBuffer, 0, bufferData);

                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [{
                        view: context.getCurrentTexture().createView(),
                        clearValue: { r: 0, g: 0, b: 0, a: 1 },
                        loadOp: 'clear', storeOp: 'store'
                    }]
                });

                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.draw(3);
                pass.end();

                device.queue.submit([encoder.finish()]);
                requestAnimationFrame(renderLoop);
            };

            const updateStatus = (msg, colorClass) => {
                const text = document.getElementById('status-text');
                const light = document.getElementById('status-pulse');
                text.innerText = msg;
                light.className = `w-2 h-2 rounded-full ${colorClass} animate-pulse`;
            };

            return { shade, brew };
        })();

        // Start the engine on load
        window.addEventListener('load', coffee.shade);
    </script>
</body>
</html>
